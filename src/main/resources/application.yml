spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
          kakao:
            client-id: ${KAKAO_OAUTH_CLIENT_ID}
            client-secret: ${KAKAO_OAUTH_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
            provider: kakao
          naver:
            client-id: ${NAVER_OAUTH_CLIENT_ID}
            client-secret: ${NAVER_OAUTH_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            provider: naver
        provider:
          kakao:
            issuer-uri: https://kauth.kakao.com
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  thymeleaf:
    servlet:
      produce-partial-output-while-processing: false
  datasource:
    # 접속 정보는 환경변수로만 주입한다. 비밀번호는 저장소에 두지 않는다.
    # 로컬 개발: DB_PASSWORD 환경변수 또는 gitignore 된 application-local.yml 사용
    url: ${DB_URL:jdbc:mysql://localhost:3306/mydb?connectionTimeZone=LOCAL&characterEncoding=UTF-8}
    username: ${DB_USERNAME:localmaster}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    resources:
      static-locations: classpath:/static/
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        debug: false
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

custom:
  server-url: ${APP_BASE_URL:http://localhost:8080}
  # 재가입 차단용 이메일 해시 secret. 값은 환경변수로만 주입한다.
  email-hash-secret: ${EMAIL_HASH_SECRET:}
  # 살아 있는 초대 링크 재표시용 AES-256 키(Base64 32바이트). 값은 환경변수로만 주입한다.
  invite-token-encryption-key: ${TRAVEL_PLAN_INVITE_ENCRYPTION_KEY:}
  # 업로드 저장소. 특정 개발자의 절대경로를 고정하지 않는다.
  # 운영은 UPLOAD_PATH 환경변수로 실제 저장 경로를 지정한다.
  upload-path: ${UPLOAD_PATH:${user.home}/travlediary-uploads/}
  # /uploads/** 정적 매핑 바깥의 표지 라이브러리 공유 사진 전용 저장소.
  cover-library-private-path: ${COVER_LIBRARY_PRIVATE_PATH:${custom.upload-path}../traveldiary-cover-library-private}
  # /uploads/** 정적 매핑 바깥의 회원 개인 다이어리 사진 전용 저장소.
  # 대표 이미지·페이지 사진·적용 표지 사진·내 표지 디자인 사진이 여기에 들어간다.
  diary-private-path: ${DIARY_PRIVATE_PATH:${custom.upload-path}../traveldiary-diary-private}
  # 로그인 제한과 요청 제한이 함께 쓰는 클라이언트 주소 판별 정책.
  client-ip:
    # DIRECT           : 전달 머리말을 전혀 믿지 않는다. 늘 실제 접속 주소를 쓴다. (기본값)
    # CLOUDFLARE_TUNNEL: 아래 trusted-proxies 에서 들어온 요청의 CF-Connecting-IP 만 믿는다.
    mode: ${CLIENT_IP_MODE:DIRECT}
    # 전달 머리말을 믿어도 되는 접속 경로. 주소 하나 또는 CIDR 를 쉼표로 잇는다.
    # 비어 있으면 어떤 경로도 믿지 않는다. (mode 만 켜고 여기를 비워 두면 DIRECT 와 같다)
    # cloudflared 가 같은 기기에서 연결하는 구성이면 loopback 만 적으면 된다.
    trusted-proxies: ${CLIENT_IP_TRUSTED_PROXIES:}

server:
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        # 세션 쿠키는 스크립트가 읽을 수 없고, 다른 사이트에서 시작한 요청에는 실리지 않는다.
        http-only: true
        same-site: lax
        # HTTPS 전용 전송은 운영에서만 켠다. 로컬은 HTTP 라 기본값이 false 여야 로그인이 된다.
        # 운영 배포에서는 SESSION_COOKIE_SECURE=true 환경변수를 주거나 prod 프로파일을 쓴다.
        secure: ${SESSION_COOKIE_SECURE:false}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.travlediary.model
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: INFO

holiday:
  api-key: ${HOLIDAY_API_KEY:}

kakao:
  # 최종 파기 배치의 연결 해제 전용 Admin Key. 실제 값은 환경변수로만 넣고 저장소에 두지 않는다.
  # 비어 있으면 애플리케이션은 그대로 뜨고, SOCIAL_UNLINK task 실행 때만 설정 오류로 실패한다.
  admin-key: ${KAKAO_ADMIN_KEY:}

kto:
  photo:
    # 관광사진도 같은 공공데이터포털(B551011) 인증키를 쓴다.
    # 사진용 키를 따로 발급받았을 때만 KTO_PHOTO_API_KEY 로 덮어쓴다.
    api-key: ${KTO_PHOTO_API_KEY:${KTO_TOUR_API_KEY:}}
    base-url: https://apis.data.go.kr/B551011/PhotoGalleryService1
  tour:
    # 국문/영문/일문/중문 다섯 서비스가 같은 공공데이터포털 인증키를 쓴다.
    api-key: ${KTO_TOUR_API_KEY:}
    kor-base-url: https://apis.data.go.kr/B551011/KorService2
    eng-base-url: https://apis.data.go.kr/B551011/EngService2
    jpn-base-url: https://apis.data.go.kr/B551011/JpnService2
    chs-base-url: https://apis.data.go.kr/B551011/ChsService2
    cht-base-url: https://apis.data.go.kr/B551011/ChtService2

translation:
  monthly-character-limit-enabled: ${GOOGLE_TRANSLATION_MONTHLY_LIMIT_ENABLED:true}
  monthly-character-limit: ${GOOGLE_TRANSLATION_MONTHLY_CHARACTER_LIMIT:400000}
  daily-character-limit:
    authenticated: ${GOOGLE_TRANSLATION_DAILY_AUTHENTICATED_LIMIT:20000}
    anonymous: ${GOOGLE_TRANSLATION_DAILY_ANONYMOUS_LIMIT:5000}
    ip-hmac-secret: ${GOOGLE_TRANSLATION_DAILY_IP_HMAC_SECRET:}
  google:
    enabled: ${GOOGLE_TRANSLATION_ENABLED:false}
    project-id: ${GOOGLE_CLOUD_PROJECT:}
    location: ${GOOGLE_TRANSLATION_LOCATION:global}
    profile: ${GOOGLE_TRANSLATION_PROFILE:google-v3-general-v1}
  comment:
    max-characters: 2000
  lease-duration: 30s
  failure-retry-after: 30s
  rate-limit:
    ip-requests: 30
    user-requests: 20
    external-requests: 10
    window: 1m
  backfill:
    destination-comments:
      batch-size: 500
    post-comments:
      batch-size: 500
    user-posts:
      batch-size: 500
    courses:
      batch-size: 500
    shared-cache:
      batch-size: 500

seo:
  # 운영 환경에서는 canonical 및 sitemap에 사용할 공개 origin을 지정한다.
  site-base-url: ${SEO_SITE_BASE_URL:}

app:
  # 공개 문의 주소는 SMTP 인증 계정과 분리하며, 비어 있으면 footer에 노출하지 않는다.
  contact-email: ${CONTACT_EMAIL:}
  # 운영자명은 소스에 고정하지 않고, 비어 있으면 footer에 노출하지 않는다.
  operator-name: ${OPERATOR_NAME:}
