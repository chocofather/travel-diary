spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mydb?connectionTimeZone=LOCAL&characterEncoding=UTF-8
    username: localmaster
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    resources:
      static-locations: classpath:/static/
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        debug: false
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

custom:
  server-url: ${APP_BASE_URL:http://localhost:8080}
  # 재가입 차단용 이메일 해시 secret. 값은 환경변수로만 주입한다.
  email-hash-secret: ${EMAIL_HASH_SECRET:}
  upload-path: /Users/minjun/travlediary-uploads/ # ✅ 이 줄 추가

server:
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      tracking-modes: cookie

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.travlediary.model
  configuration:
    map-underscore-to-camel-case: true

security:
  user:
    name: admin
    password: admin

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: INFO

holiday:
  api-key: ${HOLIDAY_API_KEY:}

kto:
  photo:
    api-key: ${KTO_PHOTO_API_KEY:}
    base-url: https://apis.data.go.kr/B551011/PhotoGalleryService1
  tour:
    api-key: ${KTO_TOUR_API_KEY:}
    kor-base-url: https://apis.data.go.kr/B551011/KorService2
    eng-api-key: ${KTO_ENG_TOUR_API_KEY:}
    eng-base-url: https://apis.data.go.kr/B551011/EngService2
