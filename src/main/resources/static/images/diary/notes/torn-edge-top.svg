<!--
  찢어진 종이의 위 끝. 아래 끝(torn-edge.svg)을 위아래로 뒤집은 모양이다.
  CSS 는 mask 한 겹만 뒤집을 수 없어 조각을 따로 둔다.

  색을 담지 않는다. 검은 부분이 "종이가 남는 자리"다.
  가로로 되풀이해 붙이므로 늘려도 톱니가 커지지 않는다.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="8"
     viewBox="0 0 40 8" preserveAspectRatio="none">
  <path fill="#000"
        d="M0 8h40V4.9l-2.5-1.4-2.6 1.1-2.4-1.9-2.7 1.4-2.5-1.2-2.6 1.6-2.4-2-2.7 1.3-2.5-1.5-2.6 1.8-2.4-1.6-2.7 1.2L5 2.6 2.4 4.3 0 2.8z"/>
</svg>
