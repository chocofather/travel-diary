  이 그림은 색을 그대로 담는다. 화면은 배경 그림으로 얹기만 한다.
  (예전에는 mask 로 색을 입혔지만, 브라우저마다 크기 계산이 달라 보이지 않는 일이 있었다)
  다꾸 톤에 맞춰 흐린 장미빛 꽃잎과 차분한 세이지 잎으로 둔다.

  주석에 붙임표 두 개를 잇달아 쓰지 않는다. XML 주석이 깨져 그림 전체가 그려지지 않는다.
-->
