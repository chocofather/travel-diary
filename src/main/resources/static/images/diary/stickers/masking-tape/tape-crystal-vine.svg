      <ellipse cx="130" cy="12" rx="4.6" ry="2.2" transform="rotate(-28 130 12)"/>
    </g>
    <g fill="#a9c197">
      <ellipse cx="30" cy="28" rx="4.2" ry="2" transform="rotate(26 30 28)"/>
      <ellipse cx="70" cy="28" rx="4.2" ry="2" transform="rotate(26 70 28)"/>
      <ellipse cx="110" cy="28" rx="4.2" ry="2" transform="rotate(26 110 28)"/>
