<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 40" role="img"
     aria-label="반투명 깅엄체크 마스킹테이프 무늬">
  <rect width="24" height="40" fill="#e6eef6" fill-opacity="0.55"/>
  <!-- 가로 띠는 마디 끝까지, 세로 띠는 마디 가운데 한 줄만 둬 되풀이해도 간격이 고르다 -->
  <g fill="#bcd7ea" fill-opacity="0.8">
    <rect y="8" width="24" height="9"/>
    <rect y="25" width="24" height="9"/>
    <rect x="7.5" width="9" height="40"/>
  </g>
</svg>
