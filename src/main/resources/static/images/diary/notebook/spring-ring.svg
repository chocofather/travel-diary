<!--
  코일의 철사 고리 하나. 이 그림 한 장을 세로로 되풀이해 스프링을 만든다.

  실제 wire-o 는 한 줄 철사가 아니라 두 가닥이 나란히 감겨 있다.
  그래서 같은 고리를 반 칸 어긋나게 두 번 그린다.
  뒤 가닥은 종이 뒤로 돌아가는 쪽이라 옅고, 앞 가닥만 또렷하게 남긴다.
  앞 가닥은 위에서 아래로 밝기가 지는 금속 결을 넣고 윗면에만 가는 빛을 얹는다.

  구멍은 여기 없다. 구멍은 종이가 그린다. (CSS 의 .diary-sheet 뒤쪽 층)
  고리의 좌우 끝(x = 2 / 44)이 그 구멍 가장자리에 닿도록 폭과 간격을 맞춰 두었다.

  주석에 붙임표 두 개를 잇달아 쓰지 않는다. XML 주석이 깨져 그림 전체가 그려지지 않는다.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="46" height="41" viewBox="0 0 46 41"
     preserveAspectRatio="none">
  <defs>
    <linearGradient id="diary-spring-wire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9c2b7"/>
      <stop offset="0.42" stop-color="#a29b90"/>
      <stop offset="1" stop-color="#7c756a"/>
    </linearGradient>
  </defs>
  <ellipse cx="23" cy="22.7" rx="21" ry="6"
           fill="none" stroke="#8a8378" stroke-opacity="0.42" stroke-width="2.6"/>
  <ellipse cx="23" cy="20.2" rx="21" ry="6"
           fill="none" stroke="url(#diary-spring-wire)" stroke-width="3"/>
  <path d="M2 20.2a21 6 0 0 1 42 0"
        fill="none" stroke="#dcd6cc" stroke-opacity="0.75" stroke-width="0.9"
        stroke-linecap="round"/>
</svg>
