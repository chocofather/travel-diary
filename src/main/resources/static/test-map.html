<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer-when-downgrade">
  <title>Kakao 지도 테스트</title>

  <!-- autoload 생략 → 자동 로드 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=e5aca11993412c733289f668bac6c606"></script>
</head>
<body>
<h2>카카오 지도 테스트</h2>
<div id="map" style="width:100%; height:400px; background:#eee;"></div>

<script>
  window.onload = function () {
    const mapContainer = document.getElementById('map');
    const mapOption = {
      center: new kakao.maps.LatLng(37.5665, 126.9780),
      level: 3
    };
    new kakao.maps.Map(mapContainer, mapOption);
  };
</script>
</body>
</html>
