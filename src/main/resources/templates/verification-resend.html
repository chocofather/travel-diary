<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::body}, ~{::headFragment})}">
<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/email-verification.css">
  <script src="/js/email-domain-suggestion.js" defer></script>
  <script src="/js/email-verification.js" defer></script>
</th:block>
<th:block th:fragment="body">
  <section class="verification-page" aria-labelledby="verification-resend-title">
    <div class="verification-card verification-request-card">
      <div class="verification-icon" aria-hidden="true">✉</div>
      <p class="verification-eyebrow">EMAIL VERIFICATION</p>
      <h1 id="verification-resend-title">인증메일 다시 받기</h1>
      <p class="verification-description">
        회원가입에 사용한 이메일 주소를 입력해주세요.
      </p>

      <div class="verification-notice"
           th:if="${verificationMessage}"
           th:classappend="| is-${verificationMessageType}|"
           role="status"
           th:text="${verificationMessage}">
        인증이 필요한 계정이라면 인증메일 발송을 요청했습니다.
      </div>

      <form class="verification-request-form"
            th:action="@{/users/verification/resend}" method="post" novalidate>
        <input type="hidden" th:if="${_csrf != null}"
               th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="verification-input-group">
          <label for="resendEmail">이메일</label>
          <input type="email" id="resendEmail" name="email"
                 th:value="${submittedEmail}"
                 autocomplete="email" inputmode="email" maxlength="100" required
                 aria-describedby="resendEmailHelp resendEmailError emailSuggestionText"
                 th:attr="aria-invalid=${emailError != null}">
          <p id="resendEmailHelp" class="verification-field-help">
            인증이 필요한 계정인 경우 입력한 주소로 인증메일을 보내드립니다.
          </p>
          <p id="resendEmailError" class="verification-field-error" role="alert"
             th:if="${emailError}" th:text="${emailError}">
            유효한 이메일 주소를 입력해주세요.
          </p>
          <div id="emailSuggestion" class="verification-email-suggestion" hidden>
            <span id="emailSuggestionText"></span>
            <button type="button" id="applyEmailSuggestion">수정하기</button>
          </div>
        </div>

        <button type="submit" class="verification-submit-button">인증메일 요청</button>
      </form>

      <div class="verification-links">
        <a th:href="@{/login}">로그인 페이지</a>
        <a th:href="@{/users/register}">회원가입</a>
      </div>
    </div>
  </section>
</th:block>
</html>
