<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Diary 비밀번호 재설정</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;color:#202936;font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
       style="width:100%;background:#f4f6f8;border-collapse:collapse;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
             style="width:100%;max-width:600px;background:#ffffff;border:1px solid #e2e7ec;border-collapse:separate;border-spacing:0;border-radius:10px;overflow:hidden;">
        <tr>
          <td style="padding:24px 32px;background:#2563a6;color:#ffffff;font-size:21px;font-weight:700;letter-spacing:-.3px;">
            Travel Diary
          </td>
        </tr>
        <tr>
          <td style="padding:34px 32px 30px;">
            <h1 style="margin:0 0 16px;font-size:25px;line-height:1.4;color:#182230;letter-spacing:-.5px;">
              비밀번호를 재설정해 주세요
            </h1>
            <p style="margin:0 0 12px;font-size:16px;line-height:1.7;color:#475467;">
              Travel Diary 계정의 비밀번호 재설정 요청을 받았습니다.
            </p>
            <p style="margin:0 0 26px;font-size:16px;line-height:1.7;color:#475467;">
              아래 버튼을 눌러 새 비밀번호를 설정해주세요.
            </p>

            <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="border-collapse:collapse;">
              <tr>
                <td bgcolor="#2563a6" style="border-radius:6px;">
                  <a th:href="${resetUrl}" href="#"
                     style="display:inline-block;padding:14px 26px;color:#ffffff;text-decoration:none;font-size:16px;font-weight:700;line-height:1.2;border-radius:6px;">
                    비밀번호 재설정
                  </a>
                </td>
              </tr>
            </table>

            <p style="margin:24px 0 8px;font-size:14px;line-height:1.65;color:#667085;"
               th:text="|이 링크는 ${validMinutes}분 동안 유효합니다.|">
              이 링크는 30분 동안 유효합니다.
            </p>
            <p style="margin:0 0 10px;font-size:14px;line-height:1.65;color:#667085;">
              버튼이 작동하지 않으면 아래 주소를 브라우저에 직접 붙여넣어주세요.
            </p>
            <p style="margin:0;padding:12px 14px;background:#f6f7f8;border-radius:6px;font-size:13px;line-height:1.55;color:#344054;word-break:break-all;overflow-wrap:anywhere;"
               th:text="${resetUrl}">
              https://example.com/users/reset-password?token=example
            </p>

            <hr style="margin:28px 0 20px;border:0;border-top:1px solid #e4e7ec;">
            <p style="margin:0;font-size:13px;line-height:1.65;color:#7a8798;">
              본인이 비밀번호 재설정을 요청하지 않았다면 이 메일을 무시해주세요.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:17px 32px;background:#f8fafc;color:#8a96a6;font-size:12px;text-align:center;">
            © Travel Diary
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
