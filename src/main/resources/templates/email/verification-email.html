<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Diary 이메일 인증</title>
</head>
<body style="margin:0;padding:0;background:#f4f7fb;color:#202936;font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
       style="width:100%;background:#f4f7fb;border-collapse:collapse;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
             style="width:100%;max-width:600px;background:#ffffff;border-collapse:separate;border-spacing:0;border-radius:16px;overflow:hidden;box-shadow:0 8px 28px rgba(31,45,61,.08);">
        <tr>
          <td style="padding:28px 32px;background:#176b87;color:#ffffff;font-size:22px;font-weight:700;letter-spacing:-.3px;">
            Travel Diary
          </td>
        </tr>
        <tr>
          <td style="padding:36px 32px 32px;">
            <h1 style="margin:0 0 18px;font-size:25px;line-height:1.35;color:#182230;letter-spacing:-.6px;">
              이메일 인증을 완료해주세요
            </h1>
            <p style="margin:0 0 12px;font-size:16px;line-height:1.7;color:#445164;">
              안녕하세요. Travel Diary 회원가입을 위해 이메일 주소 확인이 필요합니다.
            </p>
            <p style="margin:0 0 28px;font-size:16px;line-height:1.7;color:#445164;">
              아래 버튼을 눌러 인증을 완료해주세요.
            </p>

            <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="border-collapse:collapse;">
              <tr>
                <td bgcolor="#176b87" style="border-radius:8px;">
                  <a th:href="${verificationUrl}" href="#"
                     style="display:inline-block;padding:14px 26px;color:#ffffff;text-decoration:none;font-size:16px;font-weight:700;line-height:1.2;border-radius:8px;">
                    이메일 인증하기
                  </a>
                </td>
              </tr>
            </table>

            <p style="margin:24px 0 8px;font-size:14px;line-height:1.6;color:#66758a;"
               th:text="|이 링크는 ${validHours}시간 동안 유효합니다.|">
              이 링크는 24시간 동안 유효합니다.
            </p>
            <p style="margin:0 0 10px;font-size:14px;line-height:1.6;color:#66758a;">
              버튼이 작동하지 않으면 아래 주소를 브라우저에 직접 붙여넣어주세요.
            </p>
            <p style="margin:0;padding:12px 14px;background:#f3f6f9;border-radius:8px;font-size:13px;line-height:1.55;color:#365168;word-break:break-all;overflow-wrap:anywhere;"
               th:text="${verificationUrl}">
              https://example.com/users/verify?token=example
            </p>

            <hr style="margin:30px 0 22px;border:0;border-top:1px solid #e4eaf0;">
            <p style="margin:0;font-size:13px;line-height:1.65;color:#7a8798;">
              본인이 회원가입을 요청하지 않았다면 이 메일을 무시해주세요.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:18px 32px;background:#f8fafc;color:#8a96a6;font-size:12px;text-align:center;">
            © Travel Diary
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
