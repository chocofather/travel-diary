<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:lang="${currentLanguageTag}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{account.recover.confirm.pageTitle}">계정 복구 확인 | Tripbora</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-page auth-flow-page">
<!-- 복구 요청 화면과 같은 공용 언어 선택 fragment. -->
<div class="login-page__topbar">
  <div th:replace="~{fragments/language-menu :: languageMenu}"></div>
</div>

<main class="login-page__main">
  <a class="login-page__brand" th:href="@{/}" th:aria-label="#{login.brand.home}"
     aria-label="Tripbora 홈으로 이동">
    <img src="/images/branding/tripbora-logo.svg" alt="Tripbora">
  </a>

  <section class="login-container" aria-labelledby="recoveryConfirmTitle">
    <header class="login-header">
      <div class="auth-flow-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3 19 6v5c0 4.4-2.8 7.7-7 10-4.2-2.3-7-5.6-7-10V6l7-3Z"></path>
          <path d="M9 12.5a3.2 3.2 0 0 1 5.7-2M15 8.5v2.6h-2.6"></path>
          <path d="M15 13a3.2 3.2 0 0 1-5.7 2M9 17v-2.6h2.6"></path>
        </svg>
      </div>
      <h1 id="recoveryConfirmTitle" th:text="#{account.recover.confirm.title}">계정을 복구하시겠습니까?</h1>
      <p th:text="#{account.recover.confirm.description}">복구하면 기존 계정과 보관 중인 데이터를 다시 이용할 수 있습니다.</p>
    </header>

    <!-- 상태 변경은 사용자가 직접 누르는 이 POST 에서만 일어난다. -->
    <form th:action="@{/users/recover-account/confirm}"
          method="post"
          id="recoverAccountConfirmForm"
          class="login-form">
      <input type="hidden" name="token" th:value="${recoveryToken}">
      <button type="submit" class="login-submit"
              th:text="#{account.recover.confirm.submit}">계정 복구</button>
    </form>

    <p class="recovery-note" th:text="#{account.recover.confirm.note}">
      링크 유효시간이 지나면 이 화면에서도 복구할 수 없습니다.
    </p>

    <nav class="account-recovery" th:aria-label="#{account.recover.confirm.nav.label}"
         aria-label="계정 복구 확인 이동">
      <a th:href="@{/login}" th:text="#{account.recover.confirm.cancel}">취소</a>
    </nav>
  </section>
</main>
<script src="/js/language-menu.js" defer></script>
</body>
</html>
