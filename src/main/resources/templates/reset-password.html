<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:lang="${currentLanguageTag}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{password.reset.pageTitle}">새 비밀번호 설정 | Travel Diary</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/login.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="login-page">
<!--
  공용 언어 선택 fragment. returnTo 가 현재 URL(쿼리 포함)이라
  ?token=... 이 그대로 유지된 채 같은 재설정 화면으로 돌아온다.
-->
<div class="login-page__topbar">
  <div th:replace="~{fragments/language-menu :: languageMenu}"></div>
</div>

<main class="login-page__main">
  <a class="login-page__brand" th:href="@{/}" th:aria-label="#{login.brand.home}"
     aria-label="Travel Diary 홈으로 이동">
    <img src="/images/logo7.png" alt="Travel Diary">
  </a>

  <section class="login-container" aria-labelledby="resetPasswordTitle">
    <header class="login-header">
      <h1 id="resetPasswordTitle" th:text="#{password.reset.title}">새 비밀번호 설정</h1>
      <p th:text="#{password.reset.description}">앞으로 로그인할 때 사용할 새로운 비밀번호를 입력해주세요.</p>
    </header>

    <!-- 문구는 컨트롤러가 현재 locale 로 이미 해석해 준다. -->
    <div class="login-feedback login-feedback--error"
         th:if="${error}"
         th:text="${error}"
         role="alert"
         aria-live="assertive"></div>

    <!-- 일치 여부 안내는 JS 가 쓰므로 현재 locale 문구를 data-* 로 넘긴다. -->
    <form th:action="@{/users/reset-password}"
          method="post"
          id="resetPasswordForm"
          class="login-form"
          th:data-password-mismatch="#{mypage.account.error.password.mismatch}">
      <input type="hidden" name="token" th:value="${token}">

      <div class="login-field">
        <label for="newPassword" th:text="#{mypage.account.password.new}">새 비밀번호</label>
        <div class="login-password-control">
          <input type="password"
                 id="newPassword"
                 name="newPassword"
                 th:placeholder="#{password.reset.field.password.placeholder}"
                 placeholder="새 비밀번호를 입력해주세요"
                 autocomplete="new-password"
                 aria-describedby="passwordPolicyHelp"
                 required>
          <button class="toggle-password hide"
                  type="button"
                  data-toggle="#newPassword"
                  th:aria-label="#{login.password.show}"
                  th:data-show-label="#{login.password.show}"
                  th:data-hide-label="#{login.password.hide}"
                  aria-label="비밀번호 표시"
                  aria-pressed="false"></button>
        </div>
        <!-- 비밀번호 정책 문구는 회원가입과 같은 key 를 그대로 쓴다. -->
        <p id="passwordPolicyHelp"
           class="login-helper"
           th:text="${passwordPolicyMessage}">
          비밀번호는 8자 이상이며, 영문, 숫자, !@#$%^&amp;*만 사용하고 특수문자를 1개 이상 포함해야 합니다.
        </p>
      </div>

      <div class="login-field">
        <label for="newPasswordConfirm"
               th:text="#{mypage.account.password.confirm}">새 비밀번호 확인</label>
        <div class="login-password-control">
          <input type="password"
                 id="newPasswordConfirm"
                 name="newPasswordConfirm"
                 th:placeholder="#{password.reset.field.passwordConfirm.placeholder}"
                 placeholder="새 비밀번호를 다시 입력해주세요"
                 autocomplete="new-password"
                 aria-describedby="passwordConfirmationHelp"
                 required>
          <button class="toggle-password hide"
                  type="button"
                  data-toggle="#newPasswordConfirm"
                  th:aria-label="#{signup.field.passwordConfirm.show}"
                  th:data-show-label="#{signup.field.passwordConfirm.show}"
                  th:data-hide-label="#{signup.field.passwordConfirm.hide}"
                  aria-label="비밀번호 확인 표시"
                  aria-pressed="false"></button>
        </div>
        <p id="passwordConfirmationHelp" class="login-helper"
           th:text="#{password.reset.field.passwordConfirm.help}">
          위에 입력한 새 비밀번호와 동일하게 입력해주세요.
        </p>
      </div>

      <button type="submit" class="login-submit"
              th:text="#{password.reset.submit}">비밀번호 변경</button>
    </form>

    <nav class="account-recovery" th:aria-label="#{password.reset.nav.label}"
         aria-label="로그인 이동">
      <a th:href="@{/login}" th:text="#{password.link.backToLogin}">로그인으로 돌아가기</a>
    </nav>
  </section>
</main>
<script src="/js/language-menu.js" defer></script>
<script src="/js/login.js" defer></script>
</body>
</html>
