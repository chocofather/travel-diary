<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>새 비밀번호 설정</title>

  <!-- 사이트의 공통 CSS가 이미 있다면 이 link만 남기고 style 블록은 지워도 됩니다 -->
  <link rel="stylesheet" href="/css/style.css">

  <style>
    /* 최소 스타일 (공통폼 없을 때만 사용) */
    .simple-form{
      max-width:360px;margin:80px auto;padding:30px;
      border:1px solid #ddd;border-radius:8px;background:#fff;
      box-shadow:0 4px 12px rgba(0,0,0,.06);
      display:flex;flex-direction:column;gap:14px;
    }
    .simple-form h2{margin-bottom:8px;text-align:center;}
    .simple-form input{
      padding:11px 12px;font-size:14px;border:1px solid #ccc;
      border-radius:6px;box-sizing:border-box;width:100%;
    }
    .simple-form button{
      padding:11px;font-size:15px;border:none;border-radius:6px;
      background:#0066cc;color:#fff;cursor:pointer;
    }
    .simple-form button:hover{background:#0056aa;}
    .alert.error{color:red;font-size:13px;text-align:center}
  </style>
</head>
<body>

<form th:action="@{/users/reset-password}" method="post" class="simple-form">
  <!-- 서버에서 전달된 토큰을 hidden 필드에 포함 -->
  <input type="hidden" name="token" th:value="${token}">

  <h2>새 비밀번호 설정</h2>

  <input type="password"
         name="newPassword"
         placeholder="8자 이상 · 특수문자 1개 이상"
         pattern="^(?=.*[!@#$%^&*]).{8,}$"
         title="8자 이상, 특수문자 1개 이상 포함"
         required>

  <button type="submit">비밀번호 변경</button>

  <!-- 토큰 만료·검증 실패 등의 오류 메시지 -->
  <p th:text="${error}" class="alert error"></p>
</form>

</body>
</html>
