<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새 비밀번호 설정 | Travel Diary</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/login.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="login-page">
<main class="login-page__main">
  <a class="login-page__brand" th:href="@{/}" aria-label="Travel Diary 홈으로 이동">
    <img src="/images/logo7.png" alt="Travel Diary">
  </a>

  <section class="login-container" aria-labelledby="resetPasswordTitle">
    <header class="login-header">
      <h1 id="resetPasswordTitle">새 비밀번호 설정</h1>
      <p>앞으로 로그인할 때 사용할 새로운 비밀번호를 입력해주세요.</p>
    </header>

    <div class="login-feedback login-feedback--error"
         th:if="${error}"
         th:text="${error}"
         role="alert"
         aria-live="assertive"></div>

    <form th:action="@{/users/reset-password}"
          method="post"
          id="resetPasswordForm"
          class="login-form">
      <input type="hidden" name="token" th:value="${token}">

      <div class="login-field">
        <label for="newPassword">새 비밀번호</label>
        <div class="login-password-control">
          <input type="password"
                 id="newPassword"
                 name="newPassword"
                 placeholder="새 비밀번호를 입력해주세요"
                 autocomplete="new-password"
                 aria-describedby="passwordPolicyHelp"
                 required>
          <button class="toggle-password hide"
                  type="button"
                  data-toggle="#newPassword"
                  aria-label="새 비밀번호 표시"
                  aria-pressed="false"></button>
        </div>
        <p id="passwordPolicyHelp"
           class="login-helper"
           th:text="${passwordPolicyMessage}">
          비밀번호는 8자 이상이며, 영문, 숫자, !@#$%^&amp;*만 사용하고 특수문자를 1개 이상 포함해야 합니다.
        </p>
      </div>

      <div class="login-field">
        <label for="newPasswordConfirm">새 비밀번호 확인</label>
        <div class="login-password-control">
          <input type="password"
                 id="newPasswordConfirm"
                 name="newPasswordConfirm"
                 placeholder="새 비밀번호를 다시 입력해주세요"
                 autocomplete="new-password"
                 aria-describedby="passwordConfirmationHelp"
                 required>
          <button class="toggle-password hide"
                  type="button"
                  data-toggle="#newPasswordConfirm"
                  aria-label="새 비밀번호 확인 표시"
                  aria-pressed="false"></button>
        </div>
        <p id="passwordConfirmationHelp" class="login-helper">
          위에 입력한 새 비밀번호와 동일하게 입력해주세요.
        </p>
      </div>

      <button type="submit" class="login-submit">비밀번호 변경</button>
    </form>

    <nav class="account-recovery" aria-label="로그인 이동">
      <a th:href="@{/login}">로그인으로 돌아가기</a>
    </nav>
  </section>
</main>
<script src="/js/login.js" defer></script>
</body>
</html>
