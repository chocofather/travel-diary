<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="ko"
      th:replace="~{layout/main :: layout(~{::body}, ~{::headFragment})}">

<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/event.css">
</th:block>

<th:block th:fragment="body">
  <section class="event-list-wrapper" aria-labelledby="event-list-title">
    <header class="event-list-header">
      <p class="event-list-eyebrow">TRAVEL DIARY EVENT</p>
      <h1 id="event-list-title">이벤트</h1>
      <p>Travel Diary에서 준비한 여행 소식과 혜택을 확인해 보세요.</p>
    </header>

    <nav class="event-tab" aria-label="이벤트 상태">
      <a th:href="@{/events(status='ongoing')}"
         th:classappend="${selectedStatus == 'ongoing'} ? 'active'"
         th:attr="aria-current=${selectedStatus == 'ongoing'} ? 'page'">진행중</a>
      <a th:href="@{/events(status='upcoming')}"
         th:classappend="${selectedStatus == 'upcoming'} ? 'active'"
         th:attr="aria-current=${selectedStatus == 'upcoming'} ? 'page'">진행예정</a>
      <a th:href="@{/events(status='ended')}"
         th:classappend="${selectedStatus == 'ended'} ? 'active'"
         th:attr="aria-current=${selectedStatus == 'ended'} ? 'page'">종료</a>
    </nav>

    <ul class="event-list" th:if="${!#lists.isEmpty(eventList)}">
      <!-- 썸네일은 event_type 기준으로 고른다. 일반 이벤트는 메인 이미지, 인포그래픽은 인포그래픽 이미지. -->
      <li class="event-card" th:each="event : ${eventList}"
          th:with="thumbnail=${(event.eventType != null and event.eventType.name() == 'STANDARD')
                       ? event.eventImg
                       : (event.posterImg != null and !#strings.isEmpty(event.posterImg)
                           ? event.posterImg : event.eventImg)}">
        <a th:href="@{/events/{id}(id=${event.id})}" class="event-card-link"
           th:classappend="${thumbnail == null or #strings.isEmpty(thumbnail)} ? 'is-text-only'">
          <!-- 이미지가 없는 이벤트는 이미지 영역 없이 텍스트 카드로 보여준다 -->
          <div class="event-card-image-wrap"
               th:if="${thumbnail != null and !#strings.isEmpty(thumbnail)}">
            <img class="event-card-image"
                 th:src="${thumbnail}"
                 onerror="this.onerror=null;this.src='/images/default.png';"
                 th:alt="|${event.title} 대표 이미지|" />
          </div>
          <div class="event-card-content">
            <span class="event-status-badge"
                  th:classappend="|is-${selectedStatus}|"
                  th:text="${selectedStatus == 'ongoing' ? '진행중' : (selectedStatus == 'upcoming' ? '진행예정' : '종료')}">진행중</span>
            <h2 class="event-title" th:text="${event.title}">이벤트 제목</h2>
            <p class="event-date" th:text="|${event.startDate} ~ ${event.endDate}|">2026-08-01 ~ 2026-08-31</p>
            <p class="event-desc" th:if="${event.description != null and !#strings.isEmpty(event.description)}"
               th:text="${event.description}">이벤트 설명</p>
          </div>
        </a>
      </li>
    </ul>

    <div class="event-empty-state" th:if="${#lists.isEmpty(eventList)}" role="status">
      <p th:if="${selectedStatus == 'ongoing'}">현재 진행 중인 이벤트가 없습니다.</p>
      <p th:if="${selectedStatus == 'upcoming'}">예정된 이벤트가 없습니다.</p>
      <p th:if="${selectedStatus == 'ended'}">종료된 이벤트가 없습니다.</p>
    </div>

    <!-- 페이지 이동 시에도 선택한 상태 탭을 유지한다 -->
    <div class="pagination-wrapper" th:if="${totalPages > 1}">
      <nav class="pagination" aria-label="이벤트 목록 페이지">
        <a th:if="${currentPage > 1}" class="page-nav" aria-label="이전 페이지"
           th:href="@{/events(status=${selectedStatus},page=${currentPage - 1},size=${pageSize})}">&#8249;</a>
        <span th:unless="${currentPage > 1}" class="page-nav is-disabled" aria-disabled="true">&#8249;</span>

        <th:block th:each="i : ${#numbers.sequence(pageStart, pageEnd)}">
          <a th:if="${i != currentPage}" class="page-number"
             th:href="@{/events(status=${selectedStatus},page=${i},size=${pageSize})}"
             th:text="${i}">1</a>
          <span th:if="${i == currentPage}" class="page-number is-current"
                aria-current="page" th:text="${i}">1</span>
        </th:block>

        <a th:if="${currentPage < totalPages}" class="page-nav" aria-label="다음 페이지"
           th:href="@{/events(status=${selectedStatus},page=${currentPage + 1},size=${pageSize})}">&#8250;</a>
        <span th:unless="${currentPage < totalPages}" class="page-nav is-disabled"
              aria-disabled="true">&#8250;</span>
      </nav>
    </div>
  </section>
</th:block>
</html>
