<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<section id="travel-info-results" class="travel-info-results" th:fragment="results">
  <div class="travel-info-results-header" aria-live="polite">
    <p th:text="#{travelInfo.list.total(${totalCount})}">총 0개의 여행정보</p>
    <nav class="travel-info-sort" th:attr="aria-label=#{travelInfo.list.sort.label}">
      <a class="travel-info-sort-option"
         th:classappend="${sort == 'latest'} ? ' is-active'"
         th:attr="aria-current=${sort == 'latest'} ? 'true' : null"
         th:href="@{/travel-info(keyword=${keyword},scope=${scope},contentType=${contentType},categoryId=${categoryIds},size=${pageSize})}"
         data-travel-info-sort data-sort-value="latest"
         th:text="#{travelInfo.list.sort.latest}">최신순</a>
      <a class="travel-info-sort-option"
         th:classappend="${sort == 'views'} ? ' is-active'"
         th:attr="aria-current=${sort == 'views'} ? 'true' : null"
         th:href="@{/travel-info(keyword=${keyword},scope=${scope},contentType=${contentType},categoryId=${categoryIds},sort='views',size=${pageSize})}"
         data-travel-info-sort data-sort-value="views"
         th:text="#{travelInfo.list.sort.views}">조회순</a>
    </nav>
  </div>

  <div class="travel-info-grid" th:if="${!#lists.isEmpty(travelInfoList)}">
    <article class="travel-info-card" th:each="info : ${travelInfoList}"
             th:classappend="${info.contentType.name() == 'FESTIVAL'} ? ' is-festival'">
      <button type="button"
              class="travel-info-bookmark-button travel-info-card-bookmark"
              th:classappend="${info.bookmarked} ? ' is-bookmarked'"
              th:data-bookmark-url="@{/bookmarks/travel-info/{id}(id=${info.id})}"
              th:data-bookmarked="${info.bookmarked}"
              th:attr="aria-pressed=${info.bookmarked},
                       aria-label=${info.bookmarked}
                         ? #{travelInfo.bookmark.remove} : #{travelInfo.bookmark.save},
                       data-label-save=#{travelInfo.bookmark.label.save},
                       data-label-saved=#{travelInfo.bookmark.label.saved},
                       data-aria-save=#{travelInfo.bookmark.save},
                       data-aria-remove=#{travelInfo.bookmark.remove},
                       data-failed-message=#{travelInfo.bookmark.failed}"
              data-travel-info-bookmark>
        <span class="travel-info-bookmark-icon" aria-hidden="true"></span>
        <span class="travel-info-bookmark-label"
              th:text="${info.bookmarked}
                       ? #{travelInfo.bookmark.label.saved}
                       : #{travelInfo.bookmark.label.save}">저장</span>
      </button>

      <div class="travel-info-thumbnail"
           th:classappend="${info.contentType.name() == 'FESTIVAL'} ? ' travel-info-festival-thumbnail'">
        <img th:if="${info.thumbnailUrl != null and !#strings.isEmpty(info.thumbnailUrl)}"
             th:src="@{${info.thumbnailUrl}}"
             th:alt="#{travelInfo.list.card.thumbnailAlt(${info.title})}">
        <div th:unless="${info.thumbnailUrl != null and !#strings.isEmpty(info.thumbnailUrl)}"
             class="travel-info-thumbnail-placeholder"
             role="img" th:attr="aria-label=#{travelInfo.list.card.noImage}">
          <span class="travel-info-placeholder-icon" aria-hidden="true">▧</span>
          <span th:text="#{travelInfo.list.card.noImage}">등록된 이미지가 없습니다</span>
        </div>
      </div>

      <div class="travel-info-card-body">
        <span class="travel-info-category" th:text="${info.categoryName}">계절여행</span>
        <h2 th:title="${info.title}">
          <a class="travel-info-card-link"
             th:href="${info.contentType.name() == 'FESTIVAL'}
                     ? @{/festivals/{id}(id=${info.id},returnUrl=${listUrl})}
                     : @{/travel-info/{id}(id=${info.id},returnUrl=${listUrl})}"
             th:text="${info.title}">여행정보 제목</a>
        </h2>
        <p class="travel-info-type-meta">
          <span th:text="${info.scope.name() == 'DOMESTIC'}
                         ? #{travelInfo.scope.domestic}
                         : #{travelInfo.scope.international}">국내</span>
          <th:block th:if="${info.contentType.name() == 'GENERAL'}">
            <span aria-hidden="true">·</span>
            <span th:text="#{travelInfo.contentType.general}">일반</span>
          </th:block>
        </p>

        <p class="travel-info-festival-period"
             th:if="${info.contentType.name() == 'FESTIVAL' and info.startDate != null and info.endDate != null}">
          <time th:datetime="${info.startDate}"
                th:text="${#temporals.format(info.startDate, 'yyyy.MM.dd')}">2026.04.01</time>
          <span aria-hidden="true">~</span>
          <time th:datetime="${info.endDate}"
                th:text="${#temporals.format(info.endDate, 'yyyy.MM.dd')}">2026.04.03</time>
        </p>

        <div class="travel-info-card-footer">
          <time th:text="${#dates.format(info.createdAt, 'yyyy.MM.dd')}">2026.04.01</time>
          <span aria-hidden="true">·</span>
          <span th:text="#{travelInfo.list.views(${info.views})}">조회 0</span>
        </div>
      </div>
    </article>
  </div>

  <div class="travel-info-empty" th:if="${#lists.isEmpty(travelInfoList)}">
    <th:block th:if="${keyword != null}">
      <p th:text="#{travelInfo.list.empty.keyword(${keyword})}">‘파리’에 해당하는 여행정보를 찾지 못했습니다.</p>
      <span th:text="#{travelInfo.list.empty.keyword.hint}">필터를 변경하거나 다른 검색어를 입력해보세요.</span>
    </th:block>
    <th:block th:unless="${keyword != null}">
      <p th:text="#{travelInfo.list.empty.filter}">조건에 맞는 여행정보가 없습니다.</p>
      <span th:text="#{travelInfo.list.empty.filter.hint}">다른 필터를 선택해 보세요.</span>
    </th:block>
  </div>

  <nav class="travel-info-pagination" th:if="${totalPages > 1}"
       th:attr="aria-label=#{travelInfo.list.pagination}">
    <a th:if="${currentPage > 1}"
       th:href="@{/travel-info(keyword=${keyword},scope=${scope},contentType=${contentType},categoryId=${categoryIds},sort=${sort == 'views' ? sort : null},page=${currentPage - 1},size=${pageSize})}"
       class="travel-info-page-direction"
       th:text="#{travelInfo.list.pagination.previous}">이전</a>
    <span th:unless="${currentPage > 1}"
          class="travel-info-page-direction is-disabled" aria-disabled="true"
          th:text="#{travelInfo.list.pagination.previous}">이전</span>

    <a th:each="pageNumber : ${#numbers.sequence(pageStart, pageEnd)}"
       th:href="@{/travel-info(keyword=${keyword},scope=${scope},contentType=${contentType},categoryId=${categoryIds},sort=${sort == 'views' ? sort : null},page=${pageNumber},size=${pageSize})}"
       th:text="${pageNumber}"
       th:classappend="${pageNumber == currentPage} ? ' is-active'"
       th:attr="aria-current=${pageNumber == currentPage} ? 'page' : null">1</a>

    <a th:if="${currentPage < totalPages}"
       th:href="@{/travel-info(keyword=${keyword},scope=${scope},contentType=${contentType},categoryId=${categoryIds},sort=${sort == 'views' ? sort : null},page=${currentPage + 1},size=${pageSize})}"
       class="travel-info-page-direction"
       th:text="#{travelInfo.list.pagination.next}">다음</a>
    <span th:unless="${currentPage < totalPages}"
          class="travel-info-page-direction is-disabled" aria-disabled="true"
          th:text="#{travelInfo.list.pagination.next}">다음</span>
  </nav>
</section>
</body>
</html>
