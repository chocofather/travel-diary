<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<section id="travel-info-results" class="travel-info-results" th:fragment="results">
  <div class="travel-info-results-header" aria-live="polite">
    <p>총 <strong th:text="${totalCount}">0</strong>개의 여행정보</p>
  </div>

  <div class="travel-info-grid" th:if="${!#lists.isEmpty(travelInfoList)}">
    <article class="travel-info-card" th:each="info : ${travelInfoList}">
      <div class="travel-info-thumbnail">
        <img th:if="${info.thumbnailUrl != null and !#strings.isEmpty(info.thumbnailUrl)}"
             th:src="@{${info.thumbnailUrl}}"
             th:alt="|${info.title} 썸네일|">
        <div th:unless="${info.thumbnailUrl != null and !#strings.isEmpty(info.thumbnailUrl)}"
             class="travel-info-thumbnail-placeholder"
             role="img" aria-label="등록된 이미지가 없습니다">
          <span class="travel-info-placeholder-icon" aria-hidden="true">▧</span>
          <span>등록된 이미지가 없습니다</span>
        </div>
      </div>

      <div class="travel-info-card-body">
        <span class="travel-info-category" th:text="${info.categoryName}">계절여행</span>
        <h2 th:text="${info.title}" th:title="${info.title}">여행정보 제목</h2>
        <p class="travel-info-type-meta">
          <span th:text="${info.scope.name() == 'DOMESTIC'} ? '국내' : '해외'">국내</span>
          <span aria-hidden="true">·</span>
          <span th:text="${info.contentType.name() == 'GENERAL'} ? '일반' : '축제'">일반</span>
        </p>

        <div class="travel-info-period"
             th:if="${info.contentType.name() == 'FESTIVAL' and info.startDate != null and info.endDate != null}">
          <span class="travel-info-period-label">축제 기간</span>
          <time th:text="${info.startDate}">2026-04-01</time>
          <span aria-hidden="true">~</span>
          <time th:text="${info.endDate}">2026-04-03</time>
        </div>

        <div class="travel-info-card-footer">
          <time th:text="${#dates.format(info.createdAt, 'yyyy.MM.dd')}">2026.04.01</time>
          <span aria-hidden="true">·</span>
          <span>조회 <span th:text="${info.views}">0</span></span>
        </div>
      </div>
    </article>
  </div>

  <div class="travel-info-empty" th:if="${#lists.isEmpty(travelInfoList)}">
    <p>조건에 맞는 여행정보가 없습니다.</p>
    <span>다른 필터를 선택해 보세요.</span>
  </div>

  <nav class="travel-info-pagination" th:if="${totalPages > 1}" aria-label="여행정보 페이지">
    <a th:if="${currentPage > 1}"
       th:href="@{/travel-info(scope=${scope},contentType=${contentType},categoryId=${categoryIds},page=${currentPage - 1},size=${pageSize})}"
       class="travel-info-page-direction">이전</a>
    <span th:unless="${currentPage > 1}"
          class="travel-info-page-direction is-disabled" aria-disabled="true">이전</span>

    <a th:each="pageNumber : ${#numbers.sequence(pageStart, pageEnd)}"
       th:href="@{/travel-info(scope=${scope},contentType=${contentType},categoryId=${categoryIds},page=${pageNumber},size=${pageSize})}"
       th:text="${pageNumber}"
       th:classappend="${pageNumber == currentPage} ? ' is-active'"
       th:attr="aria-current=${pageNumber == currentPage} ? 'page' : null">1</a>

    <a th:if="${currentPage < totalPages}"
       th:href="@{/travel-info(scope=${scope},contentType=${contentType},categoryId=${categoryIds},page=${currentPage + 1},size=${pageSize})}"
       class="travel-info-page-direction">다음</a>
    <span th:unless="${currentPage < totalPages}"
          class="travel-info-page-direction is-disabled" aria-disabled="true">다음</span>
  </nav>
</section>
</body>
</html>
