<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::body}, ~{::headFragment})}">
<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/mypage-layout.css">
  <link rel="stylesheet" href="/css/mypage-account.css?v=20260927-1">
</th:block>
<th:block th:fragment="body">
  <!-- 비밀번호 변경 전용 화면. 계정 관리 화면에서 비밀번호를 다시 확인한 회원만 들어온다. -->
  <div class="mypage-layout">
    <nav th:replace="~{fragments/mypage/navigation :: navigation('account')}"></nav>

    <section class="mypage-content mypage-account-page" aria-labelledby="account-edit-title">
      <header class="mypage-page-header">
        <p>ACCOUNT</p>
        <h1 id="account-edit-title" th:text="#{mypage.account.password.title}">비밀번호 변경</h1>
        <span th:text="#{mypage.account.password.help}">변경 후에는 안전을 위해 다시 로그인해야 합니다.</span>
      </header>

      <section class="mypage-account-panel mypage-account-verify-form"
               aria-labelledby="account-edit-title">
        <form class="mypage-password-form" th:action="@{/mypage/account/password}"
              th:object="${passwordForm}" method="post">
          <div class="mypage-account-field">
            <label for="newPassword" th:text="#{mypage.account.password.new}">새 비밀번호</label>
            <input id="newPassword" type="password" th:field="*{newPassword}"
                   autocomplete="new-password" required>
            <small th:text="#{mypage.account.password.new.help}">8자 이상이며 영문, 숫자, !@#$%^&amp;*만 사용할 수 있고 특수문자를 1개 이상 포함해야 합니다.</small>
            <p class="mypage-account-field-error" th:if="${#fields.hasErrors('newPassword')}"
               th:errors="*{newPassword}">비밀번호 오류</p>
          </div>
          <div class="mypage-account-field">
            <label for="newPasswordConfirm" th:text="#{mypage.account.password.confirm}">새 비밀번호 확인</label>
            <input id="newPasswordConfirm" type="password"
                   th:field="*{newPasswordConfirm}" autocomplete="new-password" required>
            <p class="mypage-account-field-error"
               th:if="${#fields.hasErrors('newPasswordConfirm')}"
               th:errors="*{newPasswordConfirm}">비밀번호 확인 오류</p>
          </div>
          <div class="mypage-account-global-error" th:if="${#fields.hasGlobalErrors()}"
               role="alert">
            <p th:each="error : ${#fields.globalErrors()}" th:text="${error}">비밀번호 변경 오류</p>
          </div>
          <div class="mypage-account-actions">
            <a th:href="@{/mypage/account}" th:text="#{mypage.account.cancel}">취소</a>
            <button type="submit" th:text="#{mypage.account.password.title}">비밀번호 변경</button>
          </div>
        </form>
      </section>
    </section>
  </div>
</th:block>
</html>
