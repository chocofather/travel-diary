<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::body}, ~{::headFragment})}">
<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/mypage-layout.css">
</th:block>
<th:block th:fragment="body">
  <div class="mypage-layout">
    <nav th:replace="~{fragments/mypage/navigation :: navigation('home')}"></nav>

    <section class="mypage-content" aria-labelledby="mypage-title">
      <header class="mypage-page-header">
        <p>MY PAGE</p>
        <h1 id="mypage-title" th:text="#{mypage.title}">마이페이지</h1>
        <span th:text="#{mypage.index.description}">내 프로필과 이용 메뉴를 확인할 수 있습니다.</span>
      </header>

      <article class="mypage-profile-card">
        <!-- 닉네임·이메일은 사용자 데이터라 그대로 보여 준다 -->
        <img class="mypage-profile-image"
             th:src="${profile.profileImage}"
             th:alt="#{mypage.profileImageAlt(${profile.nickname})}"
             onerror="this.onerror=null;this.src='/images/default.png';">
        <div class="mypage-profile-summary">
          <strong th:text="${profile.nickname}">여행자</strong>
          <span th:text="${profile.userEmail}">traveler@example.com</span>
        </div>
        <a class="mypage-primary-action" th:href="@{/mypage/profile}"
           th:text="#{mypage.index.manageProfile}">프로필 관리</a>
      </article>

      <section class="mypage-menu-section" aria-labelledby="mypage-menu-title">
        <h2 id="mypage-menu-title" th:text="#{mypage.index.menu.title}">이용 메뉴</h2>
        <ul class="mypage-menu-list">
          <li>
            <a class="mypage-menu-item" th:href="@{/mypage/profile}">
              <span><strong th:text="#{mypage.nav.profile}">프로필</strong><small
                  th:text="#{mypage.index.menu.profile.description}">닉네임과 프로필 이미지를 변경합니다.</small></span>
              <span class="mypage-menu-arrow" aria-hidden="true">›</span>
            </a>
          </li>
          <li>
            <a class="mypage-menu-item" th:href="@{/mypage/posts}">
              <span><strong th:text="#{mypage.nav.posts}">내가 작성한 글</strong><small
                  th:text="#{mypage.index.menu.posts.description}">내가 작성한 여행 이야기를 확인합니다.</small></span>
              <span class="mypage-menu-arrow" aria-hidden="true">›</span>
            </a>
          </li>
          <li>
            <a class="mypage-menu-item" th:href="@{/mypage/comments}">
              <span><strong th:text="#{mypage.nav.comments}">내가 작성한 댓글</strong><small
                  th:text="#{mypage.index.menu.comments.description}">내가 남긴 댓글을 확인합니다.</small></span>
              <span class="mypage-menu-arrow" aria-hidden="true">›</span>
            </a>
          </li>
          <li>
            <a class="mypage-menu-item" th:href="@{/mypage/bookmarks}">
              <span><strong th:text="#{mypage.nav.bookmarks}">북마크</strong><small
                  th:text="#{mypage.index.menu.bookmarks.description}">저장한 여행 콘텐츠를 확인합니다.</small></span>
              <span class="mypage-menu-arrow" aria-hidden="true">›</span>
            </a>
          </li>
          <li>
            <a class="mypage-menu-item" th:href="@{/support/inquiries}">
              <span><strong th:text="#{mypage.nav.inquiries}">내 문의내역</strong><small
                  th:text="#{mypage.index.menu.inquiries.description}">1:1 문의와 답변을 확인합니다.</small></span>
              <span class="mypage-menu-arrow" aria-hidden="true">›</span>
            </a>
          </li>
          <li>
            <a class="mypage-menu-item" th:href="@{/mypage/account}">
              <span>
                <strong th:text="${hasLocalPassword == false}
                        ? #{mypage.nav.account.social} : #{mypage.nav.account}">계정 및 보안</strong>
                <small th:text="${hasLocalPassword == false}
                        ? #{mypage.index.menu.account.social.description}
                        : #{mypage.index.menu.account.description}">계정 정보와 로그인 보안을 관리합니다.</small>
              </span>
              <span class="mypage-menu-arrow" aria-hidden="true">›</span>
            </a>
          </li>
        </ul>
      </section>
    </section>
  </div>
</th:block>
</html>
