<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/main :: layout(~{::body}, ~{::headFragment})">

<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/post-write.css">
  <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
  <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
  <script src="/js/editor-init.js"></script>
</th:block>

<th:block th:fragment="body">
  <section class="write-container">
    <h1 class="write-title">게시글 수정</h1>

    <form th:action="@{/post/{id}/edit(id=${post.id})}" method="post" id="post-form" class="write-form">
      <div class="form-group">
        <label for="postTypeSelect" class="select-label">카테고리</label>
        <select name="postType" id="postTypeSelect" class="input-select" required>
          <option value="QUESTION" th:selected="${post.postType.name() == 'QUESTION'}">여행질문</option>
          <option value="TIP" th:selected="${post.postType.name() == 'TIP'}">여행팁</option>
        </select>
      </div>

      <div class="form-group">
        <input type="text"
               name="title"
               id="title"
               class="input-text"
               placeholder=" "
               maxlength="255"
               required
               th:value="${post.title}">
        <label for="title" class="input-label">제목을 입력하세요</label>
      </div>

      <div class="form-group editor-group">
        <div id="editor"></div>
        <input type="hidden" name="content" id="content-input" />
        <textarea id="initial-content" hidden th:text="${post.content}"></textarea>
      </div>

      <div class="button-group">
        <button type="submit" class="btn btn-primary">수정</button>
        <a th:href="@{/post/{id}(id=${post.id})}" class="btn btn-secondary">취소</a>
      </div>
    </form>
  </section>

  <script>
    window.initToastEditor('#editor', 'content-input', 'post-form', 'initial-content');
  </script>
</th:block>
</html>
