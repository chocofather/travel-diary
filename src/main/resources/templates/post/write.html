<!-- post/write.html -->
<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="layout/main :: layout(~{::body}, ~{::headFragment})">

<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill-resize-module@2.1.3/dist/resize.css">
  <link rel="stylesheet" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <link rel="stylesheet" crossorigin
        href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-kr@5.3.0/400.css">
  <link rel="stylesheet" crossorigin
        href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-kr@5.3.0/400.css">
  <link rel="stylesheet" href="/css/quill-content.css">
  <link rel="stylesheet" href="/css/post-write.css">
  <link rel="stylesheet" href="/css/board-write-modal.css">
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/quill-resize-module@2.1.3/dist/resize.js"></script>
  <script src="/js/quill-editor-init.js"></script>
</th:block>

<th:block th:fragment="body">
  <!-- 글 종류는 진입 단계(글쓰기 선택 모달)에서 정해져 넘어온다. -->
  <section class="write-container"
           th:with="currentPostType=${postType == 'TIP' or (param.postType != null and param.postType[0] == 'TIP') ? 'TIP' : 'QUESTION'}">
    <h1 class="write-title">글쓰기</h1>
    <p class="write-guide"
       th:text="${currentPostType == 'TIP'
                 ? '직접 경험한 유용한 여행 정보를 다른 여행자와 나눠보세요.'
                 : '여행 중 궁금했던 내용을 다른 여행자에게 물어보세요.'}">
      여행 중 궁금했던 내용을 다른 여행자에게 물어보세요.
    </p>

    <div class="write-type-row">
      <span class="write-type-badge"
            th:text="${currentPostType == 'TIP' ? '여행 팁' : '여행 질문'}">여행 질문</span>
      <button type="button" class="write-type-change" data-board-write-open>종류 변경</button>
    </div>

    <form th:action="@{/post/write}" method="post" enctype="multipart/form-data" id="post-form" class="write-form">
      <!-- 카테고리: 선택 UI 없이 진입 시 정해진 값을 그대로 저장한다 (필드명/값 기존과 동일) -->
      <input type="hidden" name="postType" th:value="${currentPostType}">

      <!-- 제목: 최대 길이는 기존 값(255)을 그대로 쓴다 -->
      <div class="form-group">
        <div class="write-field-head">
          <label for="title" class="write-field-label">제목</label>
          <span class="write-field-count"><span id="title-length">0</span>/255</span>
        </div>
        <input type="text" name="title" id="title" class="input-text"
               placeholder="제목을 입력해 주세요." maxlength="255" required>
      </div>

      <!-- 에디터 -->
      <div class="form-group editor-group">
        <div class="write-field-head">
          <span class="write-field-label">내용</span>
        </div>
        <div class="post-editor-shell quill-editor-shell">
          <div id="editor" class="post-editor quill-editor"
               th:attr="data-placeholder=${currentPostType == 'TIP'
                        ? '다른 여행자에게 도움이 될 여행 팁을 공유해 주세요.'
                        : '궁금한 내용을 자세히 작성해 주세요.'}"></div>
        </div>
        <input type="hidden" name="content" id="content-input" />
      </div>

      <!-- 버튼 -->
      <div class="button-group">
        <a th:href="@{/board/list?boardType=post}" class="btn btn-secondary">취소</a>
        <button type="submit" class="btn btn-primary">등록</button>
      </div>
    </form>

    <!-- 종류 변경: 목록에서 쓰는 것과 같은 선택 모달 -->
    <div th:replace="~{board/write-modal :: writeModal}"></div>
  </section>

  <script src="/js/board-write-modal.js" defer></script>
  <script>
    // 에디터 placeholder 는 글 종류에 따라 다르게 표시한다. (툴바/기능 구성은 그대로)
    const editorElement = document.querySelector('#editor');
    const editorPlaceholder = editorElement ? editorElement.dataset.placeholder : '';
    const quill = window.initQuillEditor('#editor', 'content-input', 'post-form');
    if (quill && editorPlaceholder) {
      quill.root.dataset.placeholder = editorPlaceholder;
    }

    // 제목 글자수 표시 (최대 길이는 input maxlength 를 그대로 따른다)
    const titleInput = document.getElementById('title');
    const titleLength = document.getElementById('title-length');
    if (titleInput && titleLength) {
      titleInput.addEventListener('input', () => {
        titleLength.textContent = String(titleInput.value.length);
      });
    }
  </script>
</th:block>
</html>
