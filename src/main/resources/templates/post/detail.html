<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: layout(~{::body}, ~{::headFragment})}">

<th:block th:fragment="headFragment">
  <link rel="stylesheet" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <link rel="stylesheet" crossorigin
        href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-kr@5.3.0/400.css">
  <link rel="stylesheet" crossorigin
        href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-kr@5.3.0/400.css">
  <link rel="stylesheet" href="/css/quill-content.css">
  <link rel="stylesheet" href="/css/post-detail.css" />
  <link rel="stylesheet" href="/css/content-bookmark.css" />
  <link rel="stylesheet" href="/css/content-comment.css" />
  <script src="/js/comment-deep-link.js" defer></script>
  <script src="/js/post-comments.js" defer></script>
  <script src="/js/content-bookmarks.js" defer></script>
  <script src="/js/post-hide-modal.js" defer></script>
</th:block>

<th:block th:fragment="body">
  <main class="post-detail-container">
    <article class="post-detail">
      <header class="post-detail-header">
        <div class="post-type"
             th:text="${post.postType.name() == 'TIP' ? '여행 팁' : '여행 질문'}">여행 질문</div>
        <div class="content-detail-title-row post-title-row">
          <h1 th:text="${post.title}">게시글 제목</h1>
          <button type="button"
                  class="content-bookmark-button"
                  th:classappend="${post.bookmarked} ? ' is-bookmarked'"
                  th:data-bookmark-url="@{/bookmarks/posts/{id}(id=${post.id})}"
                  th:data-bookmarked="${post.bookmarked}"
                  th:attr="aria-pressed=${post.bookmarked}">
            <span class="content-bookmark-image" aria-hidden="true"></span>
            <span class="content-bookmark-label"
                  th:text="${post.bookmarked} ? '북마크 취소' : '북마크 저장'">북마크 저장</span>
          </button>
        </div>
        <dl class="post-meta">
          <div><dt>작성자</dt><dd><a class="content-writer-link"
                                       th:href="@{/users/{id}(id=${post.userId})}"
                                       th:text="${post.nickname}">닉네임</a></dd></div>
          <div><dt>작성일</dt><dd th:text="${#dates.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">작성일</dd></div>
          <div><dt>수정일</dt><dd th:text="${#dates.format(post.updatedAt, 'yyyy-MM-dd HH:mm')}">수정일</dd></div>
          <div><dt>조회수</dt><dd th:text="${post.views}">0</dd></div>
        </dl>
      </header>

      <section class="post-content rich-text-content" th:utext="${post.content}"></section>

      <section class="post-images" th:if="${post.images != null and !post.images.isEmpty()}">
        <img th:each="image : ${post.images}"
             th:src="${image.imageUrl}"
             alt="게시글 첨부 이미지"
             loading="lazy" />
      </section>

      <footer class="post-detail-footer">
        <!-- 한 줄 footer: 왼쪽은 목록 이동, 오른쪽은 작성자 액션 -->
        <div class="post-detail-footer-row">
          <a th:href="@{/board/list(boardType='post')}" class="back-to-list">
            <span class="back-to-list-arrow" aria-hidden="true">←</span>목록으로
          </a>
          <div class="post-detail-actions">
            <th:block th:if="${post.myPost}">
              <a th:href="@{/post/{id}/edit(id=${post.id})}" class="post-edit-button">수정</a>
              <form th:action="@{/post/{id}/delete(id=${post.id})}"
                    method="post"
                    class="post-delete-form"
                    onsubmit="return confirm('게시글을 삭제하시겠습니까?');">
                <button type="submit" class="post-delete-button">삭제</button>
              </form>
            </th:block>
            <!-- 관리자 숨김. 사유는 상시 노출하지 않고 모달에서 받는다.
                 버튼은 ADMIN 에게만 보이고 서비스에서도 권한을 다시 확인한다. -->
            <button type="button" sec:authorize="hasRole('ADMIN')"
                    class="post-hide-button" data-post-hide-open>숨김</button>
          </div>
        </div>
      </footer>

      <!-- 숨김 사유 입력 모달 (ADMIN 전용) -->
      <div sec:authorize="hasRole('ADMIN')" id="post-hide-modal" class="post-hide-modal" hidden>
        <div class="post-hide-dialog" role="dialog" aria-modal="true"
             aria-labelledby="post-hide-title">
          <button type="button" class="post-hide-close" data-post-hide-close
                  aria-label="닫기">&times;</button>
          <h2 id="post-hide-title" class="post-hide-title">게시글 숨김</h2>
          <p class="post-hide-text">이 게시글을 숨김 처리하시겠습니까?</p>
          <form th:action="@{/admin/contents/POST/{id}/hide(id=${post.id})}"
                method="post" class="post-hide-form">
            <input type="hidden" name="redirect" th:value="@{/board/list(boardType='post')}">
            <label class="post-hide-label" for="post-hide-reason">숨김 사유</label>
            <textarea id="post-hide-reason" name="reason" rows="3" maxlength="500" required
                      class="post-hide-reason" placeholder="사유를 입력해 주세요."></textarea>
            <div class="post-hide-actions">
              <button type="button" class="post-hide-cancel" data-post-hide-close>취소</button>
              <button type="submit" class="post-hide-submit">숨김 처리</button>
            </div>
          </form>
        </div>
      </div>
    </article>

    <section id="post-comments" class="post-comments content-comments" th:attr="data-post-id=${post.id}">
      <div class="content-comment-toolbar">
        <h2 class="content-comment-heading">댓글 <span id="post-comment-count">0</span></h2>
        <div class="content-comment-sort" role="group" aria-label="댓글 정렬">
          <button type="button" class="is-active" data-comment-sort="latest" aria-pressed="true">최신순</button>
          <button type="button" data-comment-sort="oldest" aria-pressed="false">오래된순</button>
          <button type="button" data-comment-sort="likes" aria-pressed="false">좋아요순</button>
        </div>
      </div>

      <form id="post-comment-form" class="post-comment-form" enctype="multipart/form-data"
            th:if="${#authorization.expression('isAuthenticated()')}">
        <label for="post-comment-content" class="sr-only">댓글 내용</label>
        <textarea id="post-comment-content"
                  name="content"
                  maxlength="2000"
                  placeholder="댓글을 입력해 주세요."
                  required></textarea>

        <!-- 선택한 사진 미리보기 (등록 전) -->
        <div class="comment-image-preview" id="post-comment-image-preview" hidden></div>

        <div class="post-comment-form-actions">
          <span class="post-comment-length"><span id="post-comment-length">0</span>/2000</span>
          <input type="file" id="post-comment-image-input" name="images" accept="image/*" multiple hidden>
          <label for="post-comment-image-input" class="image-upload-label">
            <img src="/uploads/icons/camera.png" alt="" aria-hidden="true"> 사진
          </label>
          <button type="submit">등록</button>
        </div>
      </form>

      <p class="post-comment-login" th:unless="${#authorization.expression('isAuthenticated()')}">
        댓글을 작성하려면 <a th:href="@{/login(redirect=${'/post/' + post.id})}">로그인</a>해 주세요.
      </p>

      <p id="post-comment-message" class="post-comment-message" role="alert" hidden></p>
      <ul id="post-comment-list" class="post-comment-list content-comment-list" aria-live="polite"></ul>
      <div class="content-comment-more-row">
        <button id="post-comment-more" type="button" class="content-comment-more" hidden>댓글 더보기</button>
      </div>

      <!-- 댓글 사진 확대 모달. 이동은 클릭한 댓글에 첨부된 사진 안에서만 순환한다 -->
      <div id="post-comment-image-modal" class="image-modal" style="display:none;">
        <span class="close-btn" role="button" aria-label="닫기">&times;</span>
        <button type="button" class="comment-image-nav prev" aria-label="이전 사진">&#10094;</button>
        <img class="modal-content" id="post-comment-modal-img" alt="확대 이미지">
        <button type="button" class="comment-image-nav next" aria-label="다음 사진">&#10095;</button>
      </div>
    </section>
  </main>
</th:block>
</html>
