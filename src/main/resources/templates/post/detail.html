<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::body}, ~{::headFragment})}">

<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/post-detail.css" />
  <script src="/js/post-comments.js" defer></script>
</th:block>

<th:block th:fragment="body">
  <main class="post-detail-container">
    <article class="post-detail">
      <header class="post-detail-header">
        <div class="post-type"
             th:text="${post.postType.name() == 'TIP' ? '여행 팁' : '여행 질문'}">여행 질문</div>
        <h1 th:text="${post.title}">게시글 제목</h1>
        <dl class="post-meta">
          <div><dt>작성자</dt><dd th:text="${post.nickname}">닉네임</dd></div>
          <div><dt>작성일</dt><dd th:text="${#dates.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">작성일</dd></div>
          <div><dt>수정일</dt><dd th:text="${#dates.format(post.updatedAt, 'yyyy-MM-dd HH:mm')}">수정일</dd></div>
          <div><dt>조회수</dt><dd th:text="${post.views}">0</dd></div>
        </dl>
      </header>

      <section class="post-content toastui-editor-contents" th:utext="${post.content}"></section>

      <section class="post-images" th:if="${post.images != null and !post.images.isEmpty()}">
        <img th:each="image : ${post.images}"
             th:src="${image.imageUrl}"
             alt="게시글 첨부 이미지"
             loading="lazy" />
      </section>

      <div class="post-detail-actions">
        <th:block th:if="${post.myPost}">
          <a th:href="@{/post/{id}/edit(id=${post.id})}" class="post-edit-button">수정</a>
          <form th:action="@{/post/{id}/delete(id=${post.id})}"
                method="post"
                class="post-delete-form"
                onsubmit="return confirm('게시글을 삭제하시겠습니까?');">
            <button type="submit" class="post-delete-button">삭제</button>
          </form>
        </th:block>
        <a th:href="@{/board/list(boardType='post')}" class="back-to-list">목록으로</a>
      </div>
    </article>

    <section id="post-comments" class="post-comments" th:attr="data-post-id=${post.id}">
      <h2>댓글 <span id="post-comment-count">0</span></h2>

      <form id="post-comment-form" class="post-comment-form" th:if="${#authorization.expression('isAuthenticated()')}">
        <label for="post-comment-content" class="sr-only">댓글 내용</label>
        <textarea id="post-comment-content"
                  name="content"
                  maxlength="2000"
                  placeholder="댓글을 입력해 주세요."
                  required></textarea>
        <div class="post-comment-form-actions">
          <span class="post-comment-length"><span id="post-comment-length">0</span>/2000</span>
          <button type="submit">등록</button>
        </div>
      </form>

      <p class="post-comment-login" th:unless="${#authorization.expression('isAuthenticated()')}">
        댓글을 작성하려면 <a th:href="@{/login(redirect=${'/post/' + post.id})}">로그인</a>해 주세요.
      </p>

      <p id="post-comment-message" class="post-comment-message" role="alert" hidden></p>
      <ul id="post-comment-list" class="post-comment-list" aria-live="polite"></ul>
    </section>
  </main>
</th:block>
</html>
