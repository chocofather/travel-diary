<!-- templates/board/fragment.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="boardListFragment (boardList, totalPages, currentPage, sort)">
  <div class="board-list">
    <!-- 동적 게시글 행 -->
    <div th:each="item : ${boardList}" class="board-list-row">
        <span class="board-type"
              th:text="|[${item.boardType == 'course' ? '나만의 여행코스' : (item.postType == 'TIP' ? '여행팁' : '여행질문')}]|"></span>
      <span class="board-title">
        <a th:if="${item.boardType == 'post'}"
           th:href="@{|/post/${item.id}|}"
           th:text="${item.title}"></a>
        <a th:if="${item.boardType == 'course'}"
           th:href="@{|/course/${item.id}|}"
           th:text="${item.title}"></a>
      </span>
      <span class="board-comments" th:text="|댓글: ${item.commentCount}|"></span>
      <span class="board-nickname" th:text="|작성자: ${item.nickname}|"></span>
      <span class="board-date" th:text="${item.createdAt}"></span>
      <span class="board-views" th:text="|조회수: ${item.views}|"></span>
    </div>

    <div th:if="${#lists.isEmpty(boardList)}" class="board-list-empty">
      등록된 게시글이 없습니다.
    </div>

    <!-- 페이징 버튼 -->
    <div class="board-pagination" th:if="${totalPages > 0}">
      <button th:if="${currentPage > 1}"
              th:attr="onclick=|loadBoardList(${currentPage - 1}, '${sort}')|">
        이전
      </button>
      <span th:text="|${currentPage} / ${totalPages}|"></span>
      <button th:if="${currentPage < totalPages}"
              th:attr="onclick=|loadBoardList(${currentPage + 1}, '${sort}')|">
        다음
      </button>
    </div>
  </div>
</th:block>
</html>
