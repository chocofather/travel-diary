<!-- templates/board/fragment.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="boardListFragment (boardList, totalPages, currentPage, sort)">
  <div class="board-list">
    <div th:each="item : ${boardList}"
         class="board-list-row"
         th:classappend="${item.boardType == 'course'} ? ' board-list-row--course' : ' board-list-row--post'">
      <div class="board-row-main">
        <span class="board-type"
              th:classappend="${item.boardType == 'course' ? ' board-type--course' : (item.postType == 'TIP' ? ' board-type--tip' : ' board-type--question')}"
              th:text="${item.boardType == 'course' ? '여행 코스' : (item.postType == 'TIP' ? '여행 팁' : '여행 질문')}"></span>
        <h2 class="board-title">
          <a th:if="${item.boardType == 'post'}"
             th:href="@{|/post/${item.id}|}"
             th:text="${item.title}"
             th:title="${item.title}"></a>
          <a th:if="${item.boardType == 'course'}"
             th:href="@{|/course/${item.id}|}"
             th:text="${item.title}"
             th:title="${item.title}"></a>
        </h2>
      </div>

      <div class="board-meta">
        <span class="board-meta-item board-nickname">
          <span class="board-meta-label">작성자</span>
          <a th:if="${item.userId != null}"
             class="board-meta-value board-profile-link"
             th:href="@{/users/{id}(id=${item.userId})}"
             th:text="${item.nickname}"
             th:title="${item.nickname}"></a>
          <span th:unless="${item.userId != null}"
                class="board-meta-value"
                th:text="${item.nickname}"
                th:title="${item.nickname}"></span>
        </span>
        <span class="board-meta-item board-date">
          <span class="board-meta-value"
                th:text="${item.createdAt != null and #strings.length(item.createdAt) >= 16
                    ? #strings.replace(#strings.substring(item.createdAt, 2, 16), '-', '.')
                    : item.createdAt}"></span>
        </span>
        <span class="board-meta-item board-views">
          <span class="board-meta-label">조회</span>
          <span class="board-meta-value" th:text="${item.views}"></span>
        </span>
        <span class="board-meta-item board-comments">
          <span class="board-meta-label">댓글</span>
          <span class="board-meta-value" th:text="${item.commentCount}"></span>
        </span>
        <span class="board-meta-item board-bookmarks">
          <span class="board-meta-label">북마크</span>
          <span class="board-meta-value" th:text="${item.bookmarkCount}"></span>
        </span>
      </div>
    </div>

    <div th:if="${#lists.isEmpty(boardList)}" class="board-list-empty">
      등록된 게시글이 없습니다.
    </div>

    <div class="board-pagination" th:if="${totalPages > 0}">
      <button type="button" class="board-page-button"
              th:disabled="${currentPage <= 1}"
              th:data-page="${currentPage - 1}"
              th:data-sort="${sort}"
              onclick="loadBoardList(Number(this.dataset.page), this.dataset.sort)"
              aria-label="이전 페이지">
        이전
      </button>
      <span class="board-page-status" aria-live="polite">
        <strong th:text="${currentPage}"></strong>
        <span aria-hidden="true">/</span>
        <span th:text="${totalPages}"></span>
        <span class="sr-only">페이지</span>
      </span>
      <button type="button" class="board-page-button"
              th:disabled="${currentPage >= totalPages}"
              th:data-page="${currentPage + 1}"
              th:data-sort="${sort}"
              onclick="loadBoardList(Number(this.dataset.page), this.dataset.sort)"
              aria-label="다음 페이지">
        다음
      </button>
    </div>
  </div>
</th:block>
</html>
