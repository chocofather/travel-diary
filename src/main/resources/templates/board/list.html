<!-- board/list.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="layout/main :: layout(~{::body}, ~{::headFragment})">

<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/board-list.css">
</th:block>

<th:block th:fragment="body">
  <div class="board-layout">
    <!-- 사이드바 -->
    <aside class="board-sidebar">
      <ul>
        <li><a href="/board/list"
               th:classappend="${#strings.isEmpty(boardType)} ? 'active'">전체 글보기</a></li>
        <li><a href="/board/list?boardType=post&postType=question"
               th:classappend="${boardType=='post' and postType=='question'} ? 'active'">여행 질문</a></li>
        <li><a href="/board/list?boardType=post&postType=tip"
               th:classappend="${boardType=='post' and postType=='tip'} ? 'active'">여행 팁</a></li>
        <li><a href="/board/list?boardType=course"
               th:classappend="${boardType=='course'} ? 'active'">나의 여행코스</a></li>
      </ul>
    </aside>

    <!-- 본문 -->
    <main class="board-main">
      <div class="board-list-header">
        <div class="board-heading">
          <span class="board-heading-kicker">TRAVEL TOGETHER</span>
          <h1>여행 커뮤니티</h1>
          <p>여행의 궁금증과 유용한 팁, 직접 만든 코스를 함께 나눠보세요.</p>
        </div>
      </div>

      <div class="board-sort-bar" role="group" aria-label="목록 정렬">
        <button type="button" class="board-sort-button" data-sort="latest"
                th:classappend="${sort != 'oldest' and sort != 'views' and sort != 'comments' and sort != 'bookmarks'} ? ' active'"
                th:attr="aria-pressed=${sort != 'oldest' and sort != 'views' and sort != 'comments' and sort != 'bookmarks'}"
                onclick="loadBoardList(1, 'latest')">최신순</button>
        <button type="button" class="board-sort-button" data-sort="oldest"
                th:classappend="${sort == 'oldest'} ? ' active'"
                th:attr="aria-pressed=${sort == 'oldest'}"
                onclick="loadBoardList(1, 'oldest')">오래된순</button>
        <button type="button" class="board-sort-button" data-sort="views"
                th:classappend="${sort == 'views'} ? ' active'"
                th:attr="aria-pressed=${sort == 'views'}"
                onclick="loadBoardList(1, 'views')">조회수순</button>
        <button type="button" class="board-sort-button" data-sort="comments"
                th:classappend="${sort == 'comments'} ? ' active'"
                th:attr="aria-pressed=${sort == 'comments'}"
                onclick="loadBoardList(1, 'comments')">댓글순</button>
        <button type="button" class="board-sort-button" data-sort="bookmarks"
                th:classappend="${sort == 'bookmarks'} ? ' active'"
                th:attr="aria-pressed=${sort == 'bookmarks'}"
                onclick="loadBoardList(1, 'bookmarks')">북마크순</button>
      </div>

      <div id="board-fragment-container"
           th:insert="~{board/fragment :: boardListFragment(
               ${boardList},
               ${totalPages},
               ${currentPage},
               ${sort}
           )}">
      </div>

      <div class="board-list-actions" sec:authorize="isAuthenticated()">
        <a th:href="${boardType == 'course'} ? @{/course/write} : @{/post/write}"
           class="board-write-btn">글쓰기</a>
      </div>
    </main>
  </div>
  <script src="/js/board-ajax.js" defer></script>
</th:block>
</html>
