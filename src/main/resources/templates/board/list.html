<!-- board/list.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="layout/main :: layout(~{::body}, ~{::headFragment})">

<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/board-list.css">
  <script src="/js/country-combobox.js" defer></script>
</th:block>

<th:block th:fragment="body">
  <div class="board-layout">
    <!-- 사이드바 -->
    <aside class="board-sidebar">
      <ul>
        <li><a href="/board/list"
               th:classappend="${#strings.isEmpty(boardType)} ? 'active'">전체 글보기</a></li>
        <li><a href="/board/list?boardType=post&postType=question"
               th:classappend="${boardType=='post' and postType=='question'} ? 'active'">여행 질문</a></li>
        <li><a href="/board/list?boardType=post&postType=tip"
               th:classappend="${boardType=='post' and postType=='tip'} ? 'active'">여행 팁</a></li>
        <li><a href="/board/list?boardType=course"
               th:classappend="${boardType=='course'} ? 'active'">나의 여행코스</a></li>
      </ul>
    </aside>

    <!-- 본문 -->
    <main class="board-main">
      <div class="board-list-header">
        <div class="board-heading">
          <span class="board-heading-kicker">TRAVEL TOGETHER</span>
          <h1>여행 커뮤니티</h1>
          <p>여행의 궁금증과 유용한 팁, 직접 만든 코스를 함께 나눠보세요.</p>
        </div>
      </div>

      <section th:if="${courseBoard}" class="board-country-filter" aria-label="여행코스 국가 필터">
        <nav class="board-scope-options" aria-label="코스 범위">
          <a th:href="@{/board/list(boardType='course',scope='all',sort=${sort},size=${pageSize})}"
             class="board-scope-link board-scope-link--all"
             onclick="changeBoardScope(event, 'all')"
             th:classappend="${scope == 'all'} ? ' active'"
             th:attr="aria-current=${scope == 'all'} ? 'page'">전체</a>
          <a th:href="@{/board/list(boardType='course',scope='domestic',sort=${sort},size=${pageSize})}"
             class="board-scope-link board-scope-link--domestic"
             onclick="changeBoardScope(event, 'domestic')"
             th:classappend="${scope == 'domestic'} ? ' active'"
             th:attr="aria-current=${scope == 'domestic'} ? 'page'">국내</a>
          <a th:href="@{/board/list(boardType='course',scope='overseas',sort=${sort},size=${pageSize})}"
             class="board-scope-link board-scope-link--overseas"
             onclick="changeBoardScope(event, 'overseas')"
             th:classappend="${scope == 'overseas'} ? ' active'"
             th:attr="aria-current=${scope == 'overseas'} ? 'page'">해외</a>
        </nav>

        <div th:if="${scope == 'overseas'}"
             class="board-country-select-wrap"
             th:attr="data-selected-country-id=${countryId},data-selected-country-name=${countryName}">
          <label for="board-country-input">국가</label>
          <div class="board-country-combobox">
            <span class="board-country-search-icon" aria-hidden="true"></span>
            <input type="text"
                   id="board-country-input"
                   th:value="${countryName}"
                   placeholder="국가명을 검색하세요"
                   autocomplete="off"
                   role="combobox"
                   aria-autocomplete="list"
                   aria-expanded="false"
                   aria-controls="board-country-listbox" />
            <div id="board-country-listbox"
                 class="board-country-option-list"
                 role="listbox"
                 aria-label="해외 국가"
                 hidden>
              <button type="button"
                      id="board-country-option-all"
                      class="board-country-option"
                      role="option"
                      data-country-id=""
                      data-country-name="전체 국가"
                      th:attr="aria-selected=${countryId == null}">전체 국가</button>
              <button th:each="country, countryStatus : ${overseasCourseCountries}"
                      type="button"
                      class="board-country-option"
                      role="option"
                      th:id="|board-country-option-${countryStatus.index}|"
                      th:attr="data-country-id=${country.id},
                               data-country-name=${country.regionName},
                               aria-selected=${countryId != null and countryId == country.id}"
                      th:text="${country.regionName}">국가명</button>
              <p id="board-country-option-empty" class="board-country-option-empty" hidden>
                일치하는 국가가 없습니다.
              </p>
            </div>
          </div>
        </div>
      </section>

      <div class="board-sort-bar" role="group" aria-label="목록 정렬">
        <button type="button" class="board-sort-button" data-sort="latest"
                th:classappend="${sort != 'oldest' and sort != 'views' and sort != 'comments' and sort != 'bookmarks'} ? ' active'"
                th:attr="aria-pressed=${sort != 'oldest' and sort != 'views' and sort != 'comments' and sort != 'bookmarks'}"
                onclick="loadBoardList(1, 'latest')">최신순</button>
        <button type="button" class="board-sort-button" data-sort="oldest"
                th:classappend="${sort == 'oldest'} ? ' active'"
                th:attr="aria-pressed=${sort == 'oldest'}"
                onclick="loadBoardList(1, 'oldest')">오래된순</button>
        <button type="button" class="board-sort-button" data-sort="views"
                th:classappend="${sort == 'views'} ? ' active'"
                th:attr="aria-pressed=${sort == 'views'}"
                onclick="loadBoardList(1, 'views')">조회수순</button>
        <button type="button" class="board-sort-button" data-sort="comments"
                th:classappend="${sort == 'comments'} ? ' active'"
                th:attr="aria-pressed=${sort == 'comments'}"
                onclick="loadBoardList(1, 'comments')">댓글순</button>
        <button type="button" class="board-sort-button" data-sort="bookmarks"
                th:classappend="${sort == 'bookmarks'} ? ' active'"
                th:attr="aria-pressed=${sort == 'bookmarks'}"
                onclick="loadBoardList(1, 'bookmarks')">북마크순</button>
      </div>

      <div id="board-fragment-container"
           th:insert="~{board/fragment :: boardListFragment(
               ${boardList},
               ${totalPages},
               ${currentPage},
               ${sort}
           )}">
      </div>

      <div class="board-list-actions" sec:authorize="isAuthenticated()">
        <a th:href="${boardType == 'course'} ? @{/course/write} : @{/post/write}"
           class="board-write-btn">글쓰기</a>
      </div>
    </main>
  </div>
  <script src="/js/board-ajax.js" defer></script>
</th:block>
</html>
