<!-- templates/destination/fragment.html -->

<!-- ─── region-bar + 리스트를 한 번에 감싸는 프래그먼트 ─── -->
<th:block th:fragment="regionFragment(
    cities,
    destinations,
    subregions,
    selectedSubregionId,
    selectedCityId,
    selectedCityName,
    totalPages,
    currentPage,
    pageSize,
    sort,
    type,
    regionDisplayNames
)">
    <div id="region-fragment-container">
        <!-- ─── 상단 region-bar ─── -->
        <div class="region-bar-wrapper" th:attr="data-type=${type}">
            <section class="region-selector">
                <button class="arrow prev" th:if="${cities.size()} >= 12"
                        th:aria-label="#{destination.list.region.previous}">‹</button>
                <div th:class="'region-buttons ' +
                       (${cities.size()} <= 3 ? 'few' :
                        (${cities.size()} >= 7 ? 'scrollable' : 'normal'))">
                    <div th:each="c : ${cities}"
                         th:class="'circle-btn region-btn' + (${selectedCityId} == ${c.id} ? ' selected' : '')"
                         th:attr="data-region-id=${c.id},data-depth=${c.depth}">
                        <img th:src="@{${c.iconPath}}"
                             th:alt="#{destination.list.region.iconAlt(${regionDisplayNames[c.id]})}"
                             class="circle-icon"/>
                        <span th:text="${regionDisplayNames[c.id]}">도시명</span>
                    </div>
                </div>
                <button class="arrow next" th:if="${cities.size()} >= 12"
                        th:aria-label="#{destination.list.region.next}">›</button>
            </section>
        </div>

        <!-- ─── 리스트 영역 (여기만 바뀜) ─── -->
        <div th:insert="~{destination/fragment :: destinationList(
         ${destinations},
         ${subregions},
         ${selectedSubregionId},
         ${selectedCityId},
         ${selectedCityName},
         ${totalPages},
         ${currentPage},
         ${pageSize},
         ${sort},
         ${type},
         ${regionDisplayNames}
       )}">
        </div>
    </div>
</th:block>

<!-- ─── AJAX 로 교체될 리스트 부분만 정의된 프래그먼트 ─── -->
<th:block th:fragment="destinationList(
    destinations,
    subregions,
    selectedSubregionId,
    selectedCityId,
    selectedCityName,
    totalPages,
    currentPage,
    pageSize,
    sort,
    type,
    regionDisplayNames
)">
    <!-- 지금 목록의 쪽 크기와 고른 카테고리(하나). 정렬·쪽·지역을 바꿀 때 스크립트가 그대로 이어 보낸다. -->
    <div id="destination-list"
         th:attr="data-page-size=${pageSize},data-category=${selectedCategoryId}">

        <div class="destination-list-wrapper">
            <h1 id="page-title">
                <span th:if="${selectedCityName != null}"
                      th:text="#{destination.list.title.region(${selectedCityName})}">서울 여행지</span>
                <span th:if="${selectedCityName == null and type == 'overseas'}"
                      th:text="#{destination.list.title.international}">해외 여행지</span>
                <span th:if="${selectedCityName == null and type != 'overseas'}"
                      th:text="#{destination.list.title.domestic}">국내 여행지</span>
            </h1>
            <!-- 하위 지역(구/군) -->
            <section class="subregion-selector"
                     th:if="${subregions != null and #lists.size(subregions) > 0}">
                <button class="arrow prev subregion-arrow" th:if="${subregions.size()} >= 12"
                        th:aria-label="#{destination.list.subregion.previous}">‹</button>
                <div class="subregion-scroll-container">
                    <div class="subregion-list">
                        <button class="subregion-btn"
                                th:each="r : ${subregions}"
                                th:classappend="${selectedSubregionId} == ${r.id} ? ' selected' : ''"
                                th:attr="data-city-id=${r.id}"
                                th:text="${regionDisplayNames[r.id]}">
                            하위 지역
                        </button>
                    </div>
                </div>
                <button class="arrow next subregion-arrow" th:if="${subregions.size()} >= 12"
                        th:aria-label="#{destination.list.subregion.next}">›</button>
            </section>

            <!-- 목록 도구줄: 카테고리 필터 · 정렬 -->
            <div class="list-toolbar">
            <!--
              카테고리 필터(하나만 고른다): 누르면 작은 메뉴가 열리고, 항목을 누르면 바로 그 카테고리 목록으로 바뀌며 닫힌다.
              '전체'는 필터를 푼다. 이름·순서는 DB 번역 데이터(요청 언어 이름순) 그대로다.
            -->
            <div class="category-filter" data-category-filter
                 th:if="${categoryFilterOptions != null and !#lists.isEmpty(categoryFilterOptions)}">
                <button type="button" class="category-filter-toggle" data-category-filter-toggle
                        aria-haspopup="true" aria-expanded="false" aria-controls="destination-category-panel">
                    <span th:text="#{destination.list.category.label}">카테고리</span>
                    <span class="category-filter-dot" aria-hidden="true">·</span>
                    <strong th:text="${selectedCategoryName != null} ? ${selectedCategoryName}
                                     : #{destination.list.category.all}">전체</strong>
                    <span class="category-filter-caret" aria-hidden="true"></span>
                </button>
                <div class="category-filter-panel" id="destination-category-panel"
                     data-category-filter-panel hidden
                     th:attr="aria-label=#{destination.list.category.panel}">
                    <div class="category-filter-options">
                        <button type="button" class="category-filter-option" data-category-filter-option value=""
                                th:attr="aria-pressed=${selectedCategoryId == null}"
                                th:text="#{destination.list.category.all}">전체</button>
                        <button type="button" class="category-filter-option" data-category-filter-option
                                th:each="option : ${categoryFilterOptions}"
                                th:value="${option.id}" th:attr="aria-pressed=${option.selected}"
                                th:text="${option.name}">고궁</button>
                    </div>
                </div>
            </div>

            <!-- 정렬 (세그먼트 컨트롤) -->
            <div class="list-sort-buttons" role="group"
                 th:aria-label="#{destination.list.sort.label}">
                <!-- 최초 진입에는 sort 가 비어 있으므로 기본순을 선택 상태로 본다 -->
                <button type="button" class="sort-btn"
                        th:classappend="${sort == null or sort == 'default'} ? ' active' : ''"
                        th:attr="aria-pressed=${sort == null or sort == 'default'} ? 'true' : 'false'"
                        data-sort="default"
                        th:text="#{destination.list.sort.default}">기본순</button>
                <button type="button" class="sort-btn"
                        th:classappend="${sort} == 'views' ? ' active' : ''"
                        th:attr="aria-pressed=${sort} == 'views' ? 'true' : 'false'"
                        data-sort="views"
                        th:text="#{destination.list.sort.views}">조회수순</button>
                <button type="button" class="sort-btn"
                        th:classappend="${sort} == 'bookmarks' ? ' active' : ''"
                        th:attr="aria-pressed=${sort} == 'bookmarks' ? 'true' : 'false'"
                        data-sort="bookmarks"
                        th:text="#{destination.list.sort.bookmarks}">북마크순</button>
            </div>
            </div>

            <!-- 조건에 맞는 여행지가 없을 때 -->
            <div class="destination-list-empty" th:if="${#lists.isEmpty(destinations)}">
                <p th:text="#{destination.list.empty.title}">조건에 맞는 여행지가 없습니다.</p>
                <span th:if="${selectedCategoryId != null}"
                      th:text="#{destination.list.empty.categoryHint}">다른 카테고리나 전체를 골라 보세요.</span>
            </div>

            <!-- 카드 리스트 -->
            <div class="destination-card-list">
                <div th:each="d : ${destinations}" class="destination-card-wrapper">
                    <a th:href="@{|/destinations/${d.id}|}" class="destination-card"
                       th:attr="data-destination-id=${d.id}">
                        <div class="destination-card-media">
                            <!--
                              여행지 업로드 사진은 카드 크기 썸네일(메인 추천 카드와 같은 규칙)을 쓰고,
                              외부 주소·기본 이미지는 원래 주소 그대로 둔다. 썸네일을 받지 못하면 원본으로 한 번 되돌린다.
                              sizes 는 destination.css 의 카드 격자(4열 → 2열 → 1열) 폭에, 4:3 칸을 cover 로 채울 때의
                              사진 폭 배율(가로로 긴 사진일수록 큼)을 곱한 값이다. srcset 의 폭은 실제 픽셀 그대로다.
                            -->
                            <img th:if="${d.thumbnailPath != null}"
                                 th:src="${d.cardImageUrl != null} ? ${d.cardImageUrl} : @{${d.thumbnailPath}}"
                                 th:with="k=${d.cardImageCoverScale}"
                                 th:attr="srcset=${d.cardImageSrcset},
                                          sizes=${d.cardImageSrcset != null} ? ('(max-width: 600px) calc(100vw * ' + ${k} + '), (max-width: 1024px) calc((50vw - 20px) * ' + ${k} + '), (max-width: 1300px) calc((25vw - 28px) * ' + ${k} + '), calc(301px * ' + ${k} + ')') : null,
                                          data-original-src=${d.cardImageUrl != null} ? @{${d.thumbnailPath}} : null"
                                 onerror="if (this.dataset.originalSrc) { this.removeAttribute('srcset'); this.src = this.dataset.originalSrc; delete this.dataset.originalSrc; }"
                                 th:alt="#{destination.list.card.imageAlt(${d.name})}" loading="lazy"/>
                        </div>
                        <div class="card-text-wrapper">
                            <h3 th:text="${d.name}">여행지명</h3>
                            <p class="short-description"
                               th:if="${d.shortDescription != null}"
                               th:text="${d.shortDescription}">간단 설명</p>
                            <div class="card-meta">
                                <p class="region"><span th:text="#{destination.list.card.region}">지역:</span>
                                    <span th:text="${d.regionName}">지역명</span></p>
                                <span class="card-comment-count">
                                    <img src="/uploads/icons/comment.png"
                                         th:alt="#{destination.list.card.comments}" />
                                    <span th:text="${d.commentCount}">0</span>
                                </span>
                            </div>
                        </div>
                    </a>
                    <button type="button" class="bookmark-icon"
                            th:aria-label="${d.bookmarked} ? #{destination.list.card.bookmark.remove} : #{destination.list.card.bookmark.add}"
                            th:attr="
                            data-bookmarked=${d.bookmarked},
                            data-target-type='DESTINATION',
                            data-target-id=${d.id}
                        ">
                        <img th:src="@{'/uploads/icons/' + (${d.bookmarked} ? 'bookmark2' : 'bookmark') + '.png'}"
                             th:alt="${d.bookmarked} ? #{destination.list.card.bookmark.remove} : #{destination.list.card.bookmark.add}" />
                    </button>
                </div>
            </div>

            <!-- 페이징 -->
            <div class="pagination-wrapper" th:if="${totalPages > 1}">
                <nav class="pagination" th:aria-label="#{destination.list.pagination.label}">
                    <a th:if="${currentPage > 1}" class="page-nav"
                       th:aria-label="#{destination.list.pagination.previous}"
                       th:href="@{/destinations/fragment(type=${type},
                                              region=${selectedSubregionId != null ? selectedSubregionId : selectedCityId},
                                              page=${currentPage - 1},
                                              size=${pageSize},
                                              sort=${sort},
                                              category=${selectedCategoryId})}">&#8249;</a>
                    <span th:unless="${currentPage > 1}" class="page-nav is-disabled"
                          aria-disabled="true">&#8249;</span>

                    <th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
                        <a th:if="${i != currentPage}" class="page-number"
                           th:href="@{/destinations/fragment(type=${type},
                                                region=${selectedSubregionId != null ? selectedSubregionId : selectedCityId},
                                                page=${i},
                                                size=${pageSize},
                                                sort=${sort},
                                                category=${selectedCategoryId})}"
                           th:text="${i}">i</a>
                        <span th:if="${i == currentPage}" class="page-number is-current"
                              aria-current="page" th:text="${i}">1</span>
                    </th:block>

                    <a th:if="${currentPage < totalPages}" class="page-nav"
                       th:aria-label="#{destination.list.pagination.next}"
                       th:href="@{/destinations/fragment(type=${type},
                                              region=${selectedSubregionId != null ? selectedSubregionId : selectedCityId},
                                              page=${currentPage + 1},
                                              size=${pageSize},
                                              sort=${sort},
                                              category=${selectedCategoryId})}">&#8250;</a>
                    <span th:unless="${currentPage < totalPages}" class="page-nav is-disabled"
                          aria-disabled="true">&#8250;</span>
                </nav>
            </div>
        </div>
    </div>
</th:block>
