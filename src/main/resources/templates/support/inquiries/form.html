<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::body}, ~{::headFragment})}">
<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/support-layout.css">
  <link rel="stylesheet" href="/css/support-inquiries.css">
</th:block>
<th:block th:fragment="body">
  <div class="support-layout">
    <nav th:replace="~{fragments/support/navigation :: navigation('inquiries')}"></nav>
    <section class="support-inquiry-page support-layout-content" aria-labelledby="support-inquiry-form-title">
      <header class="support-inquiry-page-header">
        <p th:text="#{support.title}">고객센터</p>
        <h1 id="support-inquiry-form-title" th:text="${formTitle}">1:1 문의하기</h1>
        <span th:text="${formDescription}">문의 내용을 자세히 남겨주시면 확인 후 답변해드립니다.</span>
      </header>

      <nav th:replace="~{fragments/support/inquiry-tabs :: tabs(${activeInquiryTab})}"></nav>

      <form th:action="${formAction}" method="post"
            th:object="${inquiryForm}" class="support-inquiry-form">
        <div class="support-inquiry-alert" th:if="${#fields.hasGlobalErrors()}" role="alert">
          <p th:each="error : ${#fields.globalErrors()}" th:text="${error}">입력 오류</p>
        </div>

        <div class="support-inquiry-field">
          <label for="inquiry-type" th:text="#{support.inquiry.form.type}">문의 유형</label>
          <select id="inquiry-type" th:field="*{inquiryType}"
                  th:classappend="${#fields.hasErrors('inquiryType')} ? ' is-invalid' : ''"
                  required>
            <option value="" th:text="#{support.inquiry.form.type.placeholder}">문의 유형을 선택하세요</option>
            <!-- 저장값은 enum 이름 그대로이고 화면 문구만 언어별로 고른다 -->
            <option th:each="type : ${inquiryTypes}"
                    th:value="${type}"
                    th:text="#{'support.inquiry.type.' + ${type.name()}}">회원/계정</option>
          </select>
          <p class="support-inquiry-field-error" th:if="${#fields.hasErrors('inquiryType')}"
             th:errors="*{inquiryType}">문의 유형 오류</p>
        </div>

        <div class="support-inquiry-field">
          <label for="inquiry-subject" th:text="#{support.inquiry.form.subject}">제목</label>
          <input id="inquiry-subject" type="text" th:field="*{subject}"
                 maxlength="255" th:placeholder="#{support.inquiry.form.subject.placeholder}"
                 th:classappend="${#fields.hasErrors('subject')} ? ' is-invalid' : ''"
                 required>
          <p class="support-inquiry-field-error" th:if="${#fields.hasErrors('subject')}"
             th:errors="*{subject}">제목 오류</p>
        </div>

        <div class="support-inquiry-field">
          <label for="inquiry-content" th:text="#{support.inquiry.form.content}">문의 내용</label>
          <textarea id="inquiry-content" th:field="*{content}"
                    maxlength="5000" rows="12"
                    th:placeholder="#{support.inquiry.form.content.placeholder}"
                    th:classappend="${#fields.hasErrors('content')} ? ' is-invalid' : ''"
                    required></textarea>
          <p class="support-inquiry-field-help"
             th:text="#{support.inquiry.form.content.help(${maxContentLength})}">최대 5,000자까지 입력할 수 있습니다.</p>
          <p class="support-inquiry-field-error" th:if="${#fields.hasErrors('content')}"
             th:errors="*{content}">문의 내용 오류</p>
        </div>

        <div class="support-inquiry-form-actions">
          <a th:href="${cancelUrl}" th:text="#{support.inquiry.form.cancel}">취소</a>
          <button type="submit" th:text="${submitLabel}">문의 등록</button>
        </div>
      </form>
    </section>
  </div>
</th:block>
</html>
