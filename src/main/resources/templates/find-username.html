<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아이디 찾기 | Travel Diary</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-page">
<main class="login-page__main">
  <a class="login-page__brand" th:href="@{/}" aria-label="Travel Diary 홈으로 이동">
    <img src="/images/logo7.png" alt="Travel Diary">
  </a>

  <section class="login-container" aria-labelledby="recoveryTitle">
    <div th:unless="${recoveryRequested}">
      <header class="login-header">
        <h1 id="recoveryTitle">아이디 찾기</h1>
        <p>가입한 이메일을 입력하면 아이디 안내 메일을 보내드려요.</p>
      </header>

      <form method="post"
            th:action="@{/users/find-username}"
            class="login-form">
        <div class="login-field">
          <label for="findUsernameEmail">가입 이메일</label>
          <input type="email"
                 id="findUsernameEmail"
                 name="userEmail"
                 placeholder="이메일을 입력해주세요"
                 autocomplete="email"
                 inputmode="email"
                 required>
        </div>

        <button type="submit" class="login-submit">아이디 안내 메일 받기</button>
      </form>

      <nav class="account-recovery" aria-label="계정 복구 이동">
        <a th:href="@{/users/find-password}">비밀번호 재설정</a>
        <span aria-hidden="true"></span>
        <a th:href="@{/login}">로그인으로 돌아가기</a>
      </nav>
    </div>

    <div class="recovery-complete"
         th:if="${recoveryRequested}"
         role="status"
         aria-live="polite">
      <header class="login-header">
        <h1 id="recoveryTitle">아이디 안내를 요청했어요</h1>
        <p>입력하신 이메일과 일치하는 계정이 있다면 아이디 안내 메일을 보내드렸습니다.</p>
      </header>
      <p class="recovery-note">메일이 보이지 않는다면 스팸함도 확인해 주세요.</p>
      <nav class="account-recovery" aria-label="완료 후 이동">
        <a th:href="@{/login}">로그인으로 돌아가기</a>
        <span aria-hidden="true"></span>
        <a th:href="@{/users/find-password}">비밀번호 재설정</a>
      </nav>
    </div>
  </section>
</main>
</body>
</html>
