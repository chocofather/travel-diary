<!-- templates/admin/index.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/admin :: layout(~{::body}, ~{::headFragment}, 'dashboard')}">

<th:block th:fragment="headFragment"></th:block>

<th:block th:fragment="body">
<section class="admin-dashboard">
    <th:block sec:authorize="hasRole('ADMIN')">
        <header class="admin-dashboard-header">
            <h1>관리자 대시보드</h1>
            <p>사이트 콘텐츠와 운영 기능을 관리합니다.</p>
        </header>

        <div class="admin-dashboard-grid">
            <article class="admin-dashboard-card">
                <h2>여행지 관리</h2>
                <p>여행지와 지역 정보를 관리합니다.</p>
                <div class="admin-dashboard-actions">
                    <a class="admin-dashboard-link" th:href="@{/admin/destinations}">여행지 관리</a>
                    <a class="admin-dashboard-link" th:href="@{/admin/categories}">여행지 카테고리</a>
                    <a class="admin-dashboard-link" th:href="@{/admin/region-categories}">지역·도시</a>
                    <a class="admin-dashboard-link" th:href="@{/admin/amenities/list}">편의시설</a>
                </div>
            </article>

            <article class="admin-dashboard-card">
                <h2>여행정보 관리</h2>
                <p>국내·해외 여행정보와 주제 카테고리를 관리합니다.</p>
                <div class="admin-dashboard-actions">
                    <a class="admin-dashboard-link" th:href="@{/admin/travel-info}">여행정보</a>
                    <a class="admin-dashboard-link" th:href="@{/admin/info-categories}">정보 카테고리</a>
                </div>
            </article>

            <article class="admin-dashboard-card">
                <h2>이벤트 관리</h2>
                <p>이벤트 콘텐츠를 관리합니다.</p>
                <div class="admin-dashboard-actions">
                    <a class="admin-dashboard-link" th:href="@{/admin/event/list}">이벤트 관리</a>
                </div>
            </article>

            <article class="admin-dashboard-card">
                <h2>고객지원 관리</h2>
                <p>공지사항과 FAQ, 사용자 문의를 관리합니다.</p>
                <div class="admin-dashboard-actions">
                    <a class="admin-dashboard-link" th:href="@{/admin/notices}">공지사항</a>
                    <a class="admin-dashboard-link" th:href="@{/admin/faqs}">자주 묻는 질문</a>
                    <a class="admin-dashboard-link" th:href="@{/admin/inquiries}">1:1 문의</a>
                </div>
            </article>
        </div>
    </th:block>
</section>
</th:block>
</html>
