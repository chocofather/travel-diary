<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="metadataTemplate">
  <!-- 파일 선택 뒤 JS가 이미지별로 복제하고 실제 request parameter name을 붙인다. -->
  <template data-destination-image-metadata-template>
    <div class="admin-image-metadata-fields" data-image-license-fields>
      <label>
        <span>출처</span>
        <input type="text" maxlength="100" placeholder="예: 한국관광공사"
               data-image-metadata-field="sourceName">
      </label>
      <label>
        <span>촬영자</span>
        <input type="text" maxlength="100" placeholder="예: 김지호"
               data-image-metadata-field="photographer">
      </label>
      <label>
        <span>라이선스</span>
        <select data-image-metadata-field="licenseType">
          <option value="">선택 안 함</option>
          <option th:each="option : ${imageLicenseOptions}"
                  th:value="${option.code}" th:text="${option.displayName}"></option>
        </select>
      </label>
      <label class="is-wide" data-image-license-detail hidden>
        <span>세부 이용조건</span>
        <input type="text" maxlength="255" placeholder="예: CC BY 4.0"
               data-image-metadata-field="licenseDetail">
      </label>
      <p class="admin-field-help is-wide" data-image-license-unknown-warning hidden>
        이용조건이 확인되지 않은 이미지는 공개 서비스 사용 전에 권리관계를 확인하세요.
      </p>
      <label class="is-wide">
        <span>기존 출처 URL (의미 미확인)</span>
        <input type="url" maxlength="1000" inputmode="url"
               placeholder="https://..." data-image-metadata-field="sourceUrl">
      </label>
      <label class="is-wide">
        <span>공통 제공기관 페이지 URL</span>
        <input type="url" maxlength="2000" inputmode="url"
               placeholder="https://..." data-image-metadata-field="commonSourceUrl"
               data-image-source-url="common">
      </label>
      <label class="is-wide">
        <span>사진별 원본 페이지 URL</span>
        <input type="url" maxlength="2000" inputmode="url"
               placeholder="https://..." data-image-metadata-field="workPageUrl"
               data-image-source-url="work">
      </label>
    </div>
  </template>
</th:block>
</html>
