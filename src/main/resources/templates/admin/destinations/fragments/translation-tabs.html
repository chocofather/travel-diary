<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  여행지 유형별 상세정보의 번역 입력. 언어 탭만 공통이고 입력 칸은 유형마다 다르다.
  등록/수정 화면이 같은 조각을 쓰며, 폼(th:object) 안쪽에 넣어야 한다.

  ktoAutofill 이 true 인 화면(등록)만 영문 TourAPI 자동입력 훅을 단다.
  숨긴 언어의 입력값도 폼에는 그대로 실려 저장된다. (hidden 만 걸고 지우지 않는다)
-->
<!--
  여행지 기본정보(이름·간단 설명·상세 설명)의 번역 입력.
  0번 슬롯(한국어)은 위쪽 원본 영역이 담당하므로 여기서는 건너뛴다.
  ktoAutofill 이 true 인 화면(등록)만 영문 TourAPI 자동입력 훅을 단다.
-->
<th:block th:fragment="destinationTranslations(ktoAutofill)">
  <div class="admin-translation-tabs" data-translation-tabs>
    <h3>번역</h3>
    <p class="admin-help-text">비워 둔 언어는 화면에서 한국어로 대신 보여집니다.</p>

    <div class="admin-translation-tablist" role="tablist" aria-label="번역 언어 선택">
      <th:block th:each="translation, slot : *{translations}">
        <button type="button" role="tab" class="admin-translation-tab"
                th:unless="${slot.first}"
                th:classappend="${slot.index == 1} ? ' is-active'"
                th:attr="data-translation-tab=${translation.languageCode},
                         aria-selected=${slot.index == 1},
                         title=${translationLanguageLabels.get(translation.languageCode)}"
                th:text="${translationTabLabels.get(translation.languageCode)}
                         ?: translation.languageCode">영어</button>
      </th:block>
    </div>

    <th:block th:each="translation, slot : *{translations}">
      <div class="admin-translation-panel" role="tabpanel"
           th:unless="${slot.first}"
           th:hidden="${slot.index > 1}"
           th:attr="data-translation-panel=${translation.languageCode},
                    aria-label=${translationLanguageLabels.get(translation.languageCode)}">
        <input type="hidden" th:field="*{translations[__${slot.index}__].languageCode}">
        <label>여행지명
          <input type="text" th:field="*{translations[__${slot.index}__].name}"
                 th:attr="data-kto-tour-english-name=
                          ${ktoAutofill and translation.languageCode == 'en'} ? true : null">
        </label>
        <label>간단 설명
          <textarea th:field="*{translations[__${slot.index}__].shortDescription}"></textarea>
        </label>
        <label>상세 설명
          <textarea class="is-description"
                    th:field="*{translations[__${slot.index}__].description}"
                    th:attr="data-kto-tour-english-overview=
                             ${ktoAutofill and translation.languageCode == 'en'} ? true : null"></textarea>
        </label>
      </div>
    </th:block>
  </div>
</th:block>

<th:block th:fragment="accommodationTranslations">
  <div class="admin-type-field-wide admin-translation-tabs" data-translation-tabs>
    <h4>숙소 상세 정보 번역</h4>
    <p class="admin-help-text">
      위에 입력한 값이 한국어로 함께 저장됩니다. 비워 둔 언어는 저장하지 않습니다.
    </p>

    <div class="admin-translation-tablist" role="tablist" aria-label="번역 언어 선택">
      <button type="button" role="tab" class="admin-translation-tab"
              th:each="translation, slot : *{accommodationInfoTranslations}"
              th:classappend="${slot.first} ? ' is-active'"
              th:attr="data-translation-tab=${translation.languageCode},
                       aria-selected=${slot.first},
                       title=${translationLanguageLabels.get(translation.languageCode)}"
              th:text="${translationTabLabels.get(translation.languageCode)}
                       ?: translation.languageCode">English</button>
    </div>

    <div class="admin-translation-panel" role="tabpanel"
         th:each="translation, slot : *{accommodationInfoTranslations}"
         th:hidden="${!slot.first}"
         th:attr="data-translation-panel=${translation.languageCode},
                  aria-label=${translationLanguageLabels.get(translation.languageCode)}">
      <input type="hidden"
             th:field="*{accommodationInfoTranslations[__${slot.index}__].languageCode}">
      <div class="admin-type-fields-grid">
        <div>
          <label>객실 유형
            <input type="text"
                   th:field="*{accommodationInfoTranslations[__${slot.index}__].roomType}"
                   maxlength="255">
          </label>
        </div>
        <div class="admin-type-field-wide">
          <label>기타 안내사항
            <textarea th:field="*{accommodationInfoTranslations[__${slot.index}__].etc}"
                      maxlength="255"></textarea>
          </label>
        </div>
      </div>
    </div>
  </div>
</th:block>

<th:block th:fragment="attractionTranslations">
  <div class="admin-type-field-wide admin-translation-tabs" data-translation-tabs>
    <h4>관광지 상세 정보 번역</h4>
    <p class="admin-help-text">
      위에 입력한 값이 한국어로 함께 저장됩니다. 비워 둔 언어는 저장하지 않습니다.
    </p>

    <div class="admin-translation-tablist" role="tablist" aria-label="번역 언어 선택">
      <button type="button" role="tab" class="admin-translation-tab"
              th:each="translation, slot : *{attractionInfoTranslations}"
              th:classappend="${slot.first} ? ' is-active'"
              th:attr="data-translation-tab=${translation.languageCode},
                       aria-selected=${slot.first},
                       title=${translationLanguageLabels.get(translation.languageCode)}"
              th:text="${translationTabLabels.get(translation.languageCode)}
                       ?: translation.languageCode">English</button>
    </div>

    <div class="admin-translation-panel" role="tabpanel"
         th:each="translation, slot : *{attractionInfoTranslations}"
         th:hidden="${!slot.first}"
         th:attr="data-translation-panel=${translation.languageCode},
                  aria-label=${translationLanguageLabels.get(translation.languageCode)}">
      <input type="hidden"
             th:field="*{attractionInfoTranslations[__${slot.index}__].languageCode}">
      <div class="admin-type-fields-grid">
        <div>
          <label>휴관일
            <input type="text"
                   th:field="*{attractionInfoTranslations[__${slot.index}__].closedDays}"
                   maxlength="500">
          </label>
        </div>
        <div>
          <label>운영시간
            <input type="text"
                   th:field="*{attractionInfoTranslations[__${slot.index}__].openingHours}"
                   maxlength="1000">
          </label>
        </div>
        <div>
          <label>입장료
            <input type="text"
                   th:field="*{attractionInfoTranslations[__${slot.index}__].admissionFee}">
          </label>
        </div>
        <div class="admin-type-field-wide">
          <label>관람 안내/기타
            <textarea th:field="*{attractionInfoTranslations[__${slot.index}__].guide}"></textarea>
          </label>
        </div>
      </div>
    </div>
  </div>
</th:block>

<th:block th:fragment="restaurantTranslations(ktoAutofill)">
  <div class="admin-type-field-wide admin-translation-tabs" data-translation-tabs>
    <h4>음식점/카페 상세 정보 번역</h4>
    <p class="admin-help-text">
      위에 입력한 값이 한국어로 함께 저장됩니다. 비워 둔 언어는 저장하지 않습니다.
    </p>

    <div class="admin-translation-tablist" role="tablist" aria-label="번역 언어 선택">
      <button type="button" role="tab" class="admin-translation-tab"
              th:each="translation, slot : *{restaurantInfoTranslations}"
              th:classappend="${slot.first} ? ' is-active'"
              th:attr="data-translation-tab=${translation.languageCode},
                       aria-selected=${slot.first},
                       title=${translationLanguageLabels.get(translation.languageCode)}"
              th:text="${translationTabLabels.get(translation.languageCode)}
                       ?: translation.languageCode">English</button>
    </div>

    <div class="admin-translation-panel" role="tabpanel"
         th:each="translation, slot : *{restaurantInfoTranslations}"
         th:hidden="${!slot.first}"
         th:attr="data-translation-panel=${translation.languageCode},
                  aria-label=${translationLanguageLabels.get(translation.languageCode)}">
      <input type="hidden"
             th:field="*{restaurantInfoTranslations[__${slot.index}__].languageCode}">
      <div class="admin-type-fields-grid">
        <div>
          <label>대표메뉴
            <!-- 영문 슬롯만 TourAPI 영문 상세 자동입력 대상이다. -->
            <input type="text"
                   th:field="*{restaurantInfoTranslations[__${slot.index}__].mainMenu}"
                   maxlength="64"
                   th:attr="data-kto-tour-english-field=
                            ${ktoAutofill and translation.languageCode == 'en'}
                            ? 'mainMenu' : null">
          </label>
        </div>
        <div>
          <label>가격대
            <input type="text"
                   th:field="*{restaurantInfoTranslations[__${slot.index}__].priceRange}"
                   maxlength="32">
          </label>
        </div>
        <div>
          <label>영업시간
            <input type="text"
                   th:field="*{restaurantInfoTranslations[__${slot.index}__].openingHours}"
                   maxlength="64"
                   th:attr="data-kto-tour-english-field=
                            ${ktoAutofill and translation.languageCode == 'en'}
                            ? 'openingHours' : null">
          </label>
        </div>
        <div>
          <label>브레이크 타임
            <input type="text"
                   th:field="*{restaurantInfoTranslations[__${slot.index}__].breakTime}"
                   maxlength="32">
          </label>
        </div>
        <div>
          <label>휴무일
            <input type="text"
                   th:field="*{restaurantInfoTranslations[__${slot.index}__].closedDays}"
                   maxlength="32"
                   th:attr="data-kto-tour-english-field=
                            ${ktoAutofill and translation.languageCode == 'en'}
                            ? 'closedDays' : null">
          </label>
        </div>
        <div class="admin-type-field-wide">
          <label>기타 안내사항
            <textarea th:field="*{restaurantInfoTranslations[__${slot.index}__].etc}"
                      maxlength="255"></textarea>
          </label>
        </div>
      </div>
    </div>
  </div>
</th:block>

</body>
</html>
