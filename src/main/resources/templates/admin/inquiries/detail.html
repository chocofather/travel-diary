<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::body}, ~{::headFragment}, 'inquiries')}">
<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/admin-inquiries.css">
</th:block>
<th:block th:fragment="body">
  <section class="admin-page-section admin-inquiry-detail-page">
    <header class="admin-page-header">
      <div class="admin-page-heading">
        <h1 class="admin-page-title">1:1 문의 상세</h1>
        <p class="admin-page-description">회원 문의를 확인하고 관리자 답변을 등록하거나 수정합니다.</p>
      </div>
      <div class="admin-page-actions">
        <a th:href="@{/admin/inquiries}" class="admin-btn">문의 목록</a>
      </div>
    </header>

    <section class="admin-form-card is-wide admin-inquiry-section">
      <div class="admin-inquiry-section-header">
        <h2>문의 정보</h2>
        <div class="admin-inquiry-badges">
          <span class="admin-inquiry-status"
                th:classappend="${inquiry.answered} ? ' is-answered' : ' is-pending'"
                th:text="${inquiry.status.displayName}">답변대기</span>
          <span class="admin-inquiry-type" th:text="${inquiry.inquiryType.displayName}">회원/계정</span>
        </div>
      </div>
      <dl class="admin-inquiry-meta">
        <div><dt>문의 번호</dt><dd th:text="${inquiry.id}">1</dd></div>
        <div><dt>회원</dt><dd th:text="${inquiry.userDisplayName}">회원</dd></div>
        <div><dt>작성일</dt><dd th:text="${#dates.format(inquiry.createdAt, 'yyyy-MM-dd HH:mm')}">2026-08-12 10:00</dd></div>
      </dl>
      <h3 class="admin-inquiry-subject-heading" th:text="${inquiry.subject}">문의 제목</h3>
    </section>

    <section class="admin-form-card is-wide admin-inquiry-section">
      <div class="admin-inquiry-section-header">
        <h2>문의 내용</h2>
      </div>
      <p class="admin-inquiry-plain-content" th:text="${inquiry.content}">문의 내용</p>
    </section>

    <section class="admin-form-card is-wide admin-inquiry-section">
      <div class="admin-inquiry-section-header">
        <h2>관리자 답변</h2>
        <p th:text="${answerMode == 'edit'} ? '등록된 답변을 수정합니다.' : '문의에 대한 답변을 등록합니다.'">
          답변을 등록합니다.
        </p>
      </div>

      <form th:if="${inquiry.pending or inquiry.answered}"
            th:action="@{/admin/inquiries/{id}/answer(id=${inquiry.id})}"
            method="post" th:object="${answerForm}" class="admin-inquiry-answer-form">
        <div class="admin-alert" th:if="${#fields.hasGlobalErrors()}" role="alert">
          <p th:each="error : ${#fields.globalErrors()}" th:text="${error}">답변 오류</p>
        </div>
        <div class="admin-form-field">
          <label for="inquiry-answer">답변 내용</label>
          <textarea id="inquiry-answer" th:field="*{content}"
                    maxlength="5000" rows="12"
                    th:classappend="${#fields.hasErrors('content')} ? ' is-invalid' : ''"
                    placeholder="관리자 답변을 입력하세요" required></textarea>
          <p class="admin-field-help">최대 5,000자까지 입력할 수 있습니다.</p>
          <p class="admin-field-error" th:if="${#fields.hasErrors('content')}"
             th:errors="*{content}">답변 오류</p>
        </div>
        <div class="admin-form-actions">
          <button type="submit" class="admin-btn is-primary"
                  th:text="${answerMode == 'edit'} ? '답변 수정' : '답변 등록'">답변 등록</button>
        </div>
      </form>

      <p class="admin-inquiry-state-message" th:unless="${inquiry.pending or inquiry.answered}">
        현재 문의 상태에서는 답변을 등록할 수 없습니다.
      </p>
    </section>
  </section>
</th:block>
</html>
