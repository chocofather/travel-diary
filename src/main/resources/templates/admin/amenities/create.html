<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::body}, ~{::headFragment}, 'amenities')}">
<th:block th:fragment="headFragment"></th:block>
<th:block th:fragment="body">
  <section class="admin-page-section">
    <header class="admin-page-header">
      <div class="admin-page-heading">
        <h1 class="admin-page-title">편의시설 등록</h1>
        <p class="admin-page-description">여행지 상세 정보에서 사용할 편의시설 코드를 등록합니다.</p>
      </div>
      <div class="admin-page-actions">
        <a th:href="@{/admin/amenities/list}" class="admin-btn">편의시설 목록</a>
      </div>
    </header>

    <form th:action="@{/admin/amenities/create}" method="post" class="admin-form-card">
      <div class="admin-form-field">
        <label for="amenity-code">코드</label>
        <input id="amenity-code" type="text" name="code" required>
      </div>
      <div th:if="${error}" class="admin-alert" th:text="${error}"></div>
      <div class="admin-form-actions">
        <a th:href="@{/admin/amenities/list}" class="admin-btn">취소</a>
        <button type="submit" class="admin-btn is-primary">등록</button>
      </div>
    </form>
  </section>
</th:block>
</html>
