<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/main :: layout(~{::body}, ~{::headFragment})">
<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/amenity.css">
</th:block>
<th:block th:fragment="body">
  <div class="amenity-list-outer">
    <div class="amenity-list-wrapper">
      <div class="top-bar">
        <h1>번역 등록</h1>
        <div class="amenity-btn-bar">
          <a th:href="@{|/admin/amenities/${amenityId}/translations|}" class="btn">번역 목록으로</a>
        </div>
      </div>
      <form th:action="@{|/admin/amenities/${amenityId}/translations/create|}" method="post" style="margin-top:28px;">
        <label style="font-weight:600;display:block;margin-bottom:16px;">
          언어 코드:
          <input type="text" name="languageCode" required placeholder="ko, en 등"
                 style="margin-left:8px;padding:8px 14px;border-radius:7px;border:1.1px solid #e4e8f4;">
        </label>
        <label style="font-weight:600;display:block;margin-bottom:16px;">
          번역 이름:
          <input type="text" name="name" required
                 style="margin-left:8px;padding:8px 14px;border-radius:7px;border:1.1px solid #e4e8f4;">
        </label>
        <button type="submit" class="btn" style="margin-top:8px;">등록</button>
      </form>
      <div th:if="${error}" style="color:#e74c3c;margin-top:18px;font-weight:500;" th:text="${error}"></div>
    </div>
  </div>
</th:block>
</html>
