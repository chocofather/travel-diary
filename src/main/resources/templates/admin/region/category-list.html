<!-- templates/admin/category-list.html -->
<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/admin :: layout(~{::body}, ~{::headFragment}, 'regions')}">
<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/admin-region-categories.css?v=20261009-card">
  <script src="/js/admin-region-categories.js?v=20261009" defer></script>
</th:block>
<th:block th:fragment="body">
  <section class="admin-page-section">
    <header class="admin-page-header">
      <div class="admin-page-heading">
        <h1 class="admin-page-title"
            th:text="${type == 'domestic' ? '국내 도시 관리'
                       : depth == 1 ? '해외 대륙 관리'
                       : depth == 2 ? '해외 국가 관리'
                       : depth == 3 ? '해외 도시 관리'
                       : '지역·도시 관리'}">지역·도시 관리</h1>
        <p class="admin-page-description">국내 도시와 해외 대륙·국가·도시 계층 및 아이콘을 관리합니다.</p>
      </div>
      <div class="admin-page-actions">
        <button type="button" class="admin-btn is-primary is-small" data-region-dialog-open>지역 등록</button>
      </div>
    </header>

    <div th:if="${message}" class="admin-alert is-success" role="status" th:text="${message}"></div>
    <div th:if="${error}" class="admin-alert" role="alert" th:text="${error}"></div>

    <div class="admin-filter-card">
      <div class="admin-tabs" aria-label="지역 구분">
        <a th:href="@{/admin/region-categories(type='domestic',depth=3)}"
           class="admin-tab"
           th:classappend="${type} == 'domestic' ? ' active' : ''">국내 도시</a>
        <a th:href="@{/admin/region-categories(type='overseas',depth=1)}"
           class="admin-tab"
           th:classappend="${type} == 'overseas' ? ' active' : ''">해외 대륙</a>
      </div>
      <div th:if="${parentId != null}" class="admin-filter-back">
        <span th:if="${parentCategory != null}" class="admin-region-parent-name"
              th:text="${parentCategory.regionName}">상위 지역</span>
        <a th:href="@{/admin/region-categories(type=${type},depth=${depth-1},parentId=${parentCategory?.parentId})}"
           class="admin-btn is-small">← 상위로 이동</a>
      </div>
    </div>

    <div class="admin-item-grid">
      <article class="admin-item-card admin-region-card" th:each="c : ${pageInfo.list}">
        <div class="admin-region-card-icon">
          <img th:if="${c.iconPath != null}" th:src="@{${c.iconPath}}" alt="icon" />
        </div>
        <div class="admin-item-card-info">
          <div>
            <div class="admin-item-card-name" th:text="${c.regionName}">이름</div>
            <div class="admin-item-card-code" th:text="${c.code}">코드</div>
          </div>
        </div>
        <div class="admin-action-group admin-region-card-actions">
          <a th:href="@{/admin/region-categories/{id}/icon(id=${c.id})}"
             class="admin-btn is-small">아이콘 업로드</a>
          <a th:if="${showSubregionLink}"
             th:href="@{/admin/region-categories(type=${type},depth=${depth+1},parentId=${c.id})}"
             class="admin-btn is-small">하위 보기</a>
          <form th:action="@{/admin/region-categories/{id}/delete(id=${c.id})}" method="post"
                class="admin-region-delete-form"
                onsubmit="return confirm('이 지역을 삭제하시겠습니까?')">
            <input type="hidden" name="listType" th:value="${type}">
            <input type="hidden" name="listDepth" th:value="${depth}">
            <input type="hidden" name="listParentId" th:value="${parentId}">
            <input type="hidden" name="listPage" th:value="${pageInfo.pageNum}">
            <button type="submit" class="admin-region-delete-btn"
                    th:attr="aria-label=${c.regionName + ' 삭제'}">삭제</button>
          </form>
        </div>
      </article>
    </div>

    <nav aria-label="지역 목록 페이지" th:if="${pageInfo.pages > 0}">
      <ul class="admin-pagination">
        <li th:if="${pageInfo.hasPreviousPage}">
          <a th:href="@{/admin/region-categories(type=${type},depth=${depth},parentId=${parentId},page=${pageInfo.pageNum-1})}">« 이전</a>
        </li>
        <li th:each="i : ${#numbers.sequence(1, pageInfo.pages)}"
            th:classappend="${i == pageInfo.pageNum} ? 'active'">
          <a th:href="@{/admin/region-categories(type=${type},depth=${depth},parentId=${parentId},page=${i})}"
             th:text="${i}">1</a>
        </li>
        <li th:if="${pageInfo.hasNextPage}">
          <a th:href="@{/admin/region-categories(type=${type},depth=${depth},parentId=${parentId},page=${pageInfo.pageNum+1})}">다음 »</a>
        </li>
      </ul>
    </nav>
  </section>

  <!-- 지역 등록. depth 는 받지 않고 서버가 부모 기준으로 정한다. -->
  <dialog class="admin-region-dialog" id="region-create-dialog" aria-labelledby="region-create-title"
          th:attr="data-open-on-load=${regionFormError != null}">
    <form th:action="@{/admin/region-categories}" th:object="${regionForm}" method="post"
          class="admin-region-form" data-region-create-form>
      <div class="admin-region-dialog-header">
        <h2 id="region-create-title">지역 등록</h2>
        <button type="button" class="admin-region-dialog-close" data-region-dialog-close
                aria-label="닫기">×</button>
      </div>

      <div th:if="${regionFormError}" class="admin-alert admin-region-dialog-alert" role="alert"
           th:text="${regionFormError}"></div>

      <input type="hidden" name="listType" th:value="${type}">
      <input type="hidden" name="listDepth" th:value="${depth}">
      <input type="hidden" name="listParentId" th:value="${parentId}">

      <div class="admin-form-fields">
        <div class="admin-form-field">
          <label for="region-parent">부모 지역</label>
          <select id="region-parent" name="parentId" class="admin-select" required data-region-parent>
            <option value="">부모 지역을 선택하세요</option>
            <optgroup th:each="group : ${parentOptionGroups}" th:label="${group.label}">
              <option th:each="option : ${group.options}"
                      th:value="${option.id}"
                      th:text="${option.label}"
                      th:selected="${option.id == selectedParentId}"
                      th:attr="data-code-required=${option.codeRequired},data-code-prefix=${option.codePrefix}">지역</option>
            </optgroup>
          </select>
          <p class="admin-help-text">선택한 지역 바로 아래에 등록됩니다. 계층은 부모 기준으로 자동 결정됩니다.</p>
        </div>

        <div class="admin-region-form-row">
          <div class="admin-form-field">
            <label for="region-name-ko">한국어명</label>
            <input id="region-name-ko" type="text" class="admin-input" th:field="*{regionName}"
                   maxlength="100" required placeholder="예: 기자">
          </div>
          <div class="admin-form-field">
            <label for="region-name-en">영어명</label>
            <input id="region-name-en" type="text" class="admin-input" th:field="*{nameEn}"
                   maxlength="100" required placeholder="예: Giza">
          </div>
        </div>

        <div class="admin-form-field" data-region-code-field hidden>
          <label for="region-code">코드</label>
          <input id="region-code" type="text" class="admin-input" th:field="*{code}"
                 maxlength="20" disabled data-region-code>
          <p class="admin-help-text" data-region-code-hint>국가는 JP 처럼 영문 대문자 2~3자로 입력합니다.</p>
        </div>

        <fieldset class="admin-region-translations">
          <legend>번역 <span>(선택)</span></legend>
          <p class="admin-help-text">한국어·영어 번역은 위 기본 정보로 함께 저장됩니다.</p>
          <div class="admin-region-form-row is-three">
            <div class="admin-form-field">
              <label for="region-name-ja">일본어</label>
              <input id="region-name-ja" type="text" class="admin-input" th:field="*{nameJa}"
                     maxlength="100" placeholder="예: ギーザ">
            </div>
            <div class="admin-form-field">
              <label for="region-name-zh-cn">중국어 간체</label>
              <input id="region-name-zh-cn" type="text" class="admin-input" th:field="*{nameZhCn}"
                     maxlength="100" placeholder="예: 吉萨">
            </div>
            <div class="admin-form-field">
              <label for="region-name-zh-tw">중국어 번체</label>
              <input id="region-name-zh-tw" type="text" class="admin-input" th:field="*{nameZhTw}"
                     maxlength="100" placeholder="예: 吉薩">
            </div>
          </div>
        </fieldset>
      </div>

      <div class="admin-form-actions">
        <button type="button" class="admin-btn is-small" data-region-dialog-close>취소</button>
        <button type="submit" class="admin-btn is-primary is-small">등록</button>
      </div>
    </form>
  </dialog>
</th:block>
</html>
