<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="layout/main :: layout(~{::body}, ~{::headFragment})">

<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/admin.css">
</th:block>

<th:block th:fragment="body">

<section th:fragment="body" class="icon-upload-form" style="padding:40px;">
  <h1>카테고리 아이콘 업로드</h1>
  <p th:text="'[' + ${category.regionName} + '] 에 대한 아이콘을 업로드하세요.'"></p>

  <!-- enctype="multipart/form-data" 반드시 필요 -->
  <form th:action="@{/admin/categories/{id}/icon(id=${category.id})}"
        method="post"
        enctype="multipart/form-data"
        style="margin-top:20px;">

    <input type="file"
           name="icon"
           accept="image/*"
           required/>

    <button type="submit" class="btn-admin"
            style="margin-left:12px;">
      업로드
    </button>
    <a href="/admin/categories" style="margin-left:8px; color:#555;">취소</a>
  </form>
</section>
</th:block>
</html>
