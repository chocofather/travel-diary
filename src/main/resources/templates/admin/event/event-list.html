<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::body}, ~{::headFragment}, 'events')}">
<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/admin-event.css">
</th:block>
<th:block th:fragment="body">
  <section class="admin-page-section admin-event-list-page">
    <header class="admin-page-header">
      <div class="admin-page-heading">
        <h1 class="admin-page-title">이벤트 관리</h1>
        <p class="admin-page-description">사이트에 노출할 이벤트 콘텐츠와 기간을 관리합니다.</p>
      </div>
      <div class="admin-page-actions">
        <a th:href="@{/admin/event/new}" class="admin-btn is-primary">+ 이벤트 등록</a>
      </div>
    </header>

    <div class="admin-card is-table-card admin-event-table-card">
      <div class="admin-table-wrapper">
        <table class="admin-table admin-event-table">
          <thead>
          <tr>
            <th>이벤트</th>
            <th>상태</th>
            <th>슬라이드</th>
            <th>기간</th>
            <th>관리</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="event : ${eventList}"
              th:with="status=${event.startDate.isAfter(today) ? 'upcoming' : (event.endDate.isBefore(today) ? 'ended' : 'ongoing')}">
            <td>
              <!-- 썸네일은 event_type 기준: 일반 이벤트는 메인 이미지, 인포그래픽은 인포그래픽 이미지 -->
              <div class="admin-event-item"
                   th:with="thumbnail=${(event.eventType != null and event.eventType.name() == 'STANDARD')
                                ? event.eventImg
                                : (event.posterImg != null and !#strings.isEmpty(event.posterImg)
                                    ? event.posterImg : event.eventImg)}">
                <img th:src="${thumbnail != null and !#strings.isEmpty(thumbnail)
                         ? thumbnail : '/images/default.png'}"
                     onerror="this.onerror=null;this.src='/images/default.png';"
                     th:alt="|${event.title} 이미지|">
                <div>
                  <strong th:text="${event.title}">이벤트 제목</strong>
                  <span th:if="${event.description != null and !#strings.isEmpty(event.description)}"
                        th:text="${event.description}">이벤트 설명</span>
                </div>
              </div>
            </td>
            <td>
              <span class="admin-event-status-badge" th:classappend="|is-${status}|"
                    th:text="${status == 'ongoing' ? '진행중' : (status == 'upcoming' ? '진행예정' : '종료')}">진행중</span>
            </td>
            <td>
              <span class="admin-event-slide-badge"
                    th:classappend="${event.slide} ? 'is-visible' : 'is-hidden'"
                    th:text="${event.slide} ? '노출' : '미노출'">미노출</span>
            </td>
            <td class="admin-event-period" th:text="|${event.startDate} ~ ${event.endDate}|">2026-08-01 ~ 2026-08-31</td>
            <td class="admin-table-actions">
              <div class="admin-action-group">
                <a th:href="@{/admin/event/{id}/edit(id=${event.id})}"
                   class="admin-btn is-small">수정</a>
                <form th:action="@{/admin/event/{id}/delete(id=${event.id})}" method="post">
                  <button type="submit" class="admin-btn is-small is-danger"
                          onclick="return confirm('삭제하시겠습니까?')">삭제</button>
                </form>
              </div>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
      <div class="admin-empty-state" th:if="${#lists.isEmpty(eventList)}">등록된 이벤트가 없습니다.</div>
    </div>
  </section>
</th:block>
</html>
