<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="ko"
      th:replace="layout/main :: layout(~{::body}, ~{::headFragment})">

<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/admin.css">
</th:block>

<th:block th:fragment="body">
  <div class="event-from-wrapper">
<!-- templates/admin/event-form.html -->
    <form th:action="@{/admin/event}" method="post" enctype="multipart/form-data" th:object="${event}">
  <h2 class="event-form-title">이벤트 등록</h2>
  <div>
    <label>제목</label>
    <input type="text" th:field="*{title}" required />
  </div>

  <div>
    <label>내용</label>
    <textarea th:field="*{description}"></textarea>
  </div>

      <div>
        <label>이벤트 대표 이미지<br><span style="font-size:0.94em;color:#888;">(메인/슬라이드용, 필수)</span></label>
        <input type="file" name="imageFile" accept="image/*" required />
      </div>

      <div>
        <label>포스터 이미지<br><span style="font-size:0.94em;color:#888;">(상세에 “포스터 한 장”처럼 크게 표시, 선택)</span></label>
        <input type="file" name="posterFile" accept="image/*" />
      </div>

  <div>
    <label>슬라이더에 표시</label>
    <input type="checkbox" th:field="*{slide}" /> <!-- slide = boolean DTO 필드 -->
  </div>

  <div>
    <label>시작일</label>
    <input type="date" th:field="*{startDate}" id="startDate" placeholder="YYYY-MM-DD" />
    <label>종료일</label>
    <input type="date" th:field="*{endDate}" id="endDate" placeholder="YYYY-MM-DD" />
  </div>


  <button type="submit">등록</button>
</form>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // 시작일이 변경되면, 종료일의 min만 startDate로 제한
        const startDateInput = document.getElementById('startDate');
        const endDateInput = document.getElementById('endDate');
        if (startDateInput && endDateInput) {
          startDateInput.addEventListener('change', function() {
            endDateInput.setAttribute('min', this.value);
          });
        }
      });
    </script>
  </div>
</th:block>
</html>
