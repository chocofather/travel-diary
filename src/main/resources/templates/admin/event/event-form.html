<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::body}, ~{::headFragment}, 'events')}">
<th:block th:fragment="headFragment"></th:block>
<th:block th:fragment="body">
  <section class="admin-page-section">
    <header class="admin-page-header">
      <div class="admin-page-heading">
        <h1 class="admin-page-title">이벤트 등록</h1>
        <p class="admin-page-description">이벤트 내용과 노출 기간, 이미지를 등록합니다.</p>
      </div>
      <div class="admin-page-actions">
        <a th:href="@{/admin/event/list}" class="admin-btn">이벤트 목록</a>
      </div>
    </header>

    <form th:action="@{/admin/event}" method="post" enctype="multipart/form-data"
          th:object="${event}" class="admin-form-card">
      <div class="admin-form-fields">
        <div class="admin-form-field">
          <label for="event-title">제목</label>
          <input id="event-title" type="text" th:field="*{title}" required />
        </div>

        <div class="admin-form-field">
          <label for="event-description">내용</label>
          <textarea id="event-description" th:field="*{description}"></textarea>
        </div>

        <div class="admin-form-field">
          <label for="event-image">이벤트 대표 이미지</label>
          <span class="admin-help-text">메인·슬라이드용 필수 이미지입니다.</span>
          <input id="event-image" type="file" name="imageFile" accept="image/*" required />
        </div>

        <div class="admin-form-field">
          <label for="event-poster">포스터 이미지</label>
          <span class="admin-help-text">상세 화면에 포스터 한 장처럼 크게 표시할 선택 이미지입니다.</span>
          <input id="event-poster" type="file" name="posterFile" accept="image/*" />
        </div>

        <div class="admin-form-field admin-checkbox-field">
          <label><input type="checkbox" th:field="*{slide}" /> 슬라이더에 표시</label>
        </div>

        <div class="admin-date-fields">
          <div class="admin-form-field">
            <label for="startDate">시작일</label>
            <input type="date" th:field="*{startDate}" id="startDate" placeholder="YYYY-MM-DD" />
          </div>
          <div class="admin-form-field">
            <label for="endDate">종료일</label>
            <input type="date" th:field="*{endDate}" id="endDate" placeholder="YYYY-MM-DD" />
          </div>
        </div>
      </div>

      <div class="admin-form-actions">
        <a th:href="@{/admin/event/list}" class="admin-btn">취소</a>
        <button type="submit" class="admin-btn is-primary">등록</button>
      </div>
    </form>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // 시작일이 변경되면, 종료일의 min만 startDate로 제한
        const startDateInput = document.getElementById('startDate');
        const endDateInput = document.getElementById('endDate');
        if (startDateInput && endDateInput) {
          startDateInput.addEventListener('change', function() {
            endDateInput.setAttribute('min', this.value);
          });
        }
      });
    </script>
  </section>
</th:block>
</html>
