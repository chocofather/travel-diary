<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::body}, ~{::headFragment}, 'info-categories')}">
<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/admin-compact-lists.css">
</th:block>
<th:block th:fragment="body">
  <section class="admin-page-section admin-info-category-page">
    <header class="admin-page-header">
      <div class="admin-page-heading">
        <h1 class="admin-page-title">정보 카테고리 관리</h1>
        <p class="admin-page-description">여행정보에서 사용할 주제 카테고리를 관리합니다.</p>
      </div>
      <div class="admin-page-actions">
        <a th:href="@{/admin/info-categories/create}" class="admin-btn is-primary">+ 카테고리 등록</a>
      </div>
    </header>

    <div th:if="${error}" class="admin-alert" role="alert" th:text="${error}"></div>

    <div class="admin-card is-table-card">
      <div class="admin-table-wrapper">
        <table class="admin-table admin-info-category-table">
          <thead>
          <tr>
            <th>카테고리명</th>
            <th>표시 순서</th>
            <th>노출 상태</th>
            <th>관리</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="category : ${categories}">
            <td class="admin-info-category-name" th:text="${category.name}">계절여행</td>
            <td th:text="${category.displayOrder}">1</td>
            <td>
              <span class="admin-status-badge"
                    th:classappend="${category.isVisible} ? ' is-visible' : ' is-hidden'"
                    th:text="${category.isVisible} ? '노출' : '숨김'">노출</span>
            </td>
            <td class="admin-table-actions">
              <div class="admin-action-group">
                <a th:href="@{/admin/info-categories/edit/{id}(id=${category.id})}"
                   class="admin-btn is-small">수정</a>
                <form th:action="@{/admin/info-categories/{id}/delete(id=${category.id})}"
                      method="post" onsubmit="return confirm('이 정보 카테고리를 삭제하시겠습니까?');">
                  <button type="submit" class="admin-btn is-small is-danger">삭제</button>
                </form>
              </div>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(categories)}">
            <td colspan="4" class="admin-table-empty">등록된 정보 카테고리가 없습니다.</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</th:block>
</html>
