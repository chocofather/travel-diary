<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::body}, ~{::headFragment}, 'info-categories')}">
<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/admin-compact-lists.css">
</th:block>
<th:block th:fragment="body">
  <section class="admin-page-section admin-info-category-page">
    <header class="admin-page-header">
      <div class="admin-page-heading">
        <h1 class="admin-page-title" th:text="${pageTitle}">정보 카테고리 등록</h1>
        <p class="admin-page-description" th:text="${pageDescription}">
          여행정보에서 사용할 새 주제 카테고리를 등록합니다.
        </p>
      </div>
      <div class="admin-page-actions">
        <a th:href="@{/admin/info-categories}" class="admin-btn">카테고리 목록</a>
      </div>
    </header>

    <form th:action="${formAction}" method="post" th:object="${infoCategoryForm}"
          class="admin-form-card admin-info-category-form">
      <div class="admin-form-fields">
        <div class="admin-form-field">
          <label for="info-category-name">카테고리명</label>
          <input id="info-category-name" type="text" th:field="*{name}"
                 maxlength="100" placeholder="예: 계절여행"
                 th:classappend="${#fields.hasErrors('name')} ? ' is-invalid' : ''"
                 th:attr="aria-invalid=${#fields.hasErrors('name')}" />
          <p class="admin-field-error" th:if="${#fields.hasErrors('name')}"
             th:errors="*{name}">카테고리명 오류</p>
        </div>

        <div class="admin-form-field">
          <label for="info-category-content-type">여행정보 유형</label>
          <select id="info-category-content-type" th:field="*{contentType}"
                  th:classappend="${#fields.hasErrors('contentType')} ? ' is-invalid' : ''"
                  th:attr="aria-invalid=${#fields.hasErrors('contentType')}">
            <option value="GENERAL">일반</option>
            <option value="FESTIVAL">축제</option>
          </select>
          <p class="admin-field-error" th:if="${#fields.hasErrors('contentType')}"
             th:errors="*{contentType}">여행정보 유형 오류</p>
        </div>

        <div class="admin-form-field">
          <label for="info-category-order">표시 순서</label>
          <input id="info-category-order" type="number" th:field="*{displayOrder}"
                 min="1" placeholder="1"
                 th:classappend="${#fields.hasErrors('displayOrder')} ? ' is-invalid' : ''"
                 th:attr="aria-invalid=${#fields.hasErrors('displayOrder')}" />
          <span class="admin-help-text">숫자가 작을수록 목록에서 먼저 표시됩니다.</span>
          <p class="admin-field-error" th:if="${#fields.hasErrors('displayOrder')}"
             th:errors="*{displayOrder}">표시 순서 오류</p>
        </div>

        <div class="admin-form-field admin-checkbox-field">
          <span class="admin-field-label">노출 여부</span>
          <label>
            <input type="checkbox" th:field="*{isVisible}" />
            여행정보 화면에 노출
          </label>
          <p class="admin-field-error" th:if="${#fields.hasErrors('isVisible')}"
             th:errors="*{isVisible}">노출 여부 오류</p>
        </div>
      </div>

      <div class="admin-form-actions">
        <a th:href="@{/admin/info-categories}" class="admin-btn">취소</a>
        <button type="submit" class="admin-btn is-primary" th:text="${submitLabel}">등록</button>
      </div>
    </form>
  </section>
</th:block>
</html>
