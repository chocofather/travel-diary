<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::body}, ~{::headFragment}, 'categories')}">
<th:block th:fragment="headFragment"></th:block>
<th:block th:fragment="body">
  <section class="admin-page-section">
    <header class="admin-page-header">
      <div class="admin-page-heading">
        <h1 class="admin-page-title">여행지 카테고리 등록</h1>
        <p class="admin-page-description">여행지를 분류할 새 카테고리를 등록합니다.</p>
      </div>
      <div class="admin-page-actions">
        <a th:href="@{/admin/categories}" class="admin-btn">카테고리 목록</a>
      </div>
    </header>

    <form th:action="@{/admin/categories}" method="post" th:object="${categoryForm}"
          class="admin-form-card">
      <div class="admin-form-field">
        <label for="category-name">카테고리 이름</label>
        <input id="category-name" type="text" th:field="*{name}" placeholder="카테고리 이름" />
      </div>
      <div class="admin-form-actions">
        <a th:href="@{/admin/categories}" class="admin-btn">취소</a>
        <button type="submit" class="admin-btn is-primary">등록</button>
      </div>
    </form>
  </section>
</th:block>
</html>
