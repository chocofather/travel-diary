<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::body}, ~{::headFragment}, 'categories')}">
<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/admin-category-form.css">
</th:block>
<th:block th:fragment="body">
  <section class="admin-page-section">
    <header class="admin-page-header">
      <div class="admin-page-heading">
        <h1 class="admin-page-title">여행지 카테고리 수정</h1>
        <p class="admin-page-description">카테고리 이름과 적용 대상을 수정합니다.</p>
      </div>
      <div class="admin-page-actions">
        <a th:href="@{/admin/categories}" class="admin-btn">카테고리 목록</a>
      </div>
    </header>

    <form th:action="@{|/admin/categories/${categoryId}/edit|}" method="post"
          th:object="${categoryForm}" class="admin-form-card">

      <div th:if="${#fields.hasGlobalErrors()}" class="admin-alert" role="alert">
        <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
      </div>

      <div class="admin-form-fields">
        <div class="admin-form-field">
          <label for="category-name">카테고리 이름 <span class="admin-required">필수</span></label>
          <input id="category-name" type="text" th:field="*{name}" required maxlength="100"
                 placeholder="예: 디저트"
                 th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
          <p class="admin-field-error admin-alert" th:if="${#fields.hasErrors('name')}"
             th:errors="*{name}"></p>
        </div>

        <div class="admin-form-field">
          <span class="admin-field-label">적용 대상 <span class="admin-required">필수</span></span>
          <!-- 값은 DestinationType enum 에서 오고, 라벨만 화면 표시용이다. -->
          <div class="admin-category-type-options">
            <label th:each="type : ${destinationTypes}">
              <input type="checkbox" th:field="*{destinationTypes}" th:value="${type}">
              <span th:text="${destinationTypeLabels.get(type)} ?: ${type}"></span>
            </label>
          </div>
          <span class="admin-help-text">하나 이상의 적용 대상을 선택해 주세요.</span>
          <p class="admin-field-error admin-alert" th:if="${#fields.hasErrors('destinationTypes')}"
             th:errors="*{destinationTypes}"></p>
        </div>
      </div>

      <div class="admin-form-actions is-centered">
        <a th:href="@{/admin/categories}" class="admin-btn">취소</a>
        <button type="submit" class="admin-btn is-primary">수정</button>
      </div>
    </form>
  </section>
</th:block>
</html>
