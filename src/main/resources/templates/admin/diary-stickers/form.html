<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::body}, ~{::headFragment}, 'diary-stickers')}">
<th:block th:fragment="headFragment"><link rel="stylesheet" href="/css/admin-diary-stickers.css"></th:block>
<th:block th:fragment="body">
  <section class="admin-page-section admin-sticker-form-page">
    <header class="admin-page-header">
      <div class="admin-page-heading"><h1 class="admin-page-title" th:text="${pageTitle}">스티커 등록</h1><p class="admin-page-description">PNG 또는 WebP 이미지를 업로드합니다.</p></div>
      <div class="admin-page-actions"><a th:href="@{/admin/diary/stickers}" class="admin-btn">스티커 목록</a></div>
    </header>
    <form th:action="${formAction}" th:object="${stickerForm}" method="post" enctype="multipart/form-data" class="admin-form-card">
      <div th:if="${#fields.hasAnyErrors()}" class="admin-alert" role="alert"><p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p></div>
      <div class="admin-sticker-current" th:if="${editMode and currentImageUrl != null}"><span>현재 이미지</span><img th:src="${currentImageUrl}" alt="현재 스티커 이미지"></div>
      <div class="admin-form-fields">
        <div class="admin-form-field"><label for="sticker-name">이름</label><input id="sticker-name" type="text" th:field="*{name}" maxlength="100" required></div>
        <div class="admin-form-field"><label for="sticker-category">카테고리</label><select id="sticker-category" th:field="*{categoryId}" required><option value="">선택</option><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option></select></div>
        <div class="admin-form-field"><label for="sticker-type">유형</label><select id="sticker-type" th:field="*{stickerType}" required><option th:each="type : ${stickerTypes}" th:value="${type}" th:text="${type}"></option></select></div>
        <div class="admin-form-field"><label for="sticker-tier">이용등급</label><select id="sticker-tier" th:field="*{accessTier}" required><option th:each="tier : ${accessTiers}" th:value="${tier}" th:text="${tier}"></option></select></div>
        <div class="admin-form-field"><label for="sticker-order">표시순서</label><input id="sticker-order" type="number" th:field="*{displayOrder}" min="1" required></div>
        <div class="admin-form-field"><label for="sticker-visible">노출여부</label><select id="sticker-visible" th:field="*{visible}" required><option value="true">노출</option><option value="false">숨김</option></select></div>
        <div class="admin-form-field is-wide"><label for="sticker-image" th:text="${editMode} ? '새 이미지 (선택)' : '이미지'">이미지</label><input id="sticker-image" type="file" th:field="*{image}" accept="image/png,image/webp" th:required="${!editMode}"><span class="admin-help-text" th:if="${editMode}">비워 두면 현재 이미지를 유지합니다. 이미지를 교체해도 이전 파일은 기존 다이어리를 위해 보존됩니다.</span></div>
      </div>
      <div class="admin-form-actions"><a th:href="@{/admin/diary/stickers}" class="admin-btn">취소</a><button type="submit" class="admin-btn is-primary" th:text="${editMode} ? '수정 저장' : '등록'">등록</button></div>
    </form>
  </section>
</th:block>
</html>
