<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::body}, ~{::headFragment}, 'diary-stickers')}">
<th:block th:fragment="headFragment"><link rel="stylesheet" href="/css/admin-diary-stickers.css"></th:block>
<th:block th:fragment="body">
  <section class="admin-page-section">
    <header class="admin-page-header"><div class="admin-page-heading"><h1 class="admin-page-title">스티커 카테고리 관리</h1><p class="admin-page-description">선택창의 카테고리 이름, 노출 여부와 순서를 관리합니다.</p></div><div class="admin-page-actions"><a th:href="@{/admin/diary/stickers}" class="admin-btn">스티커 목록</a><a th:href="@{/admin/diary/stickers/categories/new}" class="admin-btn is-primary">+ 카테고리 등록</a></div></header>
    <div th:if="${message}" class="admin-alert is-success" th:text="${message}"></div>
    <div class="admin-card is-table-card"><div class="admin-table-wrapper"><table class="admin-table"><thead><tr><th>카테고리명</th><th>표시순서</th><th>상태</th><th>관리</th></tr></thead><tbody>
      <tr th:each="category : ${categories}"><td th:text="${category.name}">여행</td><td th:text="${category.displayOrder}">1</td><td th:text="${category.visible} ? '노출' : '숨김'">노출</td><td class="admin-table-actions"><a th:href="@{/admin/diary/stickers/categories/{id}/edit(id=${category.id})}" class="admin-btn is-small is-primary">수정</a></td></tr>
      <tr th:if="${#lists.isEmpty(categories)}"><td colspan="4" class="admin-table-empty">등록된 카테고리가 없습니다.</td></tr>
    </tbody></table></div></div>
  </section>
</th:block>
</html>
