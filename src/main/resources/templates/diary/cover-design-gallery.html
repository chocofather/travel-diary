<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  내 보유 표지 디자인 갤러리. 내 표지 디자인 페이지와 표지 라이브러리 패널 아래쪽이 함께 쓴다.

  designs / elementsByDesign : 로그인 회원의 디자인과 그 요소(한 번에 읽어 둔 것)
  addedId : 라이브러리에서 방금 받은 디자인 번호. 없으면 null
  idPrefix : 페이지와 패널이 한 화면에 같이 떠 있어도 id 가 겹치지 않게 붙이는 앞머리
-->
<ul class="diary-cover-design-gallery"
    th:fragment="gallery(designs, elementsByDesign, addedId, idPrefix)">
  <li class="diary-cover-design-item" th:each="design : ${designs}"
      th:id="|${idPrefix}-${design.id}|"
      th:classappend="${addedId != null and addedId == design.id} ? ' is-just-added' : ''">
    <!-- 표지를 누르면 기존 편집 화면으로 바로 들어간다. -->
    <a class="diary-cover-design-preview-link"
       th:href="@{/diaries/cover-designs/{id}/edit(id=${design.id})}"
       th:attr="aria-label=|${design.name} 디자인 편집|">
      <!-- 꾸민 그대로 줄여 보여 준다. 요소는 위에서 한 번에 읽어 둔 것을 나눠 쓴다. -->
      <div th:replace="~{diary/cover-preview :: canvas(${design},
                         ${elementsByDesign.getOrDefault(design.id, #lists.toList({}))})}"></div>
    </a>

    <div class="diary-cover-design-info">
      <div class="diary-cover-design-text">
        <a class="diary-cover-design-title-link"
           th:href="@{/diaries/cover-designs/{id}/edit(id=${design.id})}">
          <h3 class="diary-cover-design-name" th:text="${design.name}">제주 여행</h3>
        </a>
        <p class="diary-cover-design-style"
           th:text="${design.baseCoverStyleLabel}">가죽 딥그린</p>
        <!-- 출처. 라이브러리에서 받은 디자인만 작게 표시한다. (직접 만든 디자인은 아무것도 붙지 않는다) -->
        <p class="diary-cover-design-source"
           th:if="${design.sourceLibraryItemId != null}">라이브러리에서 받은 디자인</p>
        <!-- 라이브러리에서 방금 받은 디자인만 한 줄로 알려 준다. -->
        <p class="diary-cover-design-added"
           th:if="${addedId != null and addedId == design.id}">방금 라이브러리에서 받았어요</p>
      </div>

      <!-- 삭제는 기존 카드 ⋯ 메뉴 패턴에 넣는다. 표지 위가 아니라 이름 옆에 둔다. -->
      <div class="diary-book-menu">
        <button type="button" class="diary-book-menu-button"
                aria-haspopup="menu" aria-expanded="false"
                th:attr="aria-controls=|${idPrefix}-menu-${design.id}|,
                         aria-label=|${design.name} 디자인 관리 메뉴|">⋯</button>
        <div class="diary-book-menu-panel" role="menu"
             th:id="|${idPrefix}-menu-${design.id}|"
             th:attr="aria-label=|${design.name} 디자인 관리|" hidden>
          <form class="diary-cover-design-delete"
                th:action="@{/diaries/cover-designs/{id}/delete(id=${design.id})}" method="post"
                th:attr="onsubmit=|return confirm('${design.name} 디자인을 삭제할까요? 이미 여행일기에 적용한 표지는 그대로 남습니다.')|">
            <button type="submit" class="diary-book-menu-item is-danger" role="menuitem"
                    th:attr="aria-label=|${design.name} 디자인 삭제|">디자인 삭제</button>
          </form>
        </div>
      </div>
    </div>

    <!-- 라이브러리에서 받은 디자인은 다시 공유할 수 없다. (서버의 공유 등록도 거부한다) -->
    <a class="diary-cover-design-share"
       th:if="${design.sourceLibraryItemId == null}"
       th:href="@{/diaries/cover-designs/{id}/library-share(id=${design.id})}"
       th:attr="aria-label=|${design.name} 디자인을 라이브러리에 공유|">라이브러리에 공유</a>
  </li>
</ul>

</body>
</html>
