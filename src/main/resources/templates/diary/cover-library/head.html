<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  표지 라이브러리 화면(둘러보기/상세/내 공유 디자인)이 함께 쓰는 조각들.
  단독 페이지와 내 표지 디자인 위 패널이 같은 마크업을 쓴다.
  패널은 "표지 디자인" 허브로, 위에 표지 라이브러리, 아래에 내 보유 디자인을 둔다.
-->

<!--
  패널 머리. 제목, 새 디자인 만들기, 닫기만 둔다. (스크롤해도 패널 위에 남는다)
  닫기는 나의 여행일기로 가는 링크라서 스크립트가 없어도 동작하고,
  패널 안에서는 스크립트가 가로채 패널만 닫는다.
-->
<header class="diary-library-head" th:fragment="head(view)">
  <div class="diary-library-head-row">
    <div class="diary-library-heading">
      <h1 class="diary-library-title" data-cover-library-title tabindex="-1">표지 디자인</h1>
    </div>
    <div class="diary-library-head-actions">
      <!-- 새 디자인은 기존 생성 화면으로 이동한다. 패널 머리에 녹아드는 흰 바탕 외곽선 버튼이다. -->
      <a class="diary-library-new" th:href="@{/diaries/cover-designs/new}"><span
              class="diary-library-new-plus" aria-hidden="true">+</span>새 디자인 만들기</a>
      <a class="diary-library-close" th:href="@{/diaries}"
         data-cover-library-close aria-label="표지 디자인 닫기">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
      </a>
    </div>
  </div>
</header>

<!--
  위쪽 표지 라이브러리 영역의 머리. 한 줄에 왼쪽 제목·설명, 오른쪽 탭(최신순|인기순|내 공유 디자인)과 접기 버튼.
  접으면 탭 대신 공개 디자인 개수만 남고, 아래 본문(갤러리)이 숨는다.
  접기 버튼은 패널 스크립트가 켤 때만 보인다. (스크립트 없는 단독 페이지는 늘 펼친 모습이다)

  view : 'LATEST' / 'POPULAR' / 'mine'
  count: 공개 디자인 개수. 모르면 null (개수 표시를 두지 않는다)
-->
<div class="diary-library-section-head" th:fragment="libraryHeading(view, count)"
     data-library-section-header>
  <div class="diary-library-section-heading">
    <h2 class="diary-library-section-title">표지 라이브러리</h2>
    <p class="diary-library-subtitle">여행자들이 공유한 디자인을 둘러보세요.</p>
  </div>

  <div class="diary-library-section-tools">
    <nav class="diary-library-tabs" aria-label="표지 라이브러리 보기" data-library-section-tabs>
      <a class="diary-library-tab" th:href="@{/diaries/cover-library}"
         th:classappend="${view == 'LATEST'} ? ' is-current' : ''"
         th:attr="aria-current=${view == 'LATEST'} ? 'page' : null">최신순</a>
      <span class="diary-library-tab-divider" aria-hidden="true"></span>
      <a class="diary-library-tab" th:href="@{/diaries/cover-library(sort='POPULAR')}"
         th:classappend="${view == 'POPULAR'} ? ' is-current' : ''"
         th:attr="aria-current=${view == 'POPULAR'} ? 'page' : null">인기순</a>
      <span class="diary-library-tab-divider" aria-hidden="true"></span>
      <a class="diary-library-tab" th:href="@{/diaries/cover-library/mine}"
         th:classappend="${view == 'mine'} ? ' is-current' : ''"
         th:attr="aria-current=${view == 'mine'} ? 'page' : null">내 공유 디자인</a>
    </nav>
    <span class="diary-library-section-count" th:if="${count != null}"
          th:text="|${count}개의 디자인|">3개의 디자인</span>
    <button type="button" class="diary-library-section-toggle"
            aria-expanded="true" aria-controls="cover-library-section-body"
            aria-label="표지 라이브러리 접기" data-library-section-toggle hidden>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10l4-4 4 4"/></svg>
    </button>
  </div>
</div>

<!--
  라이브러리 카드의 "내 공유" 표시. 내가 직접 공유한 표지(creator_user_id 가 나)에서
  받기(+)·보유중·신고 대신 놓인다. 원본을 이미 가지고 있으므로 받을 대상이 아니다.
-->
<span class="diary-library-shared-badge" th:fragment="sharedBadge">내 공유</span>

<!--
  라이브러리 카드의 "보유중" 표시. 지금 이 표지에서 받은 디자인을 가지고 있을 때 받기(+) 대신 놓인다.
  패널이 바로 받은 뒤 카드를 고칠 때도 같은 조각을 쓴다.
-->
<span class="diary-library-owned-badge" th:fragment="ownedBadge">
  <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.4l2.9 2.8 6.1-6.4"/></svg>
  보유중
</span>

<!--
  아래쪽 내 보유 디자인 영역. 내 표지 디자인 페이지의 갤러리 조각을 그대로 쓴다.
  라이브러리에서 받은 직후라면 안내 문구와 방금 받은 표지 표시가 함께 나온다.
-->
<section class="diary-library-section is-owned" th:fragment="owned(designs, elementsByDesign, addedId, message)"
         aria-labelledby="cover-library-owned-title" data-cover-library-owned>
  <div class="diary-library-section-head">
    <h2 class="diary-library-section-title" id="cover-library-owned-title">내 보유 디자인</h2>
    <p class="diary-library-subtitle">직접 만들거나 라이브러리에서 받은 표지입니다.</p>
  </div>

  <p class="diary-flash-message" th:if="${message != null}" th:text="${message}"
     role="status">내 디자인에 추가했습니다.</p>

  <th:block th:unless="${#lists.isEmpty(designs)}">
    <ul th:replace="~{diary/cover-design-gallery :: gallery(${designs}, ${elementsByDesign},
                    ${addedId}, 'cover-library-owned')}"></ul>
  </th:block>

  <p class="diary-library-owned-empty" th:if="${#lists.isEmpty(designs)}" role="status">
    아직 보유한 표지 디자인이 없습니다. 위 라이브러리에서 마음에 드는 표지를 받아 보세요.
  </p>
</section>

<!--
  표지 디자인 패널 껍데기. 나의 여행일기(/diaries) 화면에 한 번 둔다.
  내용은 비워 두고, 열 때 기존 라이브러리 주소의 화면을 불러와 채운다.
  (위: 라이브러리 둘러보기/내 공유 디자인, 아래: 내 보유 디자인. 상세도 이 자리에서 바뀐다)

  예전 주소로 들어오며 넘어온 안내 문구(flash)는 notice 에 담아 두었다가,
  패널이 처음 그려질 때 제목 아래로 옮긴다.
-->
<div class="diary-library-overlay" th:fragment="overlay" data-cover-library-overlay hidden>
  <div class="diary-library-sheet" role="dialog" aria-modal="true" aria-label="표지 디자인"
       data-cover-library-sheet>
    <div class="diary-library-sheet-content" data-cover-library-content></div>
  </div>
  <!-- 목록에서 바로 받은 결과를 잠깐 알리는 작은 안내. (패널을 닫거나 화면을 옮기지 않는다) -->
  <div class="diary-library-toast" data-cover-library-toast role="status" aria-live="polite" hidden>
    <span class="diary-library-toast-text" data-cover-library-toast-text></span>
    <button type="button" class="diary-library-toast-action" data-cover-library-toast-action hidden>보기</button>
  </div>
  <template data-cover-library-notice>
    <p class="diary-flash-message" th:if="${coverDesignMessage}" th:text="${coverDesignMessage}"
       role="status">표지 디자인을 저장했습니다.</p>
    <p class="diary-flash-message" th:if="${coverLibraryMessage}" th:text="${coverLibraryMessage}"
       role="status">상태를 변경했습니다.</p>
    <p class="diary-form-error" th:if="${coverDesignError}" th:text="${coverDesignError}"
       role="alert">표지 디자인을 공유할 수 없습니다.</p>
    <p class="diary-form-error" th:if="${coverLibraryError}" th:text="${coverLibraryError}"
       role="alert">표지 디자인을 받을 수 없습니다.</p>
  </template>
</div>

</body>
</html>
