<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::body}, ~{::headFragment})}">

<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/diary.css">
  <link rel="stylesheet" href="/css/diary-fonts.css">
  <script src="/js/diary-tape-repeat.js" defer></script>
  <script src="/js/diary-cover-library-download.js" defer></script>
  <script src="/js/diary-cover-library-report.js" defer></script>
</th:block>

<th:block th:fragment="body">
  <article class="diary-cover-library-detail" aria-labelledby="cover-library-detail-title">
    <header class="diary-form-header">
      <a class="diary-detail-back" th:href="@{/diaries/cover-library}">← 표지 라이브러리로</a>
    </header>

    <p class="diary-flash-message" th:if="${coverLibraryMessage}"
       th:text="${coverLibraryMessage}" role="status">신고가 접수되었습니다.</p>
    <p class="diary-form-error" th:if="${coverLibraryError}"
       th:text="${coverLibraryError}" role="alert">신고를 접수하지 못했습니다.</p>

    <div class="diary-cover-library-detail-layout">
      <div class="diary-cover-library-detail-preview">
        <div th:replace="~{diary/cover-preview :: canvas(${libraryItem}, ${libraryElements})}"></div>
      </div>

      <section class="diary-cover-library-detail-info">
        <p class="diary-list-eyebrow">SHARED COVER</p>
        <h1 id="cover-library-detail-title" th:text="${libraryItem.title}">여름의 표지</h1>
        <p class="diary-cover-library-detail-creator"
           th:text="|디자이너 ${libraryItem.creatorDisplayName}|">디자이너 여행자</p>
        <p class="diary-cover-library-description"
           th:if="${libraryItem.description != null and !#strings.isEmpty(libraryItem.description)}"
           th:text="${libraryItem.description}">표지 설명</p>
        <p class="diary-cover-library-description is-empty"
           th:unless="${libraryItem.description != null and !#strings.isEmpty(libraryItem.description)}">
          등록된 설명이 없습니다.
        </p>
        <dl class="diary-cover-library-detail-meta">
          <div>
            <dt>등록일</dt>
            <dd><time th:datetime="${#dates.format(libraryItem.publishedAt, 'yyyy-MM-dd')}"
                      th:text="${#dates.format(libraryItem.publishedAt, 'yyyy.MM.dd')}">2026.09.17</time></dd>
          </div>
          <div>
            <dt>이용 현황</dt>
            <dd th:text="|다운로드 ${libraryItem.downloadCount}|">다운로드 0</dd>
          </div>
        </dl>
        <form class="diary-cover-library-download"
              th:action="@{/diaries/cover-library/{id}/download(id=${libraryItem.id})}"
              method="post" data-cover-library-download-form>
          <p>내 표지 디자인에 복사하여 자유롭게 수정할 수 있습니다.</p>
          <button type="submit" class="diary-new-button" data-download-submit>
            내 디자인으로 받기
          </button>
        </form>
        <button type="button" class="diary-cover-library-report-open"
                data-cover-report-open>신고</button>
      </section>
    </div>

    <div class="diary-cover-library-report-modal" data-cover-report-modal hidden>
      <section class="diary-cover-library-report-dialog" role="dialog" aria-modal="true"
               aria-labelledby="cover-library-report-title">
        <button type="button" class="diary-cover-library-report-close"
                data-cover-report-close aria-label="신고 창 닫기">×</button>
        <h2 id="cover-library-report-title">공유 표지 신고</h2>
        <p>문제가 있는 대상을 선택해 주세요.</p>

        <form th:action="@{/diaries/cover-library/{id}/reports(id=${libraryItem.id})}"
              method="post" data-cover-report-form>
          <fieldset class="diary-cover-library-report-targets">
            <legend>신고 대상</legend>
            <label class="diary-cover-library-report-target is-item">
              <input type="radio" name="photoAssetId" value="" checked>
              <span>표지 전체</span>
            </label>
            <label class="diary-cover-library-report-target"
                   th:each="element, photoStat : ${reportablePhotoElements}">
              <input type="radio" name="photoAssetId" th:value="${element.photoAssetId}">
              <span class="diary-cover-library-report-thumb">
                <img th:src="${element.imageUrl}" alt="" loading="lazy">
              </span>
              <span th:text="|공유 사진 ${photoStat.count}|">공유 사진 1</span>
            </label>
          </fieldset>

          <label class="diary-cover-library-report-field">
            <span>신고 사유</span>
            <select name="reasonCode" required data-cover-report-reason>
              <option value="">선택해 주세요</option>
              <option th:each="reason : ${reportReasons}"
                      th:value="${reason.name()}" th:text="${reason.displayName}">저작권 침해</option>
            </select>
          </label>

          <label class="diary-cover-library-report-field">
            <span>상세 설명 <small data-cover-report-description-hint>(선택)</small></span>
            <textarea name="description" rows="4" maxlength="1000"
                      data-cover-report-description
                      placeholder="신고 내용을 구체적으로 알려주세요."></textarea>
          </label>

          <div class="diary-cover-library-report-actions">
            <button type="button" data-cover-report-close>취소</button>
            <button type="submit" class="is-danger" data-cover-report-submit>신고 접수</button>
          </div>
        </form>
      </section>
    </div>
  </article>
</th:block>
</html>
