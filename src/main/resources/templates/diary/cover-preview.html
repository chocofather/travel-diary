<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  한 다이어리에 실제로 적용된 표지 내용. 책장과 PDF 준비 DOM이 이 조각을 함께 쓴다.
  바깥 .diary-book-cover가 A5 표지 상자를 맡고, 이 조각은 커스텀/기본 표지의 내용만 고른다.
-->
<th:block th:fragment="appliedCover(diary, cover, elements)">
  <th:block th:if="${cover != null}">
    <div th:replace="~{diary/cover-preview :: canvas(${cover}, ${elements})}"></div>
  </th:block>

  <th:block th:if="${cover == null}">
    <img th:if="${diary.coverImageUrl != null and !#strings.isEmpty(diary.coverImageUrl)}"
         class="diary-book-image"
         th:src="${diary.coverImageUrl}"
         th:alt="|${diary.title} 표지|"
         loading="lazy" />
    <div th:unless="${diary.coverImageUrl != null and !#strings.isEmpty(diary.coverImageUrl)}"
         class="diary-book-placeholder" aria-hidden="true"></div>
    <span class="diary-book-spine" aria-hidden="true"></span>
  </th:block>
</th:block>

<!--
  완성된 표지 한 장을 그대로 줄여 보여 준다. (보관함 카드용, 보기 전용)

  바깥(.diary-cover-canvas)이 표지 자체다. 세로형 비율과 재질을 여기서 정하고,
  안쪽(.diary-cover-surface)에 저장된 요소가 편집 화면과 같은 상대좌표로 놓인다.
  캔버스 크기만 다를 뿐 좌표·크기·각도·겹침 순서는 편집 화면과 같은 값을 쓰므로,
  카드가 작아져도 꾸민 모습 그대로 줄어든다.

  보기 전용이라 조작 손잡이와 액션 줄, 저장 주소(data-*-url)는 넣지 않는다.
  요소 번호도 싣지 않아 조작 엔진이 잡을 것이 아예 없다.
  (엔진은 .diary-cover-canvas.is-editable 이 있을 때만 붙는데 여기에는 그 표시가 없다)
-->
<div th:fragment="canvas(design, elements)" class="diary-cover-canvas"
     th:classappend="${design.baseCoverStyleClass}"
     th:style="${design.backgroundColor != null and !#strings.isEmpty(design.backgroundColor)}
               ? '--diary-cover-color:' + ${design.backgroundColor} : null">
  <!-- 요소가 없는 디자인은 이 안이 비어 있고 재질과 색만 보인다 -->
  <div class="diary-canvas diary-cover-surface">
    <figure class="diary-canvas-item diary-canvas-photo diary-photo"
            th:each="element : ${elements}"
            th:if="${element.elementType == 'PHOTO'}"
            th:classappend="${element.photoStyleClass}"
            th:style="|left:${element.positionX * 100}%;
                       top:${element.positionY * 100}%;
                       width:${element.width * 100}%;
                       height:${element.height * 100}%;
                       transform:rotate(${element.rotation}deg);
                       z-index:${element.zIndex};|">
      <span class="diary-cover-photo-placeholder" aria-hidden="true">사진 넣기</span>
      <img th:if="${element.imageUrl != null and !#strings.isEmpty(element.imageUrl)}"
           th:src="${element.imageUrl}" alt="" aria-hidden="true" loading="lazy"
           onerror="this.remove()" />
    </figure>

    <!-- NOTE도 페이지 다꾸와 같은 종이/색 class를 사용한다. -->
    <figure class="diary-canvas-item diary-note"
            th:each="element : ${elements}"
            th:if="${element.elementType == 'NOTE'}"
            th:classappend="${element.noteStyleClass}
                            + (${element.noteColorClass} != null
                               ? ' ' + ${element.noteColorClass} : '')"
            th:style="|left:${element.positionX * 100}%;
                       top:${element.positionY * 100}%;
                       width:${element.width * 100}%;
                       height:${element.height * 100}%;
                       transform:rotate(${element.rotation}deg);
                       z-index:${element.zIndex};|">
      <div class="diary-note-surface">
        <div class="diary-note-text" th:text="${element.textContent}">여행 메모</div>
      </div>
    </figure>

    <!-- 마스킹테이프는 조각 경로를 함께 실어 두면 diary-tape-repeat.js 가 같은 모습으로 그린다 -->
    <figure class="diary-canvas-item diary-canvas-sticker diary-sticker"
            th:each="element : ${elements}"
            th:if="${element.elementType == 'STICKER'}"
            th:with="tape=${stickerRepeats.get(element.imageUrl)}"
            th:data-sticker-kind="${element.stickerKind}"
            th:data-tape-left="${tape?.leftUrl}"
            th:data-tape-center="${tape?.centerUrl}"
            th:data-tape-right="${tape?.rightUrl}"
            th:style="|left:${element.positionX * 100}%;
                       top:${element.positionY * 100}%;
                       width:${element.width * 100}%;
                       height:${element.height * 100}%;
                       transform:rotate(${element.rotation}deg);
                       z-index:${element.zIndex};|">
      <img th:src="${element.imageUrl}" alt="" aria-hidden="true" loading="lazy" />
    </figure>

    <!-- 라벨기로 붙인 글씨. 편집 화면과 같은 모양 규칙(.diary-label)을 그대로 쓴다.
         글자 크기는 요소 자신의 크기에서 나오므로 표지가 작아지면 글씨도 함께 작아진다. -->
    <figure class="diary-canvas-item diary-label"
            th:each="element : ${elements}"
            th:if="${element.elementType == 'TEXT'}"
            th:style="|left:${element.positionX * 100}%;
                       top:${element.positionY * 100}%;
                       width:${element.width * 100}%;
                       height:${element.height * 100}%;
                       transform:rotate(${element.rotation}deg);
                       --diary-label-chars:${#strings.length(element.textContent)};
                       z-index:${element.zIndex};|">
      <span class="diary-label-text" th:classappend="${element.textFontClass}"
            th:style="${element.textColor != null and !#strings.isEmpty(element.textColor)}
                      ? 'color:' + ${element.textColor} : null"
            th:text="${element.textContent}">JEJU 2026</span>
    </figure>
  </div>
  <span class="diary-cover-canvas-spine" aria-hidden="true"></span>
</div>

</body>
</html>
