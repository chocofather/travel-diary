<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::body}, ~{::headFragment})}">

<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/diary.css">
  <script src="/js/diary-book-menu.js" defer></script>
  <script src="/js/diary-search.js" defer></script>
</th:block>

<th:block th:fragment="body">
  <section class="diary-list-page" aria-labelledby="diary-list-title">
    <header class="diary-list-header">
      <div class="diary-list-heading">
        <p class="diary-list-eyebrow">MY TRAVEL DIARY</p>
        <h1 id="diary-list-title">나의 여행일기</h1>
        <p class="diary-list-subtitle">여행에서의 순간을 나만의 다이어리로 남겨보세요.</p>
      </div>
      <div class="diary-list-tools">
        <!-- 책장 ↔ 달력. 각자 다른 주소를 쓰므로 검색/페이징과 상태가 섞이지 않는다. -->
        <div class="diary-view-switch" role="group" aria-label="보기 방식">
          <a class="diary-view-option is-current" aria-current="page"
             th:href="@{/diaries}">책장 보기</a>
          <a class="diary-view-option" th:href="@{/diaries/calendar}">달력 보기</a>
        </div>

        <!-- 제목/한 줄 메모/본문을 한 입력창으로 찾는다.
             입력하는 대로 결과 영역만 비동기로 갈아 끼우고, 검색어는 q 로 주소에 남는다.
             (JS 가 없으면 폼 전송으로도 같은 화면이 나온다) -->
        <form class="diary-search" id="diary-search-form" th:action="@{/diaries}"
              method="get" role="search"
              th:data-fragment-url="@{/diaries/fragment}">
          <svg class="diary-search-icon" viewBox="0 0 16 16" aria-hidden="true"
               fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <circle cx="7" cy="7" r="4.6" />
            <path d="M10.4 10.4 14 14" />
          </svg>
          <input type="search" name="q" class="diary-search-input"
                 placeholder="여행일기 검색" aria-label="여행일기 검색"
                 autocomplete="off" maxlength="150" th:value="${diaryPage.keyword}" />
          <span class="diary-search-spinner" aria-hidden="true" hidden></span>
          <button type="submit" class="diary-search-submit" aria-label="검색">검색</button>
        </form>

        <!-- 정렬 고르기. 검색과 같은 비동기 흐름을 그대로 타고, 기본값(최근 수정순)은
             주소를 깔끔하게 두려고 sort 를 생략한다. -->
        <div class="diary-sort" id="diary-sort" th:data-default-sort="${diaryPage.defaultSortName}">
          <button type="button" class="diary-sort-button" id="diary-sort-button"
                  aria-haspopup="listbox" aria-expanded="false"
                  aria-controls="diary-sort-menu" aria-label="정렬 기준">
            <span class="diary-sort-mark" aria-hidden="true">&#8597;</span>
            <span class="diary-sort-value" id="diary-sort-value"
                  th:text="${diaryPage.sort.label}">최근 수정순</span>
            <span class="diary-sort-arrow" aria-hidden="true">&#9662;</span>
          </button>
          <div class="diary-sort-menu" id="diary-sort-menu" role="listbox"
               aria-label="정렬 기준" hidden>
            <button type="button" class="diary-sort-option" role="option"
                    th:each="option : ${diaryPage.sortOptions}"
                    th:data-sort="${option.name()}"
                    th:classappend="${option == diaryPage.sort} ? ' is-current' : ''"
                    th:attr="aria-selected=${option == diaryPage.sort}"
                    th:text="${option.label}">최근 수정순</button>
          </div>
        </div>

        <a class="diary-new-button" th:href="@{/diaries/new}"><span
                class="diary-new-button-plus" aria-hidden="true">+</span>새 여행일기</a>
      </div>
    </header>

    <p class="diary-flash-message" th:if="${diaryMessage}" th:text="${diaryMessage}"
       role="status">여행일기가 만들어졌습니다.</p>

    <!-- 검색 결과는 이 자리만 비동기로 갈아 끼운다. (아래 results 조각과 같은 HTML) -->
    <div th:replace="~{diary/list :: results}"></div>
  </section>
</th:block>

<!-- 목록 결과: 카드 / 쪽 이동 / 빈 상태.
     첫 화면과 비동기 검색이 같은 조각을 써서 카드 HTML 을 두 벌로 만들지 않는다. -->
<div th:fragment="results" id="diary-results" class="diary-results">
    <!-- 표지 스타일(cover_style)은 클래스로 붙여 이후 스타일이 늘어나도 그대로 쓸 수 있게 한다.
         LEATHER_BLACK → diary-cover-leather-black (폼의 견본과 같은 클래스) -->
    <ul class="diary-shelf" th:unless="${#lists.isEmpty(diaryList)}">
      <li class="diary-book" th:each="diary : ${diaryList}"
          th:classappend="${diary.coverStyle != null and !#strings.isEmpty(diary.coverStyle)}
                          ? ' diary-cover-'
                            + ${#strings.replace(#strings.toLowerCase(diary.coverStyle), '_', '-')} : ''">
        <a class="diary-book-inner" th:href="@{/diaries/{id}(id=${diary.id})}">
          <!-- 표지에는 대표 이미지와 책 재질/책등만 남긴다 (제목은 표지 아래 정보로) -->
          <div class="diary-book-cover">
            <img th:if="${diary.coverImageUrl != null and !#strings.isEmpty(diary.coverImageUrl)}"
                 class="diary-book-image"
                 th:src="${diary.coverImageUrl}"
                 th:alt="|${diary.title} 표지|"
                 loading="lazy" />
            <!-- 대표 이미지가 없으면 깨진 이미지 대신 표지 소재만 보이는 무지 표지를 쓴다 -->
            <div th:unless="${diary.coverImageUrl != null and !#strings.isEmpty(diary.coverImageUrl)}"
                 class="diary-book-placeholder" aria-hidden="true"></div>
            <span class="diary-book-spine" aria-hidden="true"></span>
          </div>

          <!-- 책 아래 목록 정보: 1줄 제목 / 2줄 기간 + 페이지 수 -->
          <div class="diary-book-info">
            <h2 class="diary-book-title" th:text="${diary.title}">여행일기 제목</h2>
            <div class="diary-book-meta">
              <time class="diary-book-period"
                    th:text="|${diary.startDate} ~ ${diary.endDate}|">2026-08-01 ~ 2026-08-05</time>
              <span class="diary-book-pages" th:text="|${diary.pageCount}장|">0장</span>
            </div>
          </div>
        </a>

        <!-- 책 관리 메뉴. 카드 링크(a) 바깥에 두어 표지 클릭을 가로채지 않는다.
             설정/삭제는 기존 route 를 그대로 쓴다. -->
        <div class="diary-book-menu">
          <button type="button" class="diary-book-menu-button"
                  aria-haspopup="menu" aria-expanded="false"
                  th:attr="aria-controls=|diary-book-menu-${diary.id}|,
                           aria-label=|${diary.title} 관리 메뉴|">⋯</button>
          <div class="diary-book-menu-panel" role="menu"
               th:id="|diary-book-menu-${diary.id}|"
               th:attr="aria-label=|${diary.title} 관리|" hidden>
            <a class="diary-book-menu-item" role="menuitem"
               th:href="@{/diaries/{id}/edit(id=${diary.id})}">다이어리 설정</a>
            <form th:action="@{/diaries/{id}/delete(id=${diary.id})}" method="post"
                  onsubmit="return confirm('이 여행일기를 삭제하면 모든 페이지와 사진이 함께 삭제됩니다. 삭제하시겠습니까?');">
              <button type="submit" class="diary-book-menu-item is-danger"
                      role="menuitem">다이어리 삭제</button>
            </form>
          </div>
        </div>
      </li>
    </ul>

    <!-- 목록 쪽 이동. 검색 중이면 q 를, 기본이 아닌 정렬이면 sort 를 그대로 달고 다닌다. -->
    <nav class="diary-pagination" th:if="${diaryPage.totalPages > 1}"
         aria-label="여행일기 목록 페이지">
      <a th:if="${diaryPage.currentPage > 1}" class="page-nav" aria-label="이전 페이지"
         th:href="@{/diaries(q=${diaryPage.searching ? diaryPage.keyword : null},sort=${diaryPage.sortParam},page=${diaryPage.currentPage - 1})}">&#8249;</a>
      <span th:unless="${diaryPage.currentPage > 1}" class="page-nav is-disabled"
            aria-disabled="true">&#8249;</span>

      <th:block th:each="i : ${#numbers.sequence(1, diaryPage.totalPages)}">
        <a th:if="${i != diaryPage.currentPage}" class="page-number"
           th:href="@{/diaries(q=${diaryPage.searching ? diaryPage.keyword : null},sort=${diaryPage.sortParam},page=${i})}" th:text="${i}">1</a>
        <span th:if="${i == diaryPage.currentPage}" class="page-number is-current"
              aria-current="page" th:text="${i}">1</span>
      </th:block>

      <a th:if="${diaryPage.currentPage < diaryPage.totalPages}" class="page-nav"
         aria-label="다음 페이지"
         th:href="@{/diaries(q=${diaryPage.searching ? diaryPage.keyword : null},sort=${diaryPage.sortParam},page=${diaryPage.currentPage + 1})}">&#8250;</a>
      <span th:unless="${diaryPage.currentPage < diaryPage.totalPages}"
            class="page-nav is-disabled" aria-disabled="true">&#8250;</span>
    </nav>

    <!-- 검색 결과가 없을 때. (한 권도 없는 상태와 구분한다) -->
    <div class="diary-empty" th:if="${#lists.isEmpty(diaryList) and diaryPage.searching}"
         role="status">
      <span class="diary-empty-mark" aria-hidden="true">✎</span>
      <p class="diary-empty-title"
         th:text="|“${diaryPage.keyword}”에 해당하는 여행일기를 찾지 못했어요.|">검색 결과가 없습니다.</p>
      <p class="diary-empty-text">제목이나 페이지 내용에 들어간 다른 낱말로 찾아보세요.</p>
      <a class="diary-empty-reset" th:href="@{/diaries}">전체 여행일기 보기</a>
    </div>

    <div class="diary-empty" th:if="${#lists.isEmpty(diaryList) and !diaryPage.searching}"
         role="status">
      <span class="diary-empty-mark" aria-hidden="true">✎</span>
      <p class="diary-empty-title">아직 작성한 여행일기가 없습니다.</p>
      <p class="diary-empty-text">여행에서의 추억을 한 권의 다이어리로 남겨보세요.</p>
      <a class="diary-new-button" th:href="@{/diaries/new}"><span
              class="diary-new-button-plus" aria-hidden="true">+</span>새 여행일기</a>
    </div>
</div>
</html>
