<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  4자리 PIN 입력 판. 여는 자리는 넷이지만(열기 / 걸기 / 바꾸기 / 풀기) 판은 이 하나뿐이다.

  무엇을 묻는지는 그때그때 diary-pin.js 가 제목과 안내 문구만 갈아 끼우고,
  입력 칸·숫자판·오류 자리는 그대로 쓴다.

  입력한 숫자는 화면에 그대로 두지 않는다. 채워진 칸의 개수만 보이고,
  값 자체는 스크립트 안에서만 들고 있다가 판을 닫을 때 지운다.
  (DOM 이나 hidden 칸에 남기지 않는다)
-->
<div th:fragment="modal" class="diary-pin-backdrop" id="diary-pin-backdrop" hidden>
  <!-- 열리면 판 자체가 초점을 받아 키보드 숫자를 바로 받을 수 있다 -->
  <div class="diary-pin-modal" role="dialog" aria-modal="true" tabindex="-1"
       aria-labelledby="diary-pin-title" data-pin-modal>
    <span class="diary-pin-mark" aria-hidden="true">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.4" y="7" width="9.2" height="6.4" rx="1.4" />
        <path d="M5.8 7V5.2a2.2 2.2 0 0 1 4.4 0V7" />
      </svg>
    </span>

    <h2 class="diary-pin-title" id="diary-pin-title" data-pin-title>이 여행일기는 잠겨 있어요</h2>
    <p class="diary-pin-guide" data-pin-guide>4자리 PIN을 입력해 주세요.</p>

    <!-- 채워진 칸만 보인다. 숫자는 보이지 않는다 -->
    <div class="diary-pin-slots" data-pin-slots role="img" aria-label="PIN 입력 칸">
      <span class="diary-pin-slot"></span>
      <span class="diary-pin-slot"></span>
      <span class="diary-pin-slot"></span>
      <span class="diary-pin-slot"></span>
    </div>

    <p class="diary-pin-error" data-pin-error role="alert" hidden></p>

    <!-- 화면 숫자판. 키보드로도 같은 값을 넣을 수 있다 -->
    <div class="diary-pin-pad" data-pin-pad>
      <button type="button" class="diary-pin-key" data-pin-key="1">1</button>
      <button type="button" class="diary-pin-key" data-pin-key="2">2</button>
      <button type="button" class="diary-pin-key" data-pin-key="3">3</button>
      <button type="button" class="diary-pin-key" data-pin-key="4">4</button>
      <button type="button" class="diary-pin-key" data-pin-key="5">5</button>
      <button type="button" class="diary-pin-key" data-pin-key="6">6</button>
      <button type="button" class="diary-pin-key" data-pin-key="7">7</button>
      <button type="button" class="diary-pin-key" data-pin-key="8">8</button>
      <button type="button" class="diary-pin-key" data-pin-key="9">9</button>
      <button type="button" class="diary-pin-key is-quiet" data-pin-backspace
              aria-label="한 자리 지우기">←</button>
      <button type="button" class="diary-pin-key" data-pin-key="0">0</button>
      <button type="button" class="diary-pin-key is-submit" data-pin-submit>확인</button>
    </div>

    <button type="button" class="diary-pin-cancel" data-pin-cancel>취소</button>
  </div>
</div>

<!--
  잠금이 걸린 다이어리의 관리 판. 무엇을 할지만 고르고, 실제 PIN 입력은 위 판이 이어받는다.
  (수정 화면으로 보내지 않고 책장에서 바로 끝낸다)
-->
<div th:fragment="manage" class="diary-pin-backdrop" id="diary-pin-manage-backdrop" hidden>
  <div class="diary-pin-modal" role="dialog" aria-modal="true" tabindex="-1"
       aria-labelledby="diary-pin-manage-title" data-pin-manage-modal>
    <span class="diary-pin-mark" aria-hidden="true">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.4" y="7" width="9.2" height="6.4" rx="1.4" />
        <path d="M5.8 7V5.2a2.2 2.2 0 0 1 4.4 0V7" />
      </svg>
    </span>

    <h2 class="diary-pin-title" id="diary-pin-manage-title">PIN 잠금 사용 중</h2>
    <p class="diary-pin-guide">잠금을 바꾸거나 해제할 수 있어요.</p>

    <div class="diary-pin-manage-actions">
      <button type="button" class="diary-pin-action" data-pin-manage-change>PIN 변경</button>
      <button type="button" class="diary-pin-action" data-pin-manage-remove>잠금 해제</button>
    </div>

    <button type="button" class="diary-pin-cancel" data-pin-manage-cancel>닫기</button>
  </div>
</div>

</body>
</html>
