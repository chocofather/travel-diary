<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::body}, ~{::headFragment})}">

<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/diary.css">
  <link rel="stylesheet" href="/css/diary-fonts.css">
  <!--
    회원 표지 편집기와 같은 모듈을 그대로 쓴다. 저장 통로만 이 화면에서 갈아 끼운다.
    (자유배치 조작·스티커·라벨기·마스킹테이프는 페이지 다꾸와도 같은 엔진이다)
  -->
  <script src="/js/diary-save-transport.js" defer></script>
  <script src="/js/guest-diary-draft-store.js" defer></script>
  <script src="/js/diary-canvas-drag.js" defer></script>
  <script src="/js/diary-tape-repeat.js" defer></script>
  <script src="/js/diary-sticker-picker.js" defer></script>
  <script src="/js/diary-label-picker.js" defer></script>
  <!-- 사진. 원본은 IndexedDB 에만 두고 draft 에는 photoRef 만 남는다. -->
  <script src="/js/diary-cover-photo.js" defer></script>
  <script src="/js/guest-diary-photo-store.js" defer></script>
  <script src="/js/guest-diary-photo.js" defer></script>
  <!--
    체험 표지 편집기는 맨 뒤에 싣는다. 재질/색 칠하기는 defer 실행 시점에 끝나야 하고,
    저장해 둔 요소 되살리기는 위 모듈들이 마크업 생성기를 등록한 뒤라야 하기 때문이다.
    (2단계 페이지 편집기와 같은 순서 규칙)
  -->
  <script src="/js/guest-diary-cover-editor.js" defer></script>
</th:block>

<th:block th:fragment="body">
  <!--
    비회원 체험 표지 편집.

    회원의 "내 표지 디자인" 보관함과 달리 체험 표지는 한 장뿐이라
    디자인 이름·목록·삭제가 없다. 저장 버튼도 없고 바꾸는 즉시 draft 에 남는다.
  -->
  <!--
    표지는 다이어리 한 권의 속성이라 들어오는 자리도 나가는 자리도 책장 하나뿐이다.
    새로 만드는 중이든 책장 카드의 "표지 수정" 이든 끝나면 책장으로 돌아간다.
  -->
  <section class="diary-cover-design-page" aria-labelledby="demo-cover-title"
           data-guest-cover>
    <header class="diary-form-header">
      <a class="diary-detail-back" data-guest-cover-back
         th:href="@{/diaries/demo}">← 나의 여행일기로</a>
      <h1 id="demo-cover-title">표지 꾸미기</h1>
      <p class="diary-list-subtitle">
        <span class="diary-demo-badge">비회원 체험</span>
        표지 재질과 색을 고르고 스티커와 글씨를 올려 보세요. 바꾸는 즉시 이 브라우저에 임시 보관됩니다.
      </p>
    </header>

    <p class="diary-form-error" role="alert" hidden data-guest-missing-draft>
      만들어 둔 체험 여행일기가 없습니다.
      <a th:href="@{/diaries/demo}">나의 여행일기</a>에서 새 여행일기를 만들어 주세요.
    </p>

    <div class="diary-cover-design-editor" data-guest-cover-board>
      <div class="diary-cover-preview" data-cover-preview>
        <!--
          표지 한 장. 회원 편집기와 같은 클래스·같은 좌표계를 쓴다.
          is-editable 이 있어야 조작 엔진과 붙이기 도구가 붙는다.
          안쪽 요소는 guest-diary-cover-editor.js 가 draft 를 읽어 채운다.
        -->
        <div class="diary-cover-canvas is-editable" data-guest-cover-canvas>
          <div class="diary-canvas diary-cover-surface" data-guest-cover-surface></div>
          <span class="diary-cover-canvas-spine" aria-hidden="true"></span>
        </div>
      </div>

      <div class="diary-cover-design-panel">
        <!-- 저장 버튼이 없는 설정 묶음. 고르는 즉시 draft 에 남는다. -->
        <div class="diary-form">
          <div class="diary-form-field">
            <span class="diary-form-label">표지 재질</span>
            <div class="diary-cover-material-picker" role="radiogroup" aria-label="표지 재질">
              <label th:each="material : ${coverMaterials}"
                     class="diary-cover-material" th:classappend="${material.cssClass}">
                <input type="radio" name="baseCoverStyle" class="diary-cover-option-input"
                       th:value="${material.code}"
                       th:attr="data-cover-style-class=${material.cssClass}" />
                <span class="diary-cover-material-swatch" aria-hidden="true"></span>
                <span class="diary-cover-material-name" th:text="${material.label}">기본</span>
              </label>
            </div>
          </div>

          <div class="diary-form-field">
            <span class="diary-form-label">표지 색상</span>
            <div class="diary-cover-color-field" data-cover-color-field>
              <input type="hidden" name="backgroundColor" data-cover-color-value />
              <input type="color" class="diary-cover-color-input" aria-label="표지 색 고르기"
                     value="#fdfdfa" data-cover-color-input />
              <button type="button" class="diary-cover-color-reset"
                      data-cover-color-clear>기본색으로</button>
            </div>
            <span class="diary-form-hint">고르지 않으면 재질의 원래 색을 그대로 씁니다.</span>
          </div>

          <!-- 표지는 고르는 즉시 저장돼 있다. 이 버튼은 책장으로 보내기만 한다. -->
          <div class="diary-form-actions">
            <a class="diary-form-submit" data-guest-cover-done
               th:href="@{/diaries/demo}">표지 적용하기</a>
          </div>
        </div>

        <!-- 꾸미기 도구. 회원 표지 편집기와 같은 조각·같은 스크립트를 쓴다. -->
        <section class="diary-cover-tools" aria-label="꾸미기">
          <h2 class="diary-form-label">꾸미기</h2>
          <div class="diary-cover-tool-row">
            <button type="button" class="diary-cover-tool" id="diary-sticker-button"
                    aria-haspopup="dialog" aria-expanded="false"
                    aria-controls="diary-sticker-popover"
                    data-create-url="/guest/cover/elements/sticker">
              <svg class="diary-cover-tool-icon" viewBox="0 0 16 16" aria-hidden="true"
                   fill="none" stroke="currentColor" stroke-width="1.3"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.6 2.2H4.2A1.6 1.6 0 0 0 2.6 3.8v8.4a1.6 1.6 0 0 0 1.6 1.6h3.6" />
                <path d="M9.6 2.2 13.4 6v1.4H10a.4.4 0 0 1-.4-.4z" />
                <path d="M7.8 13.8 13.4 8.2" />
              </svg>
              <span>스티커</span>
            </button>

            <button type="button" class="diary-cover-tool" id="diary-label-button"
                    aria-haspopup="dialog" aria-expanded="false"
                    aria-controls="diary-label-popover">
              <svg class="diary-cover-tool-icon" viewBox="0 0 16 16" aria-hidden="true"
                   fill="none" stroke="currentColor" stroke-width="1.3"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M4.4 4.2h7.2" />
                <path d="M8 4.2v7.6" />
                <path d="M6.4 11.8h3.2" />
              </svg>
              <span>라벨기</span>
            </button>

            <!--
              사진. 회원 화면과 같이 붙을 모습마다 고르개를 따로 둔다.
              다른 점은 보내는 곳뿐이다 — 고른 파일을 IndexedDB 에 넣는다.
              (data-create-url 이 없어 회원 업로드 스크립트가 이 칸을 잡지 않는다)
            -->
            <label class="diary-cover-tool" th:each="style : ${coverPhotoStyles}">
              <input type="file" class="diary-cover-photo-input" accept="image/*" multiple
                     data-guest-photo-input
                     th:data-photo-style="${style.code}"
                     th:attr="aria-label=|${style.label} 사진 추가|" />
              <svg class="diary-cover-tool-icon" viewBox="0 0 16 16" aria-hidden="true"
                   fill="none" stroke="currentColor" stroke-width="1.3"
                   stroke-linecap="round" stroke-linejoin="round">
                <rect x="2.2" y="3.4" width="11.6" height="9.2" rx="1.4" />
                <circle cx="5.8" cy="6.6" r="1" />
                <path d="M2.6 11.2 6.2 8l2.4 2.2 2.2-1.8 2.6 2.4" />
              </svg>
              <span th:text="${style.label}">일반</span>
            </label>

            <!-- 스티커 고르는 판. 회원 표지 편집기와 같은 조각을 그대로 쓴다. -->
            <div th:replace="~{diary/cover-sticker-picker :: picker}"></div>

            <div class="diary-sticker-popover diary-label-popover" id="diary-label-popover"
                 role="dialog" aria-label="라벨기" hidden>
              <div th:replace="~{diary/label-maker :: picker(${diaryLabelFonts},
                                 '/guest/cover/elements/label')}"></div>
            </div>
          </div>
          <p class="diary-sticker-status" id="diary-sticker-status" role="status"></p>
        </section>
      </div>
    </div>
  </section>

  <!-- 사진을 눌렀을 때의 로그인 안내. 페이지 편집기와 같은 판을 쓴다. -->
  <div class="diary-guest-prompt" role="dialog" aria-modal="true"
       aria-labelledby="diary-guest-prompt-title" hidden data-guest-prompt>
    <div class="diary-guest-prompt-panel">
      <h2 id="diary-guest-prompt-title" data-guest-prompt-title>
        사진은 로그인 후 사용할 수 있어요
      </h2>
      <p data-guest-prompt-text>
        체험에서는 표지 재질·색과 스티커·글씨로 꾸며볼 수 있습니다.
      </p>
      <p class="diary-guest-prompt-note">
        작성 중인 체험 데이터는 이 브라우저에 임시로 보관됩니다.
      </p>
      <div class="diary-guest-prompt-actions">
        <button type="button" class="diary-text-action"
                data-guest-action="close-prompt">닫기</button>
        <a class="diary-text-action" th:href="@{/users/register}">회원가입</a>
        <a class="diary-text-action is-primary" th:href="@{/login}">로그인</a>
      </div>
    </div>
  </div>
</th:block>
</html>
