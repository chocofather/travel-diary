<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::body}, ~{::headFragment})}">

<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/diary.css">
  <!-- 표지에 붙인 글씨(라벨기)의 글꼴. 편집 화면과 같은 파일을 그대로 쓴다 -->
  <link rel="stylesheet" href="/css/diary-fonts.css">
  <!-- 마스킹테이프를 편집 화면과 같은 모습으로 그린다. (조작 스크립트는 싣지 않는다) -->
  <script src="/js/diary-tape-repeat.js" defer></script>
  <!-- 기존 여행일기 카드의 ⋯ 메뉴를 표지 디자인 카드에도 그대로 쓴다. -->
  <script src="/js/diary-book-menu.js" defer></script>
</th:block>

<th:block th:fragment="body">
  <section class="diary-list-page diary-cover-designs-page" aria-labelledby="cover-designs-title">
    <header class="diary-list-header">
      <div class="diary-list-heading">
        <a class="diary-detail-back" th:href="@{/diaries}">← 나의 여행일기로</a>
        <h1 id="cover-designs-title">내 표지 디자인</h1>
        <p class="diary-list-subtitle">직접 꾸민 표지를 저장해 두고 여행일기에 사용할 수 있어요.</p>
      </div>
      <div class="diary-list-tools">
        <a class="diary-cover-designs-button" th:href="@{/diaries/cover-library}">
          표지 라이브러리
        </a>
        <a class="diary-new-button" th:href="@{/diaries/cover-designs/new}"><span
                class="diary-new-button-plus" aria-hidden="true">+</span>새 디자인 만들기</a>
      </div>
    </header>

    <p class="diary-flash-message" th:if="${coverDesignMessage}" th:text="${coverDesignMessage}"
       role="status">새 표지 디자인이 만들어졌습니다.</p>
    <p class="diary-form-error" th:if="${coverDesignError}" th:text="${coverDesignError}"
       role="alert">표지 디자인을 공유할 수 없습니다.</p>

    <ul class="diary-cover-design-gallery" th:unless="${#lists.isEmpty(coverDesigns)}">
      <li class="diary-cover-design-card" th:each="design : ${coverDesigns}">
        <!-- 표지를 누르면 기존 편집 화면으로 바로 들어간다. -->
        <a class="diary-cover-design-link diary-cover-design-preview-link"
           th:href="@{/diaries/cover-designs/{id}/edit(id=${design.id})}"
           th:attr="aria-label=|${design.name} 디자인 편집|">
          <!-- 꾸민 그대로 줄여 보여 준다. 요소는 위에서 한 번에 읽어 둔 것을 나눠 쓴다. -->
          <div class="diary-cover-design-preview">
            <div th:replace="~{diary/cover-preview :: canvas(${design},
                               ${coverElementsByDesign.getOrDefault(design.id, #lists.toList({}))})}"></div>
          </div>
        </a>

        <!-- 삭제는 기존 카드 메뉴 패턴에 넣어, 표지와 공유 동작의 위계를 낮춘다. -->
        <div class="diary-book-menu">
          <button type="button" class="diary-book-menu-button"
                  aria-haspopup="menu" aria-expanded="false"
                  th:attr="aria-controls=|diary-cover-design-menu-${design.id}|,
                           aria-label=|${design.name} 디자인 관리 메뉴|">⋯</button>
          <div class="diary-book-menu-panel" role="menu"
               th:id="|diary-cover-design-menu-${design.id}|"
               th:attr="aria-label=|${design.name} 디자인 관리|" hidden>
            <form class="diary-cover-design-delete"
                  th:action="@{/diaries/cover-designs/{id}/delete(id=${design.id})}" method="post"
                  th:attr="onsubmit=|return confirm('${design.name} 디자인을 삭제할까요? 이미 여행일기에 적용한 표지는 그대로 남습니다.')|">
              <button type="submit" class="diary-book-menu-item is-danger" role="menuitem"
                      th:attr="aria-label=|${design.name} 디자인 삭제|">디자인 삭제</button>
            </form>
          </div>
        </div>

        <div class="diary-cover-design-card-body">
          <a class="diary-cover-design-title-link"
             th:href="@{/diaries/cover-designs/{id}/edit(id=${design.id})}">
            <h2 class="diary-cover-design-name" th:text="${design.name}">제주 여행</h2>
          </a>
          <p class="diary-cover-design-style"
             th:text="${design.baseCoverStyleLabel}">가죽 딥그린</p>
          <div class="diary-cover-design-actions">
          <a class="diary-cover-design-share"
             th:href="@{/diaries/cover-designs/{id}/library-share(id=${design.id})}"
             th:attr="aria-label=|${design.name} 디자인을 라이브러리에 공유|">라이브러리에 공유</a>
          </div>
        </div>
      </li>
    </ul>

    <div class="diary-empty diary-cover-design-gallery-empty" th:if="${#lists.isEmpty(coverDesigns)}" role="status">
      <span class="diary-empty-mark" aria-hidden="true">✎</span>
      <p class="diary-empty-title">아직 저장한 표지 디자인이 없습니다.</p>
      <p class="diary-empty-text">나만의 표지를 만들어 두면 여행일기를 만들 때 골라 쓸 수 있어요.</p>
      <a class="diary-new-button" th:href="@{/diaries/cover-designs/new}"><span
              class="diary-new-button-plus" aria-hidden="true">+</span>새 디자인 만들기</a>
    </div>
  </section>
</th:block>
</html>
