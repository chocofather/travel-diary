<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::body}, ~{::headFragment})}">

<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/diary.css">
  <!-- 내 디자인 미리보기에 붙은 글씨(라벨기)의 글꼴 -->
  <link rel="stylesheet" href="/css/diary-fonts.css">
  <!-- 작성 화면과 같은 대표 이미지 선택 UI 를 그대로 쓴다 -->
  <script src="/js/diary-cover-picker.js" defer></script>
  <!-- 표지 고르기(기본 / 내 디자인)도 작성 화면과 같은 스크립트를 함께 쓴다 -->
  <script src="/js/diary-cover-choice.js" defer></script>
  <script src="/js/diary-tape-repeat.js" defer></script>
</th:block>

<th:block th:fragment="body">
  <section class="diary-form-page" aria-labelledby="diary-form-title">
    <header class="diary-form-header">
      <a class="diary-detail-back" th:href="@{/diaries}">← 나의 여행일기로</a>
      <h1 id="diary-form-title">여행일기 수정</h1>
      <p class="diary-list-subtitle">제목과 여행 기간, 표지를 바꿀 수 있어요.</p>
    </header>

    <p class="diary-form-error" th:if="${diaryError}" th:text="${diaryError}" role="alert">
      입력값을 확인해 주세요.
    </p>

    <form class="diary-form" th:action="@{/diaries/{id}/update(id=${diaryId})}" method="post"
          enctype="multipart/form-data" th:object="${diaryForm}">
      <div class="diary-form-field">
        <label for="diary-title">제목</label>
        <input type="text" id="diary-title" name="title" th:value="*{title}"
               maxlength="150" required
               placeholder="여행일기 제목을 입력해 주세요." />
      </div>

      <!-- 연도 4자리(1000~9999)만 고르도록 min/max 를 두고, 서버에서도 같은 범위를 검증한다. -->
      <div class="diary-form-field">
        <span class="diary-form-label">여행 기간</span>
        <div class="diary-period-inputs">
          <div class="diary-period-item">
            <label for="diary-start-date">여행 시작일</label>
            <input type="date" id="diary-start-date" name="startDate"
                   th:value="*{startDate}" required
                   min="1000-01-01" max="9999-12-31" />
          </div>
          <span class="diary-period-separator" aria-hidden="true">~</span>
          <div class="diary-period-item">
            <label for="diary-end-date">여행 종료일</label>
            <input type="date" id="diary-end-date" name="endDate"
                   th:value="*{endDate}" required
                   min="1000-01-01" max="9999-12-31" />
          </div>
        </div>
      </div>

      <!-- 내 디자인을 쓰는 동안에는 이 자리를 접어 둔다. 표지에 들어갈 사진은 디자인이 들고 있다. -->
      <div class="diary-form-field" data-cover-image-field
           th:attr="hidden=${currentCover != null} ? true : null">
        <span class="diary-form-label">대표 이미지</span>
        <!-- 기본 파일 선택 버튼은 감추고 아래 picker 로 열되, 제출 시 함께 올라가는 구조는 그대로 둔다. -->
        <input type="file" id="diary-cover-image" name="coverImage" accept="image/*"
               class="diary-cover-input" />
        <!-- 작성 화면과 같은 picker. 지금 표지가 있으면 그 썸네일로 시작하고,
             새 파일을 고르면 JS 가 같은 자리에서 갈아 끼운다. -->
        <label class="diary-cover-picker" id="diary-cover-picker" for="diary-cover-image"
               th:classappend="${currentCoverImageUrl != null and !#strings.isEmpty(currentCoverImageUrl)}
                               ? ' has-image' : ''">
          <span class="diary-cover-thumb">
            <img class="diary-cover-thumb-image" id="diary-cover-preview-image"
                 th:src="${currentCoverImageUrl}" alt=""
                 th:attr="hidden=${currentCoverImageUrl != null and !#strings.isEmpty(currentCoverImageUrl)}
                          ? null : true" />
            <span class="diary-cover-thumb-mark" aria-hidden="true">▣</span>
          </span>
          <span class="diary-cover-name" id="diary-cover-name"
                th:text="${currentCoverImageUrl != null and !#strings.isEmpty(currentCoverImageUrl)}
                         ? '지금 표지를 사용 중' : '대표 이미지 선택'">지금 표지를 사용 중</span>
          <span class="diary-cover-action" id="diary-cover-action"
                th:text="${currentCoverImageUrl != null and !#strings.isEmpty(currentCoverImageUrl)}
                         ? '변경' : '선택'">변경</span>
        </label>
        <span class="diary-form-hint">새로 선택하지 않으면 지금 표지가 그대로 유지됩니다.</span>
      </div>

      <!--
        표지 고르기. 작성 화면과 같은 구조다.
        지금 커스텀 표지를 쓰고 있으면 '내 디자인' 쪽이 열린 채로 시작한다.

        어느 저장 디자인에서 왔는지는 남겨 두지 않으므로(적용할 때 값을 복사한 독립본이다)
        저장 디자인 하나를 골라 둔 것처럼 보이게 하지 않는다.
        그래서 디자인을 고르지 않고 저장하면 지금 표지가 그대로 남는다.
      -->
      <div class="diary-form-field diary-cover-choice" data-cover-choice>
        <span class="diary-form-label">표지</span>
        <input type="hidden" name="coverSelectionType"
               th:value="${currentCover != null} ? 'CUSTOM' : 'PRESET'" data-cover-selection />
        <input type="hidden" name="customCoverDesignId" value="" data-cover-design-id />

        <div class="diary-cover-tabs" role="tablist" aria-label="표지 종류">
          <button type="button" class="diary-cover-tab" role="tab"
                  th:classappend="${currentCover == null} ? 'is-active' : ''"
                  th:attr="aria-selected=${currentCover == null} ? 'true' : 'false'"
                  data-cover-tab="PRESET">기본 디자인</button>
          <button type="button" class="diary-cover-tab" role="tab"
                  th:classappend="${currentCover != null} ? 'is-active' : ''"
                  th:attr="aria-selected=${currentCover != null} ? 'true' : 'false'"
                  data-cover-tab="CUSTOM">내 디자인</button>
        </div>

        <!-- 기본 표지 8종. 예전 그대로다. -->
        <div data-cover-panel="PRESET" th:attr="hidden=${currentCover != null} ? true : null">
          <div th:replace="~{diary/cover-style :: picker(${coverStyles}, *{coverStyle})}"></div>
        </div>

        <div data-cover-panel="CUSTOM" th:attr="hidden=${currentCover == null} ? true : null">
          <div class="diary-cover-design-choices" th:unless="${#lists.isEmpty(coverDesigns)}"
               role="radiogroup" aria-label="내 표지 디자인">
            <label class="diary-cover-design-choice" th:each="design : ${coverDesigns}">
              <input type="radio" name="coverDesignChoice" class="diary-cover-option-input"
                     th:value="${design.id}" data-cover-design-option />
              <span class="diary-cover-design-choice-canvas">
                <span th:replace="~{diary/cover-preview :: canvas(${design},
                                    ${coverElementsByDesign.getOrDefault(design.id,
                                                                        #lists.toList({}))})}"></span>
              </span>
              <span class="diary-cover-design-choice-name" th:text="${design.name}">제주 여행</span>
            </label>
          </div>

          <p class="diary-cover-design-empty" th:if="${#lists.isEmpty(coverDesigns)}">
            아직 만든 표지 디자인이 없습니다.
            <a class="diary-cover-designs-link" th:href="@{/diaries/cover-designs}">내 표지 디자인 만들기</a>
          </p>
        </div>

        <span class="diary-form-hint" data-cover-custom-hint
              th:attr="hidden=${currentCover == null} ? true : null">
          내 디자인을 선택해 표지를 변경할 수 있어요. 선택하지 않으면 현재 표지가 유지됩니다.
        </span>
      </div>

      <!-- 노트 종류: 지금 쓰는 종류가 골라진 채로 열린다 -->
      <div class="diary-form-field"
           th:replace="~{diary/notebook-type :: picker(${notebookTypes}, *{notebookType})}"></div>

      <div class="diary-form-actions">
        <a class="diary-form-cancel" th:href="@{/diaries}">취소</a>
        <button type="submit" class="diary-form-submit">수정 완료</button>
      </div>
    </form>
  </section>
</th:block>
</html>
