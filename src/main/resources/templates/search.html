<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="ko"
      th:replace="layout/main :: layout(~{::body}, ~{::headFragment})">

<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/search.css" />
</th:block>

<th:block th:fragment="body">
  <section class="global-search-page" aria-labelledby="global-search-title">
    <form class="global-search-form" action="/search" method="get" role="search">
      <label class="sr-only" for="global-search-input">통합검색</label>
      <input id="global-search-input" type="search" name="q"
             th:value="${searchPage.query}" placeholder="검색어를 입력해 주세요"
             autocomplete="off" />
      <input type="hidden" name="type" th:value="${searchPage.type}" />
      <button type="submit" aria-label="검색 실행">
        <img src="/images/magnify.svg" alt="" aria-hidden="true" />
      </button>
    </form>

    <header class="global-search-header">
      <h1 id="global-search-title" th:if="${searchPage.hasQuery()}">
        <span th:text="|‘${searchPage.query}’|">‘제주’</span> 검색 결과
      </h1>
      <h1 id="global-search-title" th:unless="${searchPage.hasQuery()}">통합검색</h1>
      <p th:if="${searchPage.hasQuery()}"
         th:text="|총 ${searchPage.totalCount}개의 결과를 찾았습니다.|">총 0개의 결과를 찾았습니다.</p>
      <p th:unless="${searchPage.hasQuery()}">여행지와 여행 콘텐츠를 한 번에 찾아보세요.</p>
    </header>

    <nav class="global-search-filters" aria-label="검색 결과 유형"
         th:if="${searchPage.hasQuery()}">
      <a th:each="filter : ${searchTypes}"
         th:href="@{/search(q=${searchPage.query},type=${filter.queryValue},page=1)}"
         th:text="${filter.label}"
         th:classappend="${searchPage.type == filter.queryValue} ? ' is-active'"
         th:attr="aria-current=${searchPage.type == filter.queryValue} ? 'page' : null">전체</a>
    </nav>

    <div class="global-search-empty" th:unless="${searchPage.hasQuery()}">
      <p>검색어를 입력하면 관련 콘텐츠를 확인할 수 있습니다.</p>
    </div>

    <div class="global-search-empty"
         th:if="${searchPage.hasQuery() and searchPage.totalCount == 0}">
      <strong>검색 결과가 없습니다.</strong>
      <p>검색어를 줄이거나 다른 단어로 검색해 보세요.</p>
    </div>

    <div class="global-search-results" th:if="${searchPage.totalCount > 0}">
      <article th:each="result : ${searchPage.results}" class="global-search-result">
        <a th:href="${result.detailUrl}">
          <img class="global-search-thumbnail"
               th:if="${(result.type == 'destination' or result.type == 'event') and result.thumbnailUrl != null and !result.thumbnailUrl.isBlank()}"
               th:src="${result.thumbnailUrl}" th:alt="${result.title}"
               loading="lazy" onerror="this.remove()" />
          <div class="global-search-result-content">
            <div class="global-search-result-heading">
              <span class="global-search-type" th:text="${result.typeLabel}">여행지</span>
              <time th:if="${result.type != 'event' and result.createdAt != null}"
                    th:datetime="${#dates.format(result.createdAt, 'yyyy-MM-dd')}"
                    th:text="${#dates.format(result.createdAt, 'yyyy.MM.dd')}">2026.08.14</time>
            </div>
            <h2 th:text="${result.title}">검색 결과 제목</h2>
            <p class="global-search-event-period" th:if="${result.type == 'event'}"
               th:text="|${result.startDate} ~ ${result.endDate}|">2026-08-01 ~ 2026-08-31</p>
            <p class="global-search-summary" th:text="${result.summary}">검색 결과 요약</p>
          </div>
        </a>
      </article>
    </div>

    <nav class="global-search-pagination" aria-label="검색 결과 페이지"
         th:if="${searchPage.totalPages > 1}">
      <a th:if="${searchPage.currentPage > 1}"
         th:href="@{/search(q=${searchPage.query},type=${searchPage.type},page=${searchPage.currentPage - 1})}"
         aria-label="이전 페이지">이전</a>
      <a th:each="pageNumber : ${#numbers.sequence(searchPage.pageStart, searchPage.pageEnd)}"
         th:href="@{/search(q=${searchPage.query},type=${searchPage.type},page=${pageNumber})}"
         th:text="${pageNumber}"
         th:classappend="${pageNumber == searchPage.currentPage} ? ' is-active'"
         th:attr="aria-current=${pageNumber == searchPage.currentPage} ? 'page' : null">1</a>
      <a th:if="${searchPage.currentPage < searchPage.totalPages}"
         th:href="@{/search(q=${searchPage.query},type=${searchPage.type},page=${searchPage.currentPage + 1})}"
         aria-label="다음 페이지">다음</a>
    </nav>
  </section>
</th:block>
</html>
