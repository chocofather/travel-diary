<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="ko"
      th:replace="layout/main :: layout(~{::body}, ~{::headFragment})">

<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/search.css" />
</th:block>

<th:block th:fragment="body">

  <section class="search-result-section">
    <div class="search-header">
      <h2 class="search-title">
        "<span id="search-keyword"></span>" <span class="search-main-label">검색 결과</span>
      </h2>
      <p class="search-count">
        <span id="search-count">0</span>개의 여행지/지역이 검색되었습니다.
      </p>
    </div>

    <!-- 여행지 리스트 영역 -->
    <div class="search-block" id="search-destination-block">
      <div class="search-block-title">
        <span>여행지</span>
      </div>
      <div class="search-list" id="search-list">
        <!-- JS로 여행지 카드(1줄씩) 삽입 -->
      </div>
    </div>

    <!-- 회원(추후 확장용) -->
    <div class="search-block" id="search-member-block" style="display:none;">
      <div class="search-block-title">
        <span>회원</span>
      </div>
      <div class="search-list" id="member-search-list"></div>
    </div>

  </section>

  <script src="/js/search.js" defer></script>
</th:block>
</html>
