<!-- templates/fragments/footer.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
</head>
<body>
<footer th:fragment="siteFooter" th:with="currentYear=${#dates.format(#dates.createNow(), 'yyyy')}">
  <div class="site-footer">
    <div class="footer-inner">
      <div class="footer-main">
        <div class="footer-brand">
          <a class="footer-logo" href="/">TripBora</a>
          <p class="footer-description" th:text="#{footer.description}">
            여행을 보라, 추억을 남겨라
          </p>
        </div>

        <nav class="footer-nav" th:aria-label="#{footer.navigation}">
          <h2 class="footer-column-title" th:text="#{footer.information}">주요 정보</h2>
          <ul class="footer-links">
            <li><a href="/about" th:text="#{footer.about}">TripBora(트립보라) 소개</a></li>
            <li><a href="/terms" th:text="#{footer.terms}">이용약관</a></li>
            <li><a href="/privacy" th:text="#{footer.privacy}">개인정보처리방침</a></li>
          </ul>
        </nav>

        <section class="footer-contact" th:aria-label="#{footer.contact}">
          <h2 class="footer-column-title" th:text="#{footer.contact}">문의</h2>
          <ul class="footer-links">
            <li><a href="/support/notices" th:text="#{footer.support}">고객센터</a></li>
            <li><a href="/support/inquiries" th:text="#{nav.support.inquiry}">1:1 문의</a></li>
          </ul>
        </section>
      </div>

      <div class="footer-info">
        <p class="footer-operations"
           th:if="${(footerOperatorName != null and !#strings.isEmpty(footerOperatorName))
                    or (footerContactEmail != null and !#strings.isEmpty(footerContactEmail))}">
          <span class="footer-operation"
                th:if="${footerOperatorName != null and !#strings.isEmpty(footerOperatorName)}">
            <span class="footer-operator-label" th:text="#{footer.operator}">운영자</span><span>:</span>
            <span class="footer-operator-name" th:text="${footerOperatorName}"></span>
          </span>
          <span class="footer-operation"
                th:classappend="${footerOperatorName != null and !#strings.isEmpty(footerOperatorName)}
                                ? ' footer-operation--separated'"
                th:if="${footerContactEmail != null and !#strings.isEmpty(footerContactEmail)}">
            <span class="footer-contact-label" th:text="#{footer.contact}">문의</span><span>:</span>
            <a class="footer-contact-email"
               th:href="|mailto:${footerContactEmail}|"
               th:text="${footerContactEmail}"></a>
          </span>
        </p>
        <p class="footer-copyright" th:text="#{footer.copyright(${currentYear})}">
          © Tripbora. 모든 권리 보유.
        </p>
      </div>
    </div>
  </div>
</footer>
</body>
</html>
