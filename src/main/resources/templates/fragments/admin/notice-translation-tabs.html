<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  공지사항 제목·본문의 번역 입력. 등록/수정 화면이 같은 조각을 쓴다.
  탭 동작은 공통 스크립트(/js/admin-translation-tabs.js), 언어별 본문 편집기는
  /js/admin-translation-editors.js, 접기는 /js/admin-translation-collapse.js 가 맡는다.

  0번 슬롯(한국어)은 위쪽 원본 입력이 담당하므로 여기서는 건너뛴다.
  숨긴 언어의 입력값도 폼에는 그대로 실려 저장된다. (hidden 만 걸고 지우지 않는다)
  본문 편집기는 languageCode 로 hidden input 과 묶으므로 자리 번호에 뜻을 두지 않는다.
-->
<th:block th:fragment="noticeTranslations">
  <div class="admin-translation-tabs" data-translation-tabs>
    <div class="admin-translation-tabs-heading is-plain" data-translation-tabs-heading>
      <p class="admin-help-text">
        비워 둔 언어는 공개 화면에서 한국어로 대신 보여집니다. 제목만, 본문만 입력해도 됩니다.
      </p>
    </div>

    <div class="admin-translation-tabs-body" data-translation-tabs-body>
      <div class="admin-translation-tablist" role="tablist" aria-label="번역 언어 선택">
        <th:block th:each="translation, slot : *{translations}">
          <button type="button" role="tab" class="admin-translation-tab"
                  th:unless="${slot.first}"
                  th:classappend="${slot.index == 1} ? ' is-active'"
                  th:attr="data-translation-tab=${translation.languageCode},
                           aria-selected=${slot.index == 1},
                           title=${translationLanguageLabels.get(translation.languageCode)}"
                  th:text="${translationTabLabels.get(translation.languageCode)}
                           ?: translation.languageCode">영어</button>
        </th:block>
      </div>

      <th:block th:each="translation, slot : *{translations}">
        <div class="admin-translation-panel" role="tabpanel"
             th:unless="${slot.first}"
             th:hidden="${slot.index > 1}"
             th:attr="data-translation-panel=${translation.languageCode},
                      aria-label=${translationLanguageLabels.get(translation.languageCode)}">
          <input type="hidden" th:field="*{translations[__${slot.index}__].languageCode}">

          <div class="admin-form-field">
            <label th:for="${'notice-translation-title-' + translation.languageCode}">제목</label>
            <input type="text" maxlength="255"
                   th:id="${'notice-translation-title-' + translation.languageCode}"
                   th:field="*{translations[__${slot.index}__].title}"
                   th:attr="data-translation-title=${translation.languageCode}">
          </div>

          <div class="admin-form-field">
            <label>본문</label>
            <div class="admin-notice-editor-shell quill-editor-shell">
              <div class="admin-notice-translation-editor quill-editor"
                   th:attr="data-translation-editor=${translation.languageCode}"></div>
            </div>
            <input type="hidden" th:field="*{translations[__${slot.index}__].content}"
                   th:attr="data-translation-content=${translation.languageCode}">
            <textarea hidden th:text="*{translations[__${slot.index}__].content}"
                      th:attr="data-translation-initial-content=${translation.languageCode}"></textarea>
          </div>
        </div>
      </th:block>
    </div>
  </div>
</th:block>

</body>
</html>
