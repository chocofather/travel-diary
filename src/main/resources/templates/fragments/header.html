<!-- templates/fragments/header.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
</head>
<body>
<header th:fragment="siteHeader">
  <nav class="main-nav">
    <!-- 로고 -->
    <h1 class="logo">
      <a href="/"><img src="/images/logo7.png" alt="여행일기 로고" /></a>
    </h1>

    <!-- 검색 + 로그인/프로필 -->
    <div class="search-box">
      <!-- 검색 버튼 -->
      <button type="button" id="search-toggle" aria-label="검색 열기"
              aria-controls="search-form" aria-expanded="false">
        <img src="/images/magnify.svg" alt="" aria-hidden="true" />
      </button>

      <!-- 숨겨진 검색창 -->
      <form id="search-form" class="hidden" action="/search" method="get" role="search">
        <label class="sr-only" for="header-search-input">통합검색</label>
        <input id="header-search-input" type="search" name="q"
               placeholder="어디로 떠나 볼까요?" autocomplete="off"
               th:value="${param.q != null ? param.q[0] : ''}" />
        <button class="search-submit" type="submit" aria-label="검색 실행">
          <img src="/images/magnify.svg" alt="" aria-hidden="true" />
        </button>
      </form>

      <!-- 로그인 / 프로필 -->
      <div id="auth-area">
        <button th:if="${!isLoggedIn}" id="login-btn"
                onclick="location.href='/login?redirect=' + encodeURIComponent(location.pathname + location.search)">
          로그인
        </button>
        <div th:if="${isLoggedIn}" class="profile-menu-container">
          <button type="button" id="profile-menu-toggle" class="profile-menu-toggle"
                  aria-label="프로필 메뉴 열기" aria-haspopup="menu"
                  aria-controls="profile-menu" aria-expanded="false">
            <img id="profile-img"
                 th:src="${currentUserProfileImage}"
                 onerror="this.onerror=null;this.src='/images/default.png';"
                 alt="" />
          </button>

          <div id="profile-menu" class="profile-menu" role="menu" hidden>
            <p class="profile-menu-title">프로필</p>
            <a href="/mypage" class="profile-menu-item" role="menuitem">마이페이지</a>
            <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
               href="/admin" class="profile-menu-item profile-menu-admin"
               role="menuitem">관리자 페이지</a>
            <form th:action="@{/logout}" method="post" class="profile-menu-logout-form">
              <input type="hidden" name="redirect" th:value="${currentUri}">
              <button type="submit" class="profile-menu-item profile-menu-logout"
                      role="menuitem">로그아웃</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- 메뉴 -->
    <div class="nav-grid">
      <ul class="main-menu">
        <li class="menu-item"><a href="/destinations?type=domestic">국내</a></li>
        <li class="menu-item"><a href="/destinations?type=overseas">해외</a></li>
        <li class="menu-item"><a href="/board/list">여행 커뮤니티</a></li>
        <li class="menu-item"><a href="/travel-info">여행정보</a></li>
        <li class="menu-item"><a href="/random-travel">여행기록</a></li>
        <li class="menu-item"><a href="/support/notices">고객센터</a></li>
        <li class="menu-item"><a th:href="@{/events}">이벤트</a></li>
      </ul>
    </div>

    <!-- 서브메뉴 -->
    <div class="global-submenu">
      <div class="submenu-grid">
        <div class="submenu-col" aria-hidden="true"></div>
        <div class="submenu-col" aria-hidden="true"></div>
        <div class="submenu-col">
          <ul>
            <li><a href="/board/list?boardType=post&postType=question">여행 질문</a></li>
            <li><a href="/board/list?boardType=post&postType=tip">여행 팁</a></li>
            <li><a href="/board/list?boardType=course">나의 여행코스</a></li>
          </ul>
        </div>
        <div class="submenu-col">
          <ul>
            <li><a href="/travel-info">전체</a></li>
            <li><a href="/travel-info?scope=DOMESTIC">국내정보</a></li>
            <li><a href="/travel-info?scope=INTERNATIONAL">해외정보</a></li>
            <li><a href="/travel-info?contentType=FESTIVAL">축제 정보</a></li>
          </ul>
        </div>
        <div class="submenu-col">
          <ul>
            <li><a href="/random-travel">랜덤 여행</a></li>
          </ul>
        </div>
        <div class="submenu-col">
          <ul>
            <li><a href="/support/notices">공지사항</a></li>
            <li><a href="/support/faq">자주 묻는 질문</a></li>
            <li><a href="/support/inquiries">1:1 문의</a></li>
          </ul>
        </div>
        <div class="submenu-col">
          <ul>
            <li class="menu-item"><a th:href="@{/events(status='ongoing')}">진행 이벤트</a></li>
            <li class="menu-item"><a th:href="@{/events(status='upcoming')}">예정 이벤트</a></li>
            <li class="menu-item"><a th:href="@{/events(status='ended')}">종료된 이벤트</a></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>
</header>
</body>
</html>
