<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  사이트 헤더와 헤더가 없는 인증 화면(로그인)이 함께 쓰는 언어 선택 메뉴.
  선택 언어는 POST /locale 이 기존 TRAVEL_DIARY_LOCALE 쿠키에 저장하고,
  returnTo 로 현재 URL(쿼리 포함)을 넘겨 redirect 같은 파라미터를 잃지 않고 되돌아온다.
  여는/닫는 동작은 native details/summary 가 담당한다.
-->
<details class="language-menu" th:fragment="languageMenu">
  <summary class="language-menu-toggle"
           th:aria-label="#{header.language.selector}"
           th:title="#{header.language.current(${currentLanguage.displayName})}">
    <svg class="language-menu-icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M3 12h18M12 3c2.3 2.5 3.5 5.5 3.5 9S14.3 18.5 12 21M12 3C9.7 5.5 8.5 8.5 8.5 12S9.7 18.5 12 21"></path>
    </svg>
    <span class="language-menu-current" th:text="${currentLanguage.displayName}">한국어</span>
    <span class="language-menu-chevron" aria-hidden="true"></span>
  </summary>

  <div class="language-menu-popover" role="menu">
    <form class="locale-option-form" method="post" th:action="@{/locale}"
          th:each="language : ${supportedLanguages}">
      <input type="hidden" name="languageTag" th:value="${language.languageTag}" />
      <input type="hidden" name="returnTo" th:value="${currentUri}" />
      <button type="submit" class="language-menu-option" role="menuitem"
              th:classappend="${language == currentLanguage} ? ' is-active'"
              th:aria-current="${language == currentLanguage} ? 'true' : null"
              th:aria-label="#{header.language.change(${language.displayName})}">
        <span th:text="${language.displayName}">한국어</span>
        <span class="language-menu-check" th:if="${language == currentLanguage}"
              aria-hidden="true">✓</span>
      </button>
    </form>
  </div>
</details>
</body>
</html>
