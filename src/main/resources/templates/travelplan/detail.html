<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::body}, ~{::headFragment})}">

<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/travel-plan.css">
  <script src="/js/travel-plan-scheduler.js" defer></script>
  <!-- 접속 표시. STOMP 클라이언트는 CDN 이 아니라 WebJar 로 함께 배포한다 -->
  <script src="/webjars/stomp__stompjs/7.0.0/bundles/stomp.umd.min.js" defer></script>
  <script src="/js/travel-plan-realtime.js" defer></script>
</th:block>

<th:block th:fragment="body">
  <!-- 바깥은 연한 바탕, 그 위에 플래너 종이 한 장이 놓인 구조 -->
  <div class="travel-plan-page">
    <div class="travel-plan-page-top">
      <div class="travel-plan-page-top-row">
        <a class="travel-plan-back-link" th:href="@{/travel-plans}">← 함께 계획하기</a>

        <div class="travel-plan-top-actions">
        <!--
          참여자 목록은 방의 ACTIVE 멤버라면 누구나 본다. 이번 단계는 조회 전용이다.
        -->
        <div class="travel-plan-members" data-travel-plan-members>
          <button type="button" class="travel-plan-members-toggle"
                  aria-haspopup="true" aria-expanded="false"
                  data-travel-plan-members-toggle
                  th:text="'참여자 ' + ${travelPlan.memberCount} + '/'
                           + ${travelPlan.memberLimit}">참여자 3/8</button>

          <div class="travel-plan-members-panel" hidden data-travel-plan-members-panel
               th:with="viewerIsOwner=${travelPlan.currentMember != null
                        and travelPlan.currentMember.role != null
                        and travelPlan.currentMember.role.name() == 'OWNER'}">
            <p class="travel-plan-members-heading">함께 계획하는 사람들</p>
            <ul class="travel-plan-members-list">
              <!--
                data-member-id 는 방 안에서만 뜻이 있는 값이라 화면에 두어도 된다.
                접속 표시는 이 값만 주고받고 계정 정보는 오가지 않는다.
              -->
              <li class="travel-plan-member" th:each="member : ${travelPlan.members}"
                  th:attr="data-member-id=${member.memberId}"
                  data-travel-plan-member-row>
                <span class="travel-plan-member-name">
                  <!-- 연결되기 전에는 아무도 온라인으로 두지 않는다 -->
                  <span class="travel-plan-presence-dot" aria-label="오프라인" title="오프라인"
                        data-travel-plan-presence-dot></span>
                  <span th:text="${member.displayName}">민준</span>
                  <span class="travel-plan-member-me" th:if="${member.currentUser}">(나)</span>
                </span>
                <span class="travel-plan-member-role"
                      th:classappend="${member.role.name() == 'OWNER'} ? 'is-owner'"
                      th:text="${member.role.name() == 'OWNER'} ? '방장' : '멤버'">방장</span>

                <!--
                  관리 진입점은 OWNER 에게만, 그리고 MEMBER 줄에만 붙는다.
                  OWNER 자신의 줄은 role 이 OWNER 라 여기서 걸러진다.
                -->
                <span class="travel-plan-member-menu"
                      th:if="${viewerIsOwner and member.role.name() == 'MEMBER'}"
                      data-travel-plan-member-menu>
                  <button type="button" class="travel-plan-member-menu-button"
                          aria-haspopup="true" aria-expanded="false"
                          aria-label="참여자 메뉴" data-travel-plan-member-menu-button>⋯</button>
                  <span class="travel-plan-member-menu-list" hidden
                        data-travel-plan-member-menu-list>
                    <form method="post"
                          th:action="@{|/travel-plans/${travelPlan.plan.id}/members/${member.memberId}/transfer-owner|}">
                      <button type="submit" class="travel-plan-member-action"
                              th:attr="onclick=|return confirm('${member.displayName}님에게 방장을 넘길까요?\n\n방장을 넘기면 ${member.displayName}님이 초대와 멤버 관리 권한을 갖게 됩니다.\n나는 일반 멤버가 됩니다.')|">
                        방장 넘기기
                      </button>
                    </form>
                    <form method="post"
                          th:action="@{|/travel-plans/${travelPlan.plan.id}/members/${member.memberId}/remove|}">
                      <button type="submit" class="travel-plan-member-remove"
                              th:attr="onclick=|return confirm('${member.displayName}님을 이 여행에서 내보낼까요?\n\n내보낸 뒤에는 현재 초대 링크만으로 다시 참여할 수 없습니다.')|">
                        내보내기
                      </button>
                    </form>
                  </span>
                </span>
              </li>
            </ul>
            <!-- 참여자 총원. 접속 중 인원과는 다른 숫자다 -->
            <p class="travel-plan-members-count"
               th:text="${travelPlan.memberCount} + ' / ' + ${travelPlan.memberLimit}
                        + '명 참여 중'">3 / 8명 참여 중</p>
            <!-- 접속 현황은 연결된 뒤에만 채워진다 -->
            <p class="travel-plan-online-count" hidden
               data-travel-plan-online-count>0명 접속 중</p>

            <!--
              이전 참여자. OWNER 에게만, 그것도 내보낸 사람이 있을 때만 나온다.
              허용은 rejoin_allowed 만 올릴 뿐 바로 복귀시키지 않는다.
            -->
            <div class="travel-plan-past-members"
                 th:if="${viewerIsOwner and !#lists.isEmpty(travelPlan.pastMembers)}">
              <p class="travel-plan-members-heading">이전 참여자</p>
              <ul class="travel-plan-members-list">
                <li class="travel-plan-member"
                    th:each="past : ${travelPlan.pastMembers}">
                  <span class="travel-plan-member-name" th:text="${past.displayName}">테스트3</span>

                  <!-- 이미 받아 준 사람에게는 버튼을 또 보여 주지 않는다 -->
                  <span class="travel-plan-member-role" th:if="${past.rejoinAllowed}">
                    재참여 허용됨
                  </span>

                  <span class="travel-plan-past-member-actions" th:unless="${past.rejoinAllowed}">
                    <span class="travel-plan-member-role">내보낸 멤버</span>
                    <form method="post"
                          th:action="@{|/travel-plans/${travelPlan.plan.id}/members/${past.memberId}/allow-rejoin|}">
                      <button type="submit" class="travel-plan-member-action"
                              th:attr="onclick=|return confirm('${past.displayName}님이 다시 초대 링크로 참여할 수 있게 할까요?\n\n참여자로 바로 복귀하는 것은 아니며, 본인이 초대 링크를 통해 다시 참여해야 합니다.')|">
                        다시 참여 허용
                      </button>
                    </form>
                  </span>
                </li>
              </ul>
            </div>

            <!-- 나가기는 MEMBER 본인에게만 보인다. 방장은 먼저 방장을 넘겨야 한다 -->
            <form class="travel-plan-member-leave-form" method="post"
                  th:unless="${viewerIsOwner}"
                  th:action="@{|/travel-plans/${travelPlan.plan.id}/members/leave|}">
              <button type="submit" class="travel-plan-member-leave"
                      onclick="return confirm('이 여행 계획에서 나갈까요?\n\n작성했던 일정은 여행 계획에 그대로 남습니다.')">
                여행에서 나가기
              </button>
            </form>
          </div>
        </div>

        <!--
          초대는 OWNER 에게만 보이는 상단 보조 액션이다.
          살아 있는 링크는 저장된 암호문을 풀어 언제든 다시 보여 준다.
        -->
        <div class="travel-plan-invite" th:if="${travelPlan.currentMember != null
                    and travelPlan.currentMember.role != null
                    and travelPlan.currentMember.role.name() == 'OWNER'}"
             data-travel-plan-invite>
          <button type="button" class="travel-plan-invite-toggle"
                  aria-haspopup="true" aria-expanded="false"
                  data-travel-plan-invite-toggle>초대</button>

          <div class="travel-plan-invite-panel" hidden data-travel-plan-invite-panel>
            <!--
              지금 살아 있는 링크. 새로고침해도 같은 주소가 다시 나온다.
              방금 만든 경우에만 표시를 하나 더 달아 패널이 저절로 열리게 한다.
            -->
            <div class="travel-plan-invite-issued" th:if="${travelPlanInviteUrl}"
                 th:attr="data-travel-plan-invite-issued=${travelPlanInviteIssued} ? '' : null">
              <p class="travel-plan-invite-issued-label">초대 링크</p>
              <div class="travel-plan-invite-copy-row">
                <input type="text" class="travel-plan-invite-url" readonly
                       th:value="${travelPlanInviteUrl}"
                       aria-label="초대 링크" data-travel-plan-invite-url>
                <button type="button" class="travel-plan-invite-copy"
                        data-travel-plan-invite-copy>복사</button>
              </div>
            </div>

            <!-- 링크가 켜져 있을 때: 재발급 / 끄기 -->
            <div th:if="${travelPlanInviteActive}">
              <!-- 예전 방식으로 만들어져 주소를 되살릴 수 없는 링크 -->
              <p class="travel-plan-invite-state" th:unless="${travelPlanInviteUrl}">
                현재 초대 링크는 이전 저장 방식으로 만들어져 주소를 다시 표시할 수 없습니다.
                새 링크를 한 번 재발급하면 이후부터는 언제든 다시 복사할 수 있습니다.
              </p>
              <form method="post"
                    th:action="@{|/travel-plans/${travelPlan.plan.id}/invitations/regenerate|}">
                <button type="submit" class="travel-plan-invite-action"
                        onclick="return confirm('새 링크를 발급하면 기존 초대 링크는 더 이상 사용할 수 없습니다.')">
                  새 링크 재발급
                </button>
              </form>
              <form method="post"
                    th:action="@{|/travel-plans/${travelPlan.plan.id}/invitations/disable|}">
                <button type="submit" class="travel-plan-invite-off"
                        onclick="return confirm('초대 링크를 끌까요?')">초대 링크 비활성화</button>
              </form>
            </div>

            <!-- 링크가 없을 때: 첫 발급만 -->
            <div th:unless="${travelPlanInviteActive}">
              <p class="travel-plan-invite-state">아직 초대 링크가 없어요.</p>
              <form method="post"
                    th:action="@{|/travel-plans/${travelPlan.plan.id}/invitations|}">
                <button type="submit" class="travel-plan-invite-action">초대 링크 만들기</button>
              </form>
            </div>
          </div>
        </div>
        </div>
      </div>

      <p class="travel-plan-notice" th:if="${travelPlanMessage}"
         th:text="${travelPlanMessage}" role="status">공동 여행계획이 만들어졌어요.</p>
      <p class="travel-plan-alert" th:if="${travelPlanError}"
         th:text="${travelPlanError}" role="alert">
        다른 변경이 먼저 반영되었습니다. 새로고침 후 다시 시도해 주세요.
      </p>
    </div>

    <!--
      PC 메인 협업 스케줄러.
      줄은 실제 저장된 travel_plan_items 만큼만 생기고, DAY 끝의 추가 슬롯 하나만 화면용이다.
      data-plan-id / data-day-id / data-slot-index / data-item-id 는
      이후 실시간 편집(draft, lock, "OO님이 입력 중")이 위치를 집어낼 때 쓴다.
    -->
    <article class="travel-plan-paper" aria-labelledby="travel-plan-detail-title"
             th:attr="data-plan-id=${travelPlan.plan.id}">

      <header class="travel-plan-detail-header">
        <h1 id="travel-plan-detail-title" th:text="${travelPlan.plan.title}">제주도 여행</h1>
        <p class="travel-plan-detail-period"
           th:text="${#temporals.format(travelPlan.plan.startDate, 'yyyy.MM.dd')} + ' ~ '
                    + ${#temporals.format(travelPlan.plan.endDate, 'yyyy.MM.dd')}">
          2026.09.13 ~ 2026.09.15
        </p>
      </header>

      <!--
        DAY 한 구역의 markup 은 fragment 하나로 모아 두었다.
        실시간 갱신도 같은 fragment 를 다시 그려 보내므로 화면이 갈라지지 않는다.
      -->
      <div class="travel-plan-days" data-travel-plan-days>
        <th:block th:each="day : ${travelPlan.days}">
          <th:block th:replace="~{travelplan/fragments/schedule-day :: scheduleDay(
                      ${travelPlan.plan},
                      ${travelPlan.days},
                      ${day},
                      ${travelPlan.itemsByDayId.get(day.id)},
                      ${travelPlan.alternativesByItemId},
                      ${openDayId != null and openDayId == day.id})}"></th:block>
        </th:block>
      </div>

    </article>
  </div>
</th:block>
</html>
