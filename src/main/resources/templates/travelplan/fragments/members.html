<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  참여자 팝오버의 속.

  처음 그릴 때와 실시간 갱신이 같은 조각을 쓴다. 그래야 화면이 갈라지지 않는다.
  팝오버 껍데기(토글 버튼과 패널)는 여기 없다. 그 둘은 화면에 그대로 두고
  속만 갈아 끼워야 열려 있던 팝오버가 닫히지 않는다.

  "참여자 N/8" 토글 글자도 여기서 만들어 data-members-label 로 실어 보낸다.
  화면이 숫자를 더하거나 빼지 않고 서버가 센 값을 그대로 쓰기 위한 것이다.
-->
<th:block th:fragment="membersBody(planId, currentMember, members, pastMembers,
                                   memberCount, memberLimit)"
          th:with="viewerIsOwner=${currentMember != null
                   and currentMember.role != null
                   and currentMember.role.name() == 'OWNER'}">
  <p class="travel-plan-members-heading">함께 계획하는 사람들</p>
  <ul class="travel-plan-members-list">
    <!--
      data-member-id 는 방 안에서만 뜻이 있는 값이라 화면에 두어도 된다.
      접속 표시는 이 값만 주고받고 계정 정보는 오가지 않는다.
    -->
    <li class="travel-plan-member" th:each="member : ${members}"
        th:attr="data-member-id=${member.memberId}"
        data-travel-plan-member-row>
      <span class="travel-plan-member-name">
        <!-- 연결되기 전에는 아무도 온라인으로 두지 않는다 -->
        <span class="travel-plan-presence-dot" aria-label="오프라인" title="오프라인"
              data-travel-plan-presence-dot></span>
        <span th:text="${member.displayName}">민준</span>
        <!-- 이름에 괄호로 붙이지 않고 작은 글자 하나로 떼어 둔다 -->
        <span class="travel-plan-member-me" th:if="${member.currentUser}">나</span>
      </span>
      <!--
        방장일 때만 적는다.
        나머지가 모두 멤버라는 것은 굳이 줄마다 되풀이할 말이 아니다.
      -->
      <span class="travel-plan-member-role is-owner"
            th:if="${member.role.name() == 'OWNER'}">방장</span>

      <!--
        관리 진입점은 OWNER 에게만, 그리고 MEMBER 줄에만 붙는다.
        OWNER 자신의 줄은 role 이 OWNER 라 여기서 걸러진다.
      -->
      <span class="travel-plan-member-menu"
            th:if="${viewerIsOwner and member.role.name() == 'MEMBER'}"
            data-travel-plan-member-menu>
        <button type="button" class="travel-plan-member-menu-button"
                aria-haspopup="true" aria-expanded="false"
                aria-label="참여자 메뉴" data-travel-plan-member-menu-button>⋯</button>
        <span class="travel-plan-member-menu-list" hidden
              data-travel-plan-member-menu-list>
          <form method="post"
                th:action="@{|/travel-plans/${planId}/members/${member.memberId}/transfer-owner|}">
            <button type="submit" class="travel-plan-member-action"
                    th:attr="onclick=|return confirm('${member.displayName}님에게 방장을 넘길까요?\n\n방장을 넘기면 ${member.displayName}님이 초대와 멤버 관리 권한을 갖게 됩니다.\n나는 일반 멤버가 됩니다.')|">
              방장 넘기기
            </button>
          </form>
          <form method="post"
                th:action="@{|/travel-plans/${planId}/members/${member.memberId}/remove|}">
            <button type="submit" class="travel-plan-member-remove"
                    th:attr="onclick=|return confirm('${member.displayName}님을 이 여행에서 내보낼까요?\n\n내보낸 뒤에는 현재 초대 링크만으로 다시 참여할 수 없습니다.')|">
              내보내기
            </button>
          </form>
        </span>
      </span>
    </li>
  </ul>
  <!--
    참여자 총원과 접속 인원을 한 줄에 둔다. 서로 다른 숫자라 가운뎃점으로 나눈다.
    접속 현황은 연결된 뒤에만 채워지므로, 그 전에는 앞쪽 한 조각만 보인다.
  -->
  <p class="travel-plan-members-count"
     th:attr="data-members-label=|참여자 ${memberCount}/${memberLimit}|">
    <span th:text="${memberCount} + '/' + ${memberLimit} + '명 참여'">3/8명 참여</span>
    <span class="travel-plan-online-count" hidden
          data-travel-plan-online-count>0명 접속 중</span>
  </p>

  <!--
    이전 참여자. OWNER 에게만, 그것도 내보낸 사람이 있을 때만 나온다.
    허용은 rejoin_allowed 만 올릴 뿐 바로 복귀시키지 않는다.
  -->
  <div class="travel-plan-past-members"
       th:if="${viewerIsOwner and !#lists.isEmpty(pastMembers)}">
    <p class="travel-plan-members-heading">이전 참여자</p>
    <ul class="travel-plan-members-list">
      <li class="travel-plan-member" th:each="past : ${pastMembers}">
        <span class="travel-plan-member-name" th:text="${past.displayName}">테스트3</span>

        <!-- 이미 받아 준 사람에게는 버튼을 또 보여 주지 않는다 -->
        <span class="travel-plan-member-role" th:if="${past.rejoinAllowed}">
          재참여 허용됨
        </span>

        <span class="travel-plan-past-member-actions" th:unless="${past.rejoinAllowed}">
          <span class="travel-plan-member-role">내보낸 멤버</span>
          <form method="post"
                th:action="@{|/travel-plans/${planId}/members/${past.memberId}/allow-rejoin|}">
            <button type="submit" class="travel-plan-member-action"
                    th:attr="onclick=|return confirm('${past.displayName}님이 다시 초대 링크로 참여할 수 있게 할까요?\n\n참여자로 바로 복귀하는 것은 아니며, 본인이 초대 링크를 통해 다시 참여해야 합니다.')|">
              다시 참여 허용
            </button>
          </form>
        </span>
      </li>
    </ul>
  </div>

  <!-- 나가기는 MEMBER 본인에게만 보인다. 방장은 먼저 방장을 넘겨야 한다 -->
  <form class="travel-plan-member-leave-form" method="post"
        th:unless="${viewerIsOwner}"
        th:action="@{|/travel-plans/${planId}/members/leave|}">
    <button type="submit" class="travel-plan-member-leave"
            onclick="return confirm('이 여행 계획에서 나갈까요?\n\n작성했던 일정은 여행 계획에 그대로 남습니다.')">
      여행에서 나가기
    </button>
  </form>
</th:block>
</body>
</html>
