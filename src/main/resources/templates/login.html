<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | Travel Diary</title>
  <link rel="stylesheet" type="text/css" href="/css/style.css">
  <link rel="stylesheet" href="/css/login.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="login-page">
<main class="login-page__main">
  <a class="login-page__brand" th:href="@{/}" aria-label="Travel Diary 홈으로 이동">
    <img src="/images/logo7.png" alt="Travel Diary">
  </a>

  <section class="login-container" aria-labelledby="loginTitle">
    <header class="login-header">
      <h1 id="loginTitle">로그인</h1>
      <p>여행의 순간을 기록하고 다시 만나보세요.</p>
    </header>

    <div class="login-feedback login-feedback--error"
         th:if="${param.error}"
         role="alert"
         aria-live="assertive">
      아이디 또는 비밀번호가 올바르지 않습니다.
    </div>

    <div class="login-feedback login-feedback--error"
         th:if="${param.oauthError}"
         role="alert"
         aria-live="assertive">
      소셜 로그인에 실패했습니다. 다시 시도해 주세요.
    </div>

    <div class="login-feedback login-feedback--error"
         th:if="${param.socialSignupExpired}"
         role="alert"
         aria-live="assertive">
      소셜 로그인 정보가 만료되었습니다. 다시 로그인해주세요.
    </div>

    <div class="login-feedback login-feedback--error"
         th:if="${param.socialSignupError}"
         role="alert"
         aria-live="assertive">
      가입 후 로그인에 실패했습니다. 다시 로그인해주세요.
    </div>

    <div class="login-feedback login-feedback--success"
         th:if="${param.logout}"
         role="status">
      안전하게 로그아웃되었습니다.
    </div>

    <div class="login-feedback login-feedback--success"
         th:if="${param.passwordChanged != null and param.passwordChanged[0] == 'true'}"
         role="status">
      비밀번호가 변경되었습니다. 다시 로그인해주세요.
    </div>

    <form method="POST" th:action="@{/login}" id="loginForm" class="login-form">
      <input type="hidden" name="redirect" th:value="${param.redirect ?: '/'}">

      <div class="login-field">
        <label for="username">아이디</label>
        <input type="text"
               name="username"
               id="username"
               placeholder="아이디를 입력해주세요"
               autocomplete="username"
               required>
      </div>

      <div class="login-field">
        <label for="loginPassword">비밀번호</label>
        <div class="login-password-control">
          <input type="password"
                 id="loginPassword"
                 name="password"
                 placeholder="비밀번호를 입력해주세요"
                 autocomplete="current-password"
                 required>
          <button class="toggle-password hide"
                  type="button"
                  data-toggle="#loginPassword"
                  aria-label="비밀번호 표시"
                  aria-pressed="false"></button>
        </div>
      </div>

      <label class="remember-label" for="rememberId">
        <input type="checkbox" id="rememberId">
        <span>아이디 저장</span>
      </label>

      <button type="submit" class="login-submit">로그인</button>
    </form>

    <div class="social-login" aria-label="소셜 로그인">
      <div class="social-login__divider" aria-hidden="true">
        <span>또는</span>
      </div>
      <div class="social-login__buttons">
        <a class="social-login-button social-login-button--google"
           th:href="@{/oauth2/authorization/google}">
          <span class="social-login-button__icon" aria-hidden="true">
            <img src="/images/social/google-g-logo.png" alt="">
          </span>
          <span>Google로 계속하기</span>
        </a>
        <a class="social-login-button social-login-button--kakao"
           th:href="@{/oauth2/authorization/kakao}">
          <span class="social-login-button__icon" aria-hidden="true">
            <img src="/images/social/kakao-symbol.png" alt="">
          </span>
          <span>카카오로 계속하기</span>
        </a>
        <a class="social-login-button social-login-button--naver"
           th:href="@{/oauth2/authorization/naver}">
          <span class="social-login-button__icon" aria-hidden="true">
            <img src="/images/social/naver-symbol.png" alt="">
          </span>
          <span>네이버로 계속하기</span>
        </a>
      </div>
    </div>

    <nav class="account-recovery" aria-label="계정 찾기">
      <a th:href="@{/users/find-username}">아이디 찾기</a>
      <span aria-hidden="true"></span>
      <a th:href="@{/users/find-password}">비밀번호 찾기</a>
    </nav>

    <div class="signup-entry">
      <span>아직 회원이 아니신가요?</span>
      <a th:href="@{/users/register}">회원가입</a>
    </div>

    <p class="verification-resend-entry">
      이메일 인증이 완료되지 않았나요?
      <a th:href="@{/users/verification/resend}">인증메일 다시 받기</a>
    </p>
  </section>
</main>
<script src="/js/login.js" defer></script>
</body>
</html>
