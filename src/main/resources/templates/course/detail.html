<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::body}, ~{::headFragment})}">

<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/course-detail.css" />
  <link rel="stylesheet" href="/css/content-bookmark.css" />
  <link rel="stylesheet" href="/css/content-comment.css" />
  <script src="/js/course-comments.js" defer></script>
  <script src="/js/content-bookmarks.js" defer></script>
</th:block>

<th:block th:fragment="body">
  <main class="course-detail-container">
    <article class="course-summary">
      <header class="course-summary-header">
        <p class="course-summary-label">나만의 여행 코스</p>
        <div class="content-detail-title-row course-title-row">
          <h1 th:text="${course.title}">코스 제목</h1>
          <button type="button"
                  class="content-bookmark-button"
                  th:classappend="${course.bookmarked} ? ' is-bookmarked'"
                  th:data-bookmark-url="@{/bookmarks/courses/{id}(id=${course.id})}"
                  th:data-bookmarked="${course.bookmarked}"
                  th:attr="aria-pressed=${course.bookmarked}">
            <span class="content-bookmark-image" aria-hidden="true"></span>
            <span class="content-bookmark-label"
                  th:text="${course.bookmarked} ? '북마크 취소' : '북마크 저장'">북마크 저장</span>
          </button>
        </div>
        <dl class="course-meta">
          <div><dt>작성자</dt><dd th:text="${course.nickname}">작성자</dd></div>
          <div><dt>작성일</dt><dd th:text="${#dates.format(course.createdAt, 'yyyy-MM-dd HH:mm')}">작성일</dd></div>
          <div><dt>수정일</dt><dd th:text="${#dates.format(course.updatedAt, 'yyyy-MM-dd HH:mm')}">수정일</dd></div>
          <div><dt>조회수</dt><dd th:text="${course.views}">0</dd></div>
        </dl>
      </header>

      <section class="course-introduction">
        <h2>코스 소개</h2>
        <div class="course-introduction-content toastui-editor-contents"
             th:utext="${course.content}"></div>
      </section>
    </article>

    <section class="course-route" aria-labelledby="course-route-title">
      <div class="course-route-heading">
        <p>TRAVEL ROUTE</p>
        <h2 id="course-route-title">여행 동선</h2>
      </div>

      <div class="course-timeline" th:if="${course.stops != null and !course.stops.isEmpty()}">
        <article th:each="stop, stopStat : ${course.stops}"
                 class="course-stop"
                 th:classappend="${stopStat.odd} ? 'course-stop--left' : 'course-stop--right'">
          <div class="course-stop-marker" th:text="${stop.visitOrder}">1</div>

          <a class="course-stop-card"
             th:href="@{/destinations/{id}(id=${stop.destinationId})}">
            <div class="course-stop-image-wrap">
              <img class="course-stop-image"
                   th:src="${stop.imageUrl != null and !#strings.isEmpty(stop.imageUrl) ? stop.imageUrl : '/images/default.png'}"
                   th:alt="|${stop.name} 대표 이미지|"
                   loading="lazy" />
              <span class="course-stop-order" th:text="|STOP ${stop.visitOrder}|">STOP 1</span>
            </div>

            <div class="course-stop-body">
              <h3 th:text="${stop.name}">장소명</h3>
              <p class="course-stop-description"
                 th:if="${stop.shortDescription != null and !#strings.isEmpty(#strings.trim(stop.shortDescription))}"
                 th:text="${stop.shortDescription}">간단 설명</p>
              <p class="course-stop-region">
                <span>지역</span>
                <strong th:text="${stop.regionName}">지역명</strong>
              </p>
            </div>
          </a>
        </article>
      </div>

      <p class="course-route-empty"
         th:if="${course.stops == null or course.stops.isEmpty()}">등록된 여행지가 없습니다.</p>
    </section>

    <div class="course-detail-actions">
      <a th:href="@{/board/list(boardType='course')}">코스 목록으로</a>
      <a th:if="${course.myCourse}"
         th:href="@{/course/{id}/edit(id=${course.id})}">수정</a>
      <form th:if="${course.myCourse}"
            th:action="@{/course/{id}/delete(id=${course.id})}"
            method="post"
            onsubmit="return confirm('이 여행 코스를 삭제하시겠습니까?');">
        <button type="submit">삭제</button>
      </form>
    </div>

    <section id="course-comments" class="course-comments content-comments" th:attr="data-course-id=${course.id}">
      <div class="content-comment-toolbar">
        <h2 class="content-comment-heading">댓글 <span id="course-comment-count">0</span></h2>
        <div class="content-comment-sort" role="group" aria-label="댓글 정렬">
          <button type="button" class="is-active" data-comment-sort="latest" aria-pressed="true">최신순</button>
          <button type="button" data-comment-sort="oldest" aria-pressed="false">오래된순</button>
          <button type="button" data-comment-sort="likes" aria-pressed="false">좋아요순</button>
        </div>
      </div>

      <form id="course-comment-form" class="course-comment-form"
            th:if="${#authorization.expression('isAuthenticated()')}">
        <label for="course-comment-content" class="sr-only">댓글 내용</label>
        <textarea id="course-comment-content" name="content" maxlength="2000"
                  placeholder="댓글을 입력해 주세요." required></textarea>
        <div class="course-comment-form-actions">
          <span class="course-comment-length"><span id="course-comment-length">0</span>/2000</span>
          <button type="submit">등록</button>
        </div>
      </form>

      <p class="course-comment-login"
         th:unless="${#authorization.expression('isAuthenticated()')}">
        댓글을 작성하려면
        <a th:href="@{/login(redirect=${'/course/' + course.id})}">로그인</a>해 주세요.
      </p>

      <p id="course-comment-message" class="course-comment-message" role="alert" hidden></p>
      <ul id="course-comment-list" class="course-comment-list content-comment-list" aria-live="polite"></ul>
      <div class="content-comment-more-row">
        <button id="course-comment-more" type="button" class="content-comment-more" hidden>댓글 더보기</button>
      </div>
    </section>
  </main>
</th:block>
</html>
