<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/main :: layout(~{::body}, ~{::headFragment})">

<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/course-write.css" />
  <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
  <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js" defer></script>
  <script src="/js/editor-init.js" defer></script>
  <script src="/js/course-write.js" defer></script>
</th:block>

<th:block th:fragment="body">
  <div class="course-write-wrapper">
    <h1>나만의 여행코스 수정</h1>

    <form id="course-form"
          th:action="@{/course/{id}/edit(id=${course.id})}"
          method="post"
          class="write-form"
          data-initial-content-id="initial-content">
      <div class="form-group">
        <input type="text" name="title" th:value="${course.title}"
               placeholder="코스 제목을 입력하세요" maxlength="255" required class="input-text" />
      </div>

      <div class="form-group editor-group">
        <div id="editor"></div>
        <input type="hidden" name="content" id="content-input" />
        <textarea id="initial-content" hidden th:text="${course.content}"></textarea>
      </div>

      <div hidden aria-hidden="true">
        <span th:each="stop : ${course.stops}"
              data-initial-destination
              th:attr="data-destination-id=${stop.destinationId},
                       data-name=${stop.name},
                       data-region-name=${stop.regionName},
                       data-thumbnail-url=${stop.imageUrl}"></span>
      </div>

      <section class="course-destination-picker" aria-labelledby="destination-search-title">
        <div class="picker-heading">
          <h2 id="destination-search-title">여행지 검색</h2>
          <p>방문할 장소를 검색해 코스에 추가하세요.</p>
        </div>
        <div class="destination-search-controls">
          <label for="destination-search-input" class="sr-only">여행지 검색어</label>
          <input type="search" id="destination-search-input"
                 placeholder="장소명이나 지역을 검색하세요" autocomplete="off" />
          <button type="button" id="destination-search-button" class="btn btn-secondary">검색</button>
        </div>
        <p id="course-write-message" class="course-write-message" role="status" aria-live="polite"></p>
        <div id="destination-search-results" class="destination-search-results" aria-live="polite"></div>
      </section>

      <section class="selected-course-section" aria-labelledby="selected-course-title">
        <div class="picker-heading">
          <h2 id="selected-course-title">선택한 코스</h2>
          <p>위·아래 버튼으로 실제 방문 순서를 정하세요.</p>
        </div>
        <ol id="selected-destinations" class="selected-destinations"></ol>
        <div id="destination-id-inputs"></div>
      </section>

      <div class="button-group">
        <button type="submit" id="course-submit-button" class="btn btn-primary">수정 저장</button>
        <a th:href="@{/course/{id}(id=${course.id})}" class="btn btn-secondary">취소</a>
      </div>
    </form>
  </div>
</th:block>
</html>
