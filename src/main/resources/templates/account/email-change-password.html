<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:lang="${currentLanguageTag}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{account.emailChange.password.pageTitle}">본인 확인 | Travel Diary</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-page">
<div class="login-page__topbar">
  <div th:replace="~{fragments/language-menu :: languageMenu}"></div>
</div>

<main class="login-page__main">
  <span class="login-page__brand">
    <img src="/images/logo7.png" alt="Travel Diary">
  </span>

  <section class="login-container social-signup" aria-labelledby="emailChangePasswordTitle">
    <header class="login-header">
      <h1 id="emailChangePasswordTitle" th:text="#{account.emailChange.password.title}">
        본인 확인
      </h1>
      <p th:text="#{account.emailChange.password.description}">
        이메일 주소를 변경하려면 계정 비밀번호를 확인해주세요.
      </p>
    </header>

    <!-- 지금 인증을 기다리는 주소. 가려서만 보여준다. -->
    <div class="social-signup__account">
      <span th:text="#{account.emailChange.currentEmail}">현재 이메일</span>
      <strong id="maskedCurrentEmail" th:text="${maskedCurrentEmail}">mem***@example.com</strong>
    </div>

    <!-- 아이디는 서버가 이미 알고 있으므로 다시 입력받지 않는다. -->
    <form method="POST" th:action="@{/account/email-required/change/password}" class="login-form">
      <input type="hidden" th:if="${_csrf != null}"
             th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <div class="login-field">
        <label for="currentPassword" th:text="#{account.emailChange.password.label}">비밀번호</label>
        <input type="password" id="currentPassword" name="currentPassword"
               autocomplete="current-password" required autofocus
               aria-describedby="passwordServerError">
        <p class="social-signup__field-error" id="passwordServerError"
           th:if="${passwordError}" role="alert" th:text="${passwordError}">비밀번호 오류</p>
      </div>

      <button type="submit" class="login-submit"
              th:text="#{account.emailChange.password.submit}">확인</button>
    </form>

    <form method="POST" th:action="@{/account/email-required/change/cancel}" class="login-form">
      <input type="hidden" th:if="${_csrf != null}"
             th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit" class="social-signup__recommend-button" id="cancelPasswordCheck"
              th:text="#{account.emailChange.cancel}">취소</button>
    </form>
  </section>
</main>
<script src="/js/jquery-3.6.0.min.js"></script>
<script src="/js/language-menu.js" defer></script>
</body>
</html>
