<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:lang="${currentLanguageTag}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{account.emailChange.pageTitle}">이메일 주소 변경 | Travel Diary</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-page">
<div class="login-page__topbar">
  <div th:replace="~{fragments/language-menu :: languageMenu}"></div>
</div>

<main class="login-page__main">
  <span class="login-page__brand">
    <img src="/images/logo7.png" alt="Travel Diary">
  </span>

  <section class="login-container social-signup" aria-labelledby="emailChangeTitle">
    <header class="login-header">
      <h1 id="emailChangeTitle" th:text="#{account.emailChange.title}">이메일 주소 변경</h1>
      <p th:text="#{account.emailChange.description}">
        본인 확인이 끝났습니다. 인증메일을 받을 새 이메일 주소를 입력해주세요.
      </p>
    </header>

    <!-- 현재 이메일은 가려서만 보여준다. -->
    <div class="social-signup__account">
      <span th:text="#{account.emailChange.currentEmail}">현재 이메일</span>
      <strong id="maskedCurrentEmail" th:text="${maskedCurrentEmail}">mem***@example.com</strong>
    </div>

    <form method="POST" th:action="@{/account/email-required/change}" class="login-form">
      <input type="hidden" th:if="${_csrf != null}"
             th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <div class="login-field" id="accountEmailField"
           th:data-msg-available="#{account.emailRequired.email.available}"
           th:data-msg-unavailable="#{account.emailRequired.email.unavailable}"
           th:data-msg-invalid="#{signup.error.email.invalid}"
           th:data-msg-check-failed="#{signup.feedback.email.checkFailed}"
           data-status-url="/account/email-required/change/email-status">
        <label for="userEmail" th:text="#{account.emailChange.newEmail}">새 이메일</label>
        <div class="social-signup__nickname-row">
          <input type="email" id="userEmail" name="userEmail"
                 th:value="${enteredEmail}"
                 maxlength="100" autocomplete="email" inputmode="email"
                 th:placeholder="#{signup.social.email.placeholder}"
                 placeholder="example@gmail.com"
                 aria-describedby="emailMessage emailServerError" required>
          <button type="button" class="social-signup__recommend-button" id="checkEmailStatus"
                  th:text="#{signup.social.email.check}">중복확인</button>
        </div>
        <p id="emailMessage" class="social-signup__field-feedback" aria-live="polite"
           th:text="#{account.emailChange.newEmail.help}">
          새 이메일로 인증메일을 다시 보내드립니다.
        </p>
        <p class="social-signup__field-error" id="emailServerError"
           th:if="${emailError}" role="alert" th:text="${emailError}">이메일 오류</p>
      </div>

      <button type="submit" class="login-submit"
              th:text="#{account.emailChange.submit}">새 이메일로 인증메일 받기</button>
    </form>

    <p class="social-signup__notice" th:text="#{account.emailChange.oldLinkNotice}">
      변경하면 이전 이메일로 보낸 인증 링크는 즉시 사용할 수 없게 됩니다.
    </p>

    <form method="POST" th:action="@{/account/email-required/change/cancel}" class="login-form">
      <input type="hidden" th:if="${_csrf != null}"
             th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit" class="social-signup__recommend-button" id="cancelEmailChange"
              th:text="#{account.emailChange.cancel}">취소</button>
    </form>
  </section>
</main>
<script src="/js/jquery-3.6.0.min.js"></script>
<script src="/js/language-menu.js" defer></script>
<script src="/js/account-email-required.js" defer></script>
</body>
</html>
