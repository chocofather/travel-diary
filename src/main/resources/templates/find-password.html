<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 재설정</title>

    <!-- 공통 스타일을 이미 쓰고 계시다면 그대로 재사용 -->
    <link rel="stylesheet" href="/css/style.css">

    <style>
        /* 폼이 없을 때 대비한 최소 스타일 (선택) */
        .simple-form{
            max-width:360px;margin:80px auto;padding:30px;
            border:1px solid #ddd;border-radius:8px;background:#fff;
            box-shadow:0 4px 12px rgba(0,0,0,.06);
            display:flex;flex-direction:column;gap:14px;
        }
        .simple-form h2{margin-bottom:8px;text-align:center;}
        .simple-form input{
            padding:11px 12px;font-size:14px;border:1px solid #ccc;
            border-radius:6px;box-sizing:border-box;width:100%;
        }
        .simple-form button{
            padding:11px;font-size:15px;border:none;border-radius:6px;
            background:#0066cc;color:#fff;cursor:pointer;
        }
        .simple-form button:hover{background:#0056aa;}
        .alert{font-size:13px;text-align:center}
        .alert.success{color:green}.alert.error{color:red}
    </style>
</head>
<body>

<form th:action="@{/users/find-password}" method="post" class="simple-form">
    <h2>비밀번호 재설정</h2>

    <input type="text"
           name="username"
           placeholder="아이디"
           required>

    <input type="email"
           name="userEmail"
           placeholder="가입 시 이메일"
           required>

    <button type="submit">재설정 링크 보내기</button>

    <!-- 성공·실패 메시지 출력 -->
    <p th:text="${message}" class="alert success"></p>
    <p th:text="${error}"   class="alert error"></p>

    <p style="text-align:center;font-size:13px">
        <a th:href="@{/login}">로그인으로 돌아가기</a>
    </p>
</form>

</body>
</html>
