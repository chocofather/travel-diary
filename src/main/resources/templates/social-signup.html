<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소셜 회원가입 | Travel Diary</title>
  <link rel="stylesheet" type="text/css" href="/css/style.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-page">
<main class="login-page__main">
  <a class="login-page__brand" th:href="@{/}" aria-label="Travel Diary 홈으로 이동">
    <img src="/images/logo7.png" alt="Travel Diary">
  </a>

  <section class="login-container social-signup" aria-labelledby="socialSignupTitle">
    <header class="login-header">
      <h1 id="socialSignupTitle">가입을 완료해주세요</h1>
      <p>닉네임과 필수 약관 동의만 하면 바로 시작할 수 있습니다.</p>
    </header>

    <div class="social-signup__account" th:if="${providerEmail != null}">
      <span th:text="${providerDisplayName + ' 계정'}">소셜 계정</span>
      <strong th:text="${providerEmail}">travel@example.com</strong>
    </div>

    <form method="POST" th:action="@{/social-signup}"
          th:object="${socialSignupForm}" class="login-form">
      <div class="login-feedback login-feedback--error"
           th:if="${#fields.hasGlobalErrors()}" role="alert">
        <p th:each="error : ${#fields.globalErrors()}" th:text="${error}">가입 오류</p>
      </div>

      <div class="login-field">
        <label for="nickname">닉네임</label>
        <div class="social-signup__nickname-row">
          <input type="text" id="nickname" th:field="*{nickname}"
                 maxlength="12" autocomplete="nickname"
                 placeholder="2~12자 한글, 영문, 숫자"
                 aria-describedby="nicknameMessage nicknameServerError"
                 th:attr="aria-invalid=${#fields.hasErrors('nickname')}" required>
          <button type="button" class="social-signup__recommend-button" id="generateNickname">자동 추천</button>
        </div>
        <p id="nicknameMessage" class="social-signup__field-feedback" aria-live="polite">
          2~12자의 한글, 영문, 숫자만 사용할 수 있습니다. 공백·특수문자 및 부적절한 표현은 사용할 수 없습니다.
        </p>
        <p class="social-signup__field-error" th:if="${#fields.hasErrors('nickname')}"
           th:errors="*{nickname}" role="alert" id="nicknameServerError">닉네임 오류</p>
      </div>

      <div class="social-signup__consents">
        <label for="termsAccepted">
          <input type="checkbox" id="termsAccepted" th:field="*{termsAccepted}">
          <span><em>[필수]</em> 이용약관에 동의합니다.</span>
        </label>
        <p class="social-signup__field-error" th:if="${#fields.hasErrors('termsAccepted')}"
           th:errors="*{termsAccepted}" role="alert">이용약관 동의 오류</p>

        <label for="privacyAccepted">
          <input type="checkbox" id="privacyAccepted" th:field="*{privacyAccepted}">
          <span><em>[필수]</em> 개인정보 수집·이용에 동의합니다.</span>
        </label>
        <p class="social-signup__field-error" th:if="${#fields.hasErrors('privacyAccepted')}"
           th:errors="*{privacyAccepted}" role="alert">개인정보 동의 오류</p>
      </div>

      <p class="social-signup__notice">
        기존 계정과 동일한 이메일은 자동으로 연결되지 않습니다.
      </p>

      <button type="submit" class="login-submit">가입하고 시작하기</button>
    </form>
  </section>
</main>
<script src="/js/jquery-3.6.0.min.js"></script>
<script src="/js/nickname-availability.js" defer></script>
<script src="/js/social-signup.js" defer></script>
</body>
</html>
