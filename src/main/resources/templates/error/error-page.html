<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="errorPage(status, titleKey, descriptionKey)"
      th:lang="${#locale.toLanguageTag()}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <th:block th:replace="~{fragments/branding-head :: icons}"></th:block>
  <link rel="stylesheet" href="/css/error.css" />
  <title>Tripbora</title>
</head>
<body class="tripbora-error-page">
<main class="error-page" aria-labelledby="error-page-title">
  <section class="error-page__panel">
    <a class="error-page__brand" th:href="@{/}" aria-label="Tripbora">Tripbora</a>
    <p class="error-page__status" th:text="${status}">404</p>
    <h1 id="error-page-title" th:text="#{__${titleKey}__}">페이지를 찾을 수 없어요.</h1>
    <p class="error-page__description" th:text="#{__${descriptionKey}__}">
      주소가 변경되었거나 존재하지 않는 페이지일 수 있습니다.
    </p>
    <a class="error-page__home" th:href="@{/}" th:text="#{error.home}">홈으로</a>
  </section>
</main>
</body>
</html>
